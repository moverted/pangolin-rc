<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PangolinRC — Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --teal: #0d5c5c;
    --teal-dark: #093f3f;
    --mustard: #c8962c;
    --cream: #faf6ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--cream);
    background: radial-gradient(circle at 50% 0%, var(--teal) 0%, var(--teal-dark) 100%);
  }
  body { min-height: 100vh; }
  a { color: var(--mustard); }
  h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
  .sub { color: var(--mustard); font-size: 0.85rem; }

  /* Password gate */
  .gate {
    max-width: 360px; margin: 8vh auto 0;
    background: rgba(0,0,0,0.18); border-radius: 16px; padding: 28px 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25); text-align: center;
  }
  .gate h1 { margin-bottom: 4px; }
  .gate .sub { margin-bottom: 22px; }
  .gate label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 8px; text-align: left; }
  input[type="password"], input[type="search"], select {
    width: 100%; padding: 11px 13px; border-radius: 9px;
    border: 1px solid rgba(250,246,236,0.18); background: rgba(250,246,236,0.06);
    color: var(--cream); font-size: 0.95rem; outline: none;
  }
  input:focus, select:focus { border-color: var(--mustard); }
  button {
    background: var(--mustard); color: var(--teal-dark); font-weight: 700; font-size: 0.9rem;
    padding: 10px 18px; border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  button.ghost { background: rgba(250,246,236,0.1); color: var(--cream); box-shadow: none; }
  button:disabled { opacity: 0.5; cursor: default; }
  .gate button { margin-top: 16px; }
  .msg { margin-top: 14px; font-size: 0.85rem; min-height: 1.1em; }
  .msg.err { color: #ffcf8f; }

  /* App layout */
  .app { display: grid; grid-template-columns: 210px 1fr; min-height: 100vh; }
  .app.nav-collapsed { grid-template-columns: 1fr; }
  .app.nav-collapsed .side { display: none; }
  .navtoggle { background: rgba(250,246,236,0.1); color: var(--cream); box-shadow: none; font-size: 1rem; padding: 5px 12px; line-height: 1; }
  .side { background: rgba(0,0,0,0.22); padding: 22px 14px; border-right: 1px solid rgba(250,246,236,0.08); }
  .side h1 { font-size: 1.1rem; margin-bottom: 2px; }
  .side .sub { margin-bottom: 20px; }
  .navgroup { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(250,246,236,0.45); margin: 16px 0 6px; }
  .navitem {
    display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px;
    background: transparent; color: var(--cream); box-shadow: none; font-weight: 500;
    font-size: 0.9rem; cursor: pointer; margin-bottom: 2px;
  }
  .navitem:hover { background: rgba(250,246,236,0.06); }
  .navitem.active { background: var(--mustard); color: var(--teal-dark); font-weight: 700; }
  .navitem { display: flex; align-items: center; justify-content: space-between; }
  .navbadge { background: #d9534f; color: #fff; font-size: 0.7rem; font-weight: 700; border-radius: 999px; padding: 1px 7px; margin-left: 8px; }
  .navitem.active .navbadge { background: var(--teal-dark); color: var(--cream); }

  main { padding: 26px 28px 60px; min-width: 0; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  .note { font-size: 0.82rem; color: rgba(250,246,236,0.6); margin: 8px 0 16px; max-width: 820px; line-height: 1.45; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .controls input[type="search"] { width: 240px; }
  .controls select { width: auto; min-width: 130px; }
  .controls .spacer { flex: 1; }
  .count { font-size: 0.85rem; color: rgba(250,246,236,0.75); white-space: nowrap; }

  .tablecard { background: rgba(0,0,0,0.18); border-radius: 14px; padding: 6px; overflow-x: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 10px 12px; white-space: nowrap; vertical-align: top; }
  th { color: rgba(250,246,236,0.6); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid rgba(250,246,236,0.12); cursor: pointer; user-select: none; }
  th.nosort { cursor: default; }
  th .arrow { color: var(--mustard); }
  tbody tr { border-bottom: 1px solid rgba(250,246,236,0.07); }
  tbody tr:last-child { border-bottom: 0; }
  td.wrapcell { white-space: normal; max-width: 320px; }
  /* Message cell (Pierre chat content): wide, wraps, preserves line breaks → taller
     rows instead of left-right scroll. */
  td.msgcell { white-space: pre-wrap; word-break: break-word; max-width: 620px; min-width: 320px; line-height: 1.5; }
  /* Group header row: Session + User once per conversation, amber-tinted. */
  tr.group-header td { background: rgba(240,169,59,0.10); border-top: 2px solid rgba(240,169,59,0.5); padding: 11px 12px; white-space: normal; }
  .gh-k { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(250,246,236,0.5); }
  .gh-v { color: rgba(250,246,236,0.95); font-weight: 600; }
  .gh-sep { margin: 0 10px; color: rgba(240,169,59,0.6); }
  /* Collapsible sessions */
  tr.group-header td { cursor: pointer; }
  tr.group-header .gh-caret { color: rgba(240,169,59,0.9); margin-right: 7px; display: inline-block; width: 9px; }
  tr.group-header.needs td { border-top-color: #5fd6e0; background: rgba(95,214,224,0.10); }
  /* One reply bubble on a Get Ted row (blue Send, matching Ted's app voice) */
  /* Reply box lives in its own full-width row under a session. position:sticky keeps it in
     the viewport even when a wide table is scrolled sideways (so it is usable on a phone). */
  tr.reply-row td { background: rgba(95,214,224,0.06); border-top: 1px solid rgba(95,214,224,0.25); padding: 12px; }
  tr.reply-row .ted-reply { position: sticky; left: 12px; width: min(100%, calc(100vw - 40px)); }
  .ted-reply { display: flex; gap: 8px; align-items: flex-start; }
  .ted-reply-in { flex: 1; min-width: 150px; background: rgba(0,0,0,0.25); color: var(--cream); border: 1px solid rgba(250,246,236,0.18); border-radius: 8px; padding: 6px 8px; font-size: 0.82rem; font-family: inherit; resize: vertical; }
  .ted-reply-send { background: #5fd6e0; color: #06232a; border: 0; border-radius: 999px; font-weight: 700; font-size: 0.75rem; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .ted-reply-send:disabled { opacity: 0.6; cursor: default; }
  .needs-dot { color: #5fd6e0; font-weight: 700; }
  .muted { color: rgba(250,246,236,0.4); }
  td img.shot { max-height: 44px; border-radius: 5px; display: block; }
  audio.cmt-audio { height: 34px; width: 220px; }

  .pager { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 0.85rem; }
  .pager button { padding: 7px 14px; font-size: 0.82rem; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; background: rgba(250,246,236,0.1); }
  .pill.flag { background: #d9534f; color: #fff; font-weight: 700; }
  input.hide-chk { width: 17px; height: 17px; accent-color: #d9534f; cursor: pointer; }
  td select.edit-cell { width: auto; min-width: 118px; padding: 6px 8px; font-size: 0.82rem; cursor: pointer; transition: border-color 0.25s; }
  td select.edit-cell.ok { border-color: #9fe0b0; }
  td select.edit-cell.bad { border-color: #ffcf8f; }
  td input.edit-num { width: 74px; padding: 6px 8px; font-size: 0.82rem; background: rgba(0,0,0,0.25); color: inherit; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; transition: border-color 0.25s; }
  td input.edit-num.ok { border-color: #9fe0b0; }
  td input.edit-num.bad { border-color: #ffcf8f; }
  td textarea.edit-text { width: 100%; min-width: 150px; padding: 6px 8px; font-size: 0.82rem; background: rgba(0,0,0,0.25); color: inherit; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; resize: vertical; font-family: inherit; line-height: 1.4; transition: border-color 0.25s; }
  td textarea.edit-text.ok { border-color: #9fe0b0; }
  td textarea.edit-text.bad { border-color: #ffcf8f; }
  td input.edit-bool { width: 18px; height: 18px; accent-color: #9fe0b0; cursor: pointer; }
  /* Row reorder: a drag handle in the rank cell. */
  /* Cut header is a short label over a narrow checkbox column — keep it small + on one line. */
  th[data-key="hidden"] { font-size: 0.6rem; white-space: nowrap; letter-spacing: 0; }
  .rank-pfx { color: rgba(250,246,236,0.55); font-size: 0.78rem; margin-right: 2px; vertical-align: middle; }
  .row-grip { display: inline-block; margin-right: 6px; color: rgba(250,246,236,0.45); cursor: grab; user-select: none; font-size: 15px; vertical-align: middle; }
  .row-grip:active { cursor: grabbing; }
  tr.dragging { opacity: 0.5; background: rgba(240,169,59,0.12); }
  tr.drop-target td { box-shadow: inset 0 2px 0 var(--mustard); }
  /* Column resize: a grip on the right edge of each header cell. */
  th { position: relative; }
  /* Once columns are sized (fixed layout), let text cells soft-wrap instead of clipping when
     narrowed. Control cells (select/checkbox/number) keep their own min-widths and don't wrap. */
  table.fixedcols td, table.fixedcols th { white-space: normal; word-break: break-word; overflow-wrap: anywhere; }
  table.fixedcols td:has(> select.edit-cell), table.fixedcols td:has(> input.edit-cell) { white-space: nowrap; }
  th .col-grip { position: absolute; top: 0; right: 0; width: 8px; height: 100%; cursor: col-resize; user-select: none; touch-action: none; }
  th .col-grip:hover, th .col-grip.dragging { background: rgba(240,169,59,0.5); }
  .serial-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .serial { display: block; white-space: pre-wrap; max-width: 560px; font-size: 0.8rem; line-height: 1.5; color: rgba(250,246,236,0.9); }
  /* Per-episode "copy all comments" button — small, ghost, sits above the serial text. */
  button.copy-comments { background: rgba(250,246,236,0.1); color: var(--cream); box-shadow: none;
    font-size: 0.72rem; font-weight: 600; padding: 4px 10px; align-self: flex-start; }
  button.copy-comments:hover { background: rgba(250,246,236,0.18); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

  <!-- Password gate -->
  <div class="gate" id="gate">
    <h1>PangolinRC Admin</h1>
    <div class="sub">admin.pangolinrc.com</div>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <div><button id="unlock">Unlock</button></div>
    <div class="msg" id="gatemsg"></div>
  </div>

  <!-- App -->
  <div class="app" id="app" hidden>
    <nav class="side">
      <h1>Admin</h1>
      <div class="sub">PangolinRC</div>
      <div id="nav"></div>
    </nav>
    <main>
      <div class="head">
        <button class="navtoggle" id="navToggle" title="Show or hide the menu">☰</button>
        <h1 id="title"></h1>
        <div class="count" id="count"></div>
      </div>
      <div class="note" id="note" hidden></div>
      <div class="controls" id="controls"></div>
      <div class="tablecard"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
      <div class="pager" id="pager" hidden>
        <button class="ghost" id="prev">‹ Prev</button>
        <span id="range"></span>
        <button class="ghost" id="next">Next ›</button>
      </div>
    </main>
  </div>

<script>
  const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:8788' : 'https://pangolin-rc.edward-m-willett.workers.dev';
  const LIMIT = 100;

  let PW = sessionStorage.getItem('admin_pw') || '';
  let META = null;            // { resources: [...] }
  let cur = null;             // current resource meta
  const state = { q: '', filters: {}, sort: null, dir: 'desc', offset: 0, pivot: '' };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const fmtDate = (ms) => { const n = Number(ms); if (!n) return ''; try { return new Date(n).toISOString().slice(0,16).replace('T',' '); } catch { return ''; } };
  const isUrl = (v) => typeof v === 'string' && /^https?:\/\//.test(v);

  async function api(path) {
    const res = await fetch(API_BASE + path, { headers: { 'Authorization': 'Bearer ' + PW } });
    if (res.status === 401) throw { code: 401 };
    if (res.status === 503) throw { code: 503 };
    if (!res.ok) throw { code: res.status };
    return res.json();
  }

  async function apiPost(path, body) {
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + PW },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw { code: res.status };
    return res.json();
  }

  // Admin write: toggle a comment's hide flag. Optimistic; reverts on failure.
  async function onHideToggle(ev) {
    const chk = ev.target;
    const id = chk.closest('tr') && chk.closest('tr').dataset.id;
    if (!id) return;
    chk.disabled = true;
    try { await apiPost('/admin/comments/hide', { id, hidden: chk.checked }); }
    catch (_) { chk.checked = !chk.checked; }   // revert
    finally { chk.disabled = false; }
  }

  // Copy this episode's entire comment list to the clipboard — the serialized text
  // exactly as shown (mm:ss / SPLR / NOSP lines, one per comment). Reads the sibling
  // .serial span so it copies the raw, un-escaped text with its line breaks intact.
  async function onCopyComments(ev) {
    const btn = ev.currentTarget;
    const serial = btn.parentNode && btn.parentNode.querySelector('.serial');
    const text = serial ? serial.textContent : '';
    if (!text) return;
    const flash = (msg) => { const o = btn.textContent; btn.textContent = msg; btn.disabled = true;
      setTimeout(() => { btn.textContent = o; btn.disabled = false; }, 1200); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
      else { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
      flash('✓ Copied');
    } catch (_) { flash('✗ Failed'); }
  }

  // Ted answers an escalation: one bubble, one Send. Drops a TED message into the user's
  // chat (they see it next time they open the app) and marks the escalation handled.
  async function onTedReply(ev) {
    const btn = ev.currentTarget;
    const tr = btn.closest('tr');
    const id = btn.dataset.esc || (tr && tr.dataset.id) || '';
    const ta = tr && tr.querySelector('.ted-reply-in');
    const text = ta ? ta.value.trim() : '';
    if (!id || !text) { if (ta) ta.focus(); return; }
    const o = btn.textContent; btn.disabled = true; btn.textContent = 'Sending…';
    try {
      await apiPost('/admin/ted-reply', { id, text });
      btn.textContent = 'Sent ✓'; if (ta) ta.value = '';
      setTimeout(load, 700);   // refresh so this escalation flips to handled
    } catch (_) { btn.textContent = 'Failed'; btn.disabled = false; setTimeout(() => { btn.textContent = o; }, 1400); }
  }

  // Collapsible sessions.
  function setGroupCollapsed(gi, collapsed) {
    const hdr = $('tbody').querySelector(`tr.group-header[data-gi="${gi}"]`);
    if (hdr) { hdr.classList.toggle('collapsed', collapsed);
      const c = hdr.querySelector('.gh-caret'); if (c) c.textContent = collapsed ? '▸' : '▾'; }
    $('tbody').querySelectorAll(`tr[data-gi="${gi}"]:not(.group-header)`).forEach(r => { r.style.display = collapsed ? 'none' : ''; });
  }
  function toggleGroup(gi) {
    const hdr = $('tbody').querySelector(`tr.group-header[data-gi="${gi}"]`);
    setGroupCollapsed(gi, !(hdr && hdr.classList.contains('collapsed')));
  }

  // Admin write: inline-edit a row column (waitlist Status/Group). Row id is on the
  // <tr> (email for waitlist); the column key is on the <select>. Reverts to
  // data-prev on failure. Brief green/amber border flash on save.
  // Read the editor's current value as a string (checkbox → '1'/'0').
  function editVal(el) { return el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value; }
  // Save one inline editor. Autosave calls this on change; Save all calls it for dirty cells.
  async function saveEditCell(sel) {
    const tr = sel.closest('tr');
    const id = tr && tr.dataset.id;
    const key = sel.dataset.key;
    if (!id) return false;
    const value = editVal(sel);
    const wasDisabled = sel.disabled;
    sel.disabled = true;
    const flash = (cls) => { sel.classList.remove('ok', 'bad'); sel.classList.add(cls); setTimeout(() => sel.classList.remove(cls), 900); };
    try {
      await apiPost(`/admin/write/${cur.key}`, { id, key, value });
      sel.dataset.prev = value;
      flash('ok');
      return true;
    } catch (_) {
      if (sel.type === 'checkbox') sel.checked = sel.dataset.prev === '1';
      else sel.value = sel.dataset.prev || sel.value;   // revert
      flash('bad');
      return false;
    } finally { sel.disabled = wasDisabled; }
  }
  async function onEditCell(ev) {
    const el = ev.target;
    // Editing the rank NUMBER = "move to this position": reposition the row within its kind
    // and renumber the whole category (like a drag), so you never end up with dup ranks.
    if (cur.reorder && el.dataset.key === cur.reorder) return reorderByNumber(el);
    // Toggling the Cut column removes/returns a row from ranking → compact the scope so the
    // gap closes by shifting the rows below it UP (order preserved), not from the bottom.
    if (cur.reorder && cur.reorderCutCol && el.dataset.key === cur.reorderCutCol) {
      const ok = await saveEditCell(el);
      if (ok) {
        const tr = el.closest('tr');
        const isCut = el.type === 'checkbox' ? el.checked : el.value === '1';
        if (isCut) {
          // Leaving the ranking → blank this row's rank (0), then compact the rest so the gap
          // closes by shifting the ones below UP. (Restore does NOT renumber — the row comes
          // back unranked/blank so you place it where you want, avoiding a dup with siblings
          // that aren't loaded in the cut-only view.)
          const rankInp = tr.querySelector(`.edit-cell[data-key="${cur.reorder}"]`);
          if (rankInp && rankInp.value !== '0') { rankInp.value = '0'; await saveEditCell(rankInp); }
          await compactScope(tr);
        }
      }
      if (ok && state.filters[el.dataset.key] != null) load();
      return ok;
    }
    const ok = await saveEditCell(el);
    // If the edited column is actively filtered (e.g. ticking Cut while Cut?=kept), reload so
    // the row re-applies against the filter and drops out — still reachable by changing it.
    if (ok && state.filters[el.dataset.key] != null) load();
    return ok;
  }
  // Renumber a scope's still-ranked (not-cut) rows to 1..N by their current order — closes a
  // gap left by a cut (rows below shift up) without disturbing the order.
  async function compactScope(tr) {
    if (!tr) return;
    const rows = scopeRows(tr).filter(r => {
      const chk = r.querySelector(`.edit-cell[data-key="${cur.reorderCutCol}"]`);
      return !(chk && chk.type === 'checkbox' && chk.checked);   // skip cut rows
    });
    for (let i = 0; i < rows.length; i++) {
      const inp = rows[i].querySelector(`.edit-cell[data-key="${cur.reorder}"]`);
      if (!inp) continue;
      const want = String(i + 1);
      if (inp.value !== want) { inp.value = want; await saveEditCell(inp); }
    }
  }
  // Move a row to the typed position within its reorder scope, then renumber 1..N.
  async function reorderByNumber(inp) {
    const tr = inp.closest('tr'); if (!tr) return false;
    const others = scopeRows(tr).filter(r => r !== tr);
    const n = Math.max(1, Math.min(others.length + 1, Math.round(Number(inp.value) || 1)));
    const ref = others[n - 1] || null;           // the row currently at position n (0-based n-1)
    if (ref) tr.parentNode.insertBefore(tr, ref);
    else { const last = others[others.length - 1]; if (last) last.parentNode.insertBefore(tr, last.nextSibling); }
    await renumberScope(tr);                      // writes the new 1..N for the whole category
    return true;
  }
  // Save all: flush every inline editor whose value differs from its last-saved value.
  async function saveAllEdits() {
    const btn = $('saveall'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    const dirty = [...document.querySelectorAll('#tbody .edit-cell')].filter(el => editVal(el) !== (el.dataset.prev ?? ''));
    let ok = 0;
    for (const el of dirty) { if (await saveEditCell(el)) ok++; }
    if (btn) { btn.textContent = dirty.length ? `Saved ${ok}/${dirty.length}` : 'Nothing to save'; setTimeout(() => { btn.textContent = 'Save all'; btn.disabled = false; }, 1400); }
  }

  // ── Resizable columns (persisted per resource in localStorage) ──────────────
  const tableEl = () => $('thead').parentElement;
  const colWKey = () => 'admin_colw_' + (cur && cur.key);
  function loadColW() { try { return JSON.parse(localStorage.getItem(colWKey()) || '{}'); } catch (_) { return {}; } }
  function saveColW(o) { try { localStorage.setItem(colWKey(), JSON.stringify(o)); } catch (_) {} }
  function clearColgroup() { const cg = tableEl().querySelector('colgroup'); if (cg) cg.remove(); const t = tableEl(); t.style.tableLayout = 'auto'; t.classList.remove('fixedcols'); }
  // Minimum width a column may be dragged to: dropdowns/number/checkbox stay usable; text
  // columns can go narrow and soft-wrap.
  function colMinWidth(col) {
    if (col && cur.reorder && col.key === cur.reorder) return 120;  // grip + prefix + number input
    const k = col && col.edit && col.edit.kind;
    if (k === 'enum' || (col && col.edit && !k)) return 130;   // <select>
    if (k === 'int') return 80;                                 // number input
    if (k === 'bool') return 44;                                // checkbox
    return 48;                                                  // text / display
  }
  // Build a <colgroup> matching the rendered columns; apply any saved widths and switch to
  // fixed layout so those widths are honored. No saved widths => natural auto layout.
  function applyColgroup(cols) {
    const tbl = tableEl();
    let cg = tbl.querySelector('colgroup'); if (cg) cg.remove();
    cg = document.createElement('colgroup');
    const saved = loadColW(); let any = false;
    cols.forEach(c => { const col = document.createElement('col'); col.dataset.key = c.key; if (saved[c.key]) { col.style.width = saved[c.key] + 'px'; any = true; } cg.appendChild(col); });
    tbl.insertBefore(cg, tbl.firstChild);
    tbl.style.tableLayout = any ? 'fixed' : 'auto';
    tbl.classList.toggle('fixedcols', any);
    return cg;
  }
  function attachGrips(cols) {
    $('thead').querySelectorAll('th').forEach((th, i) => {
      const grip = document.createElement('span'); grip.className = 'col-grip';
      grip.addEventListener('click', e => e.stopPropagation());   // never triggers the sort
      grip.addEventListener('pointerdown', e => startColResize(e, i, grip, cols[i]));
      th.appendChild(grip);
    });
  }
  function startColResize(e, i, grip, colMeta) {
    e.preventDefault(); e.stopPropagation();
    const tbl = tableEl();
    const cg = tbl.querySelector('colgroup'); if (!cg) return;
    // First drag on an auto-layout table: freeze every column at its current width, then
    // switch to fixed so only the dragged column changes.
    if (tbl.style.tableLayout !== 'fixed') {
      const ths = [...$('thead').querySelectorAll('th')];
      [...cg.children].forEach((col, idx) => { if (ths[idx]) col.style.width = ths[idx].offsetWidth + 'px'; });
      tbl.style.tableLayout = 'fixed'; tbl.classList.add('fixedcols');
    }
    const col = cg.children[i];
    const minW = colMinWidth(colMeta);
    const startX = e.clientX, startW = parseFloat(col.style.width) || col.offsetWidth;
    grip.classList.add('dragging');
    const move = ev => { col.style.width = Math.max(minW, startW + (ev.clientX - startX)) + 'px'; };
    const up = () => {
      grip.classList.remove('dragging');
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      const o = {}; [...cg.children].forEach(c => { o[c.dataset.key] = Math.round(parseFloat(c.style.width) || c.offsetWidth); }); saveColW(o);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  }

  // ── Drag-to-reorder rows (persists a 1..N rank per group) ───────────────────
  let _dragRow = null;
  function enableRowReorder() {
    const tb = $('tbody');
    tb.querySelectorAll('tr[data-id]:not(.group-header)').forEach(tr => {
      const grip = tr.querySelector('.row-grip');
      if (grip) {
        // Only make the row draggable while the handle is held (so inputs stay usable).
        grip.addEventListener('mousedown', () => { tr.draggable = true; });
        tr.addEventListener('mouseup', () => { tr.draggable = false; });
      }
      tr.addEventListener('dragstart', e => { _dragRow = tr; tr.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', tr.dataset.id || ''); } catch (_) {} });
      tr.addEventListener('dragend', async () => {
        tr.draggable = false; tr.classList.remove('dragging');
        $('tbody').querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
        const row = _dragRow; _dragRow = null;
        if (row) await renumberScope(row);
      });
    });
    tb.ondragover = onRowDragOver;          // property assignment → never stacks across renders
    tb.ondrop = e => { e.preventDefault(); };
  }
  // The rows the dragged row may reorder among: same group, and — when ranks are per a
  // sub-key (e.g. per kind) — the same sub-key value too. Keeps a movie from landing in
  // the series list.
  function scopeRows(row) {
    const gi = row.dataset.gi;
    let sel = `tr[data-gi="${gi}"][data-id]:not(.group-header)`;
    if (cur.reorderScope) sel += `[data-rk="${(row.dataset.rk || '').replace(/"/g, '\\"')}"]`;
    return [...$('tbody').querySelectorAll(sel)];
  }
  function onRowDragOver(e) {
    if (!_dragRow) return;
    e.preventDefault();
    const rows = scopeRows(_dragRow);
    let target = null;
    for (const r of rows) { if (r === _dragRow) continue; const b = r.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { target = r; break; } }
    if (target) { if (_dragRow.nextSibling !== target) target.parentNode.insertBefore(_dragRow, target); }
    else { const last = rows[rows.length - 1]; if (last && last !== _dragRow) last.parentNode.insertBefore(_dragRow, last.nextSibling); }
  }
  async function renumberScope(row) {
    const rows = scopeRows(row);
    for (let i = 0; i < rows.length; i++) {
      const inp = rows[i].querySelector(`.edit-cell[data-key="${cur.reorder}"]`);
      if (!inp) continue;
      const want = String(i + 1);
      if (inp.value !== want) { inp.value = want; await saveEditCell(inp); }
    }
  }

  // ── Gate ──────────────────────────────────────────────────────────────────
  async function unlock() {
    const btn = $('unlock'), gatemsg = $('gatemsg');
    PW = $('pw').value;
    if (!PW) { gatemsg.className = 'msg err'; gatemsg.textContent = 'Enter the password.'; return; }
    btn.disabled = true; gatemsg.className = 'msg'; gatemsg.textContent = 'Checking…';
    try {
      META = await api('/admin/meta');
      sessionStorage.setItem('admin_pw', PW);
      $('gate').hidden = true; $('app').hidden = false;
      buildNav();
      select(META.resources[0].key);
    } catch (err) {
      sessionStorage.removeItem('admin_pw');
      gatemsg.className = 'msg err';
      gatemsg.textContent = err.code === 401 ? 'Wrong password.'
        : err.code === 503 ? 'Admin isn’t configured yet (USERS_ADMIN_PASSWORD not set).'
        : 'Could not load (' + (err.code || 'network') + ').';
    } finally { btn.disabled = false; }
  }

  // ── Nav ───────────────────────────────────────────────────────────────────
  function buildNav() {
    const nav = $('nav');
    const groups = { core: 'Core', secondary: 'Secondary' };
    nav.innerHTML = Object.entries(groups).map(([g, label]) => {
      const items = META.resources.filter(r => r.group === g);
      if (!items.length) return '';
      return `<div class="navgroup">${label}</div>` + items.map(r =>
        `<button class="navitem" data-key="${r.key}"><span>${esc(r.label)}</span>${r.badge ? `<span class="navbadge">${esc(r.badge)}</span>` : ''}</button>`).join('');
    }).join('');
    nav.querySelectorAll('.navitem').forEach(b => b.addEventListener('click', () => select(b.dataset.key)));
  }

  function select(key) {
    cur = META.resources.find(r => r.key === key);
    state.q = ''; state.filters = cur.defaultFilters ? { ...cur.defaultFilters } : {}; state.sort = cur.sortDefault; state.dir = 'desc'; state.offset = 0; state.pivot = '';
    document.querySelectorAll('.navitem').forEach(b => b.classList.toggle('active', b.dataset.key === key));
    $('title').textContent = cur.label;
    $('note').hidden = !cur.note;
    $('note').textContent = cur.note || '';
    buildControls();
    load();
  }

  // ── Controls (search / filters / pivot) ─────────────────────────────────────
  function buildControls() {
    const c = $('controls');
    let html = '';
    if (cur.search) html += `<input type="search" id="q" placeholder="Search…" value="${esc(state.q)}">`;
    for (const f of cur.filters) {
      html += `<select data-filter="${f.key}"><option value="">${esc(f.label)}: all</option></select>`;
    }
    if (cur.pivots.length) {
      html += `<select id="pivot"><option value="">Table view</option>` +
        cur.pivots.map(p => `<option value="${p.key}">◧ ${esc(p.label)}</option>`).join('') + `</select>`;
    }
    const hasEdits = (cur.columns || []).some(col => col.edit);
    html += `<span class="spacer"></span>`;
    if (hasEdits) html += `<button class="ghost" id="saveall">Save all</button>`;
    html += `<button class="ghost" id="refresh">Refresh</button>`;
    c.innerHTML = html;
    if (hasEdits) $('saveall').addEventListener('click', saveAllEdits);

    if (cur.search) {
      const q = $('q');
      let t; q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { state.q = q.value.trim(); state.offset = 0; load(); }, 250); });
    }
    for (const f of cur.filters) {
      const sel = c.querySelector(`select[data-filter="${f.key}"]`);
      // Options come from the resource meta when provided; otherwise the endpoint
      // still filters, we just can't prefill choices — leave as "all".
      (f.options || []).forEach(o => { const el = document.createElement('option'); el.value = o; el.textContent = `${f.label}: ${o}`; sel.appendChild(el); });
      if (!f.options) sel.disabled = true, sel.title = 'Type a value in search to filter; preset options not defined for this column.';
      if (state.filters[f.key] != null) sel.value = state.filters[f.key];   // reflect a default filter (e.g. Cut? = kept)
      sel.addEventListener('change', () => { if (sel.value) state.filters[f.key] = sel.value; else delete state.filters[f.key]; state.offset = 0; load(); });
    }
    const pv = $('pivot');
    if (pv) pv.addEventListener('change', () => { state.pivot = pv.value; state.offset = 0; load(); });
    $('refresh').addEventListener('click', load);
  }

  function queryString() {
    const p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    for (const [k, v] of Object.entries(state.filters)) p.set('f_' + k, v);
    return p;
  }

  // ── Load + render ───────────────────────────────────────────────────────────
  async function load() {
    try {
      if (state.pivot) return renderPivot(await api(`/admin/pivot/${cur.key}/${state.pivot}?` + queryString().toString()));
      const p = queryString();
      p.set('sort', state.sort); p.set('dir', state.dir);
      p.set('limit', LIMIT); p.set('offset', state.offset);
      renderTable(await api(`/admin/list/${cur.key}?` + p.toString()));
    } catch (err) {
      if (err.code === 401 || err.code === 503) { $('app').hidden = true; $('gate').hidden = false; return; }
      $('count').textContent = 'Error ' + (err.code || 'network');
    }
  }

  const PILL_COLS = ['mutual', 'done', 'kind', 'spoiler', 'shared', 'relationship', 'linked', 'is_default', 'list_type'];
  const RANK_PREFIX = { series: 'S', miniseries: 'M', anthology: 'A', film: 'F' };
  function cell(col, val, row) {
    // Inline-editable column (col.edit = {kind:'enum',options} → <select>, or
    // {kind:'int'} → number input): PATCHes
    // the row via POST /admin/write/:resource. Checked first so it wins over the
    // null/dash rendering below. data-prev holds the value to revert to on failure.
    if (col.edit) {
      const curVal = val == null ? '' : String(val);
      if (col.edit.kind === 'int') {
        const grip = (cur.reorder === col.key) ? `<span class="row-grip" title="Drag to reorder">⠿</span>` : '';
        // Rank 0 = unranked (e.g. a cut row) → show a blank cell, no prefix.
        const isReorder = cur.reorder === col.key;
        const shown = (isReorder && (curVal === '0' || curVal === '')) ? '' : curVal;
        const pk = (isReorder && cur.reorderScope && row && shown !== '') ? RANK_PREFIX[row[cur.reorderScope]] : null;
        const pfx = pk ? `<span class="rank-pfx">${pk}-</span>` : '';
        return `${grip}${pfx}<input type="number" min="0" step="1" class="edit-cell edit-num" data-key="${esc(col.key)}" data-prev="${esc(shown)}" value="${esc(shown)}">`;
      }
      if (col.edit.kind === 'bool') {
        const on = Number(val) ? ' checked' : '';
        return `<input type="checkbox" class="edit-cell edit-bool" data-key="${esc(col.key)}" data-prev="${Number(val) ? '1' : '0'}"${on}>`;
      }
      if (col.edit.kind === 'text') {
        return `<textarea class="edit-cell edit-text" rows="1" data-key="${esc(col.key)}" data-prev="${esc(curVal)}" placeholder="…">${esc(curVal)}</textarea>`;
      }
      const opts = (col.edit.options || []).map(o => `<option value="${esc(o)}"${o === curVal ? ' selected' : ''}>${esc(o)}</option>`).join('');
      return `<select class="edit-cell" data-key="${esc(col.key)}" data-prev="${esc(curVal)}">${opts}</select>`;
    }
    // Hide: the one write action — a checkbox that toggles watch_comment.hidden.
    if (col.key === 'hidden') return `<input type="checkbox" class="hide-chk"${Number(val) ? ' checked' : ''} title="Hide this comment">`;
    // One reply bubble on a Get Ted row: type and Send to drop a TED message into the user's chat.
    if (col.key === 'reply') return `<div class="ted-reply"><textarea class="ted-reply-in" rows="1" placeholder="Write back to the user…"></textarea><button class="ted-reply-send">Send</button></div>`;
    // Needs-a-reply flag on a Pierre-chat turn (drives session auto-collapse).
    if (col.key === 'needs_reply') return Number(val) ? '<span class="needs-dot" title="Needs a reply">● needs Ted</span>' : '<span class="muted">—</span>';
    // Reports: red pill when a comment has been flagged for review, muted 0 otherwise.
    if (col.key === 'flags') return Number(val) > 0 ? `<span class="pill flag">${esc(val)}</span>` : '<span class="muted">0</span>';
    // Audio: empty string means "no audio for this row"; a value is the comment id.
    if (col.key === 'audio') return (val == null || val === '') ? '<span class="muted">—</span>'
      : `<audio class="cmt-audio" controls preload="none" src="${API_BASE}/transcribe/audio/${encodeURIComponent(val)}"></audio>`;
    if (col.key === 'timecode') { const min = Math.max(0, Math.floor(Number(val) / 60000)); return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`; }
    // Serialized "All comments" feed: preserve the line breaks between comments, and
    // offer a one-tap copy of the whole episode's comment list (reads the .serial text).
    if (col.key === 'all_comments') return (val == null || val === '') ? '<span class="muted">—</span>'
      : `<div class="serial-wrap"><button type="button" class="copy-comments" title="Copy all comments for this episode">⧉ Copy</button><span class="serial">${esc(val)}</span></div>`;
    if (val == null || val === '') return '<span class="muted">—</span>';
    if (col.date) return esc(fmtDate(val));
    if (col.key === 'screenshot_url' && isUrl(val)) return `<a href="${esc(val)}" target="_blank" rel="noopener"><img class="shot" src="${esc(val)}" alt="shot"></a>`;
    if (isUrl(val)) return `<a href="${esc(val)}" target="_blank" rel="noopener">link ↗</a>`;
    if (val === '—') return '<span class="muted">—</span>';
    if (PILL_COLS.includes(col.key)) return `<span class="pill">${esc(val)}</span>`;
    const wrap = ['note', 'name', 'episode_name', 'show_name', 'transcription', 'excerpt', 'flaggers', 'all_comments', 'content', 'message', 'feel'].includes(col.key);
    return wrap ? `<span>${esc(val)}</span>` : esc(val);
  }

  function renderTable(data) {
    $('pager').hidden = false;
    // Columns shown once per group in a header row (e.g. Session + User) are dropped
    // from the per-row columns so they aren't repeated on every turn.
    const headerKeys = cur.groupHeaderCols || [];
    const headerMeta = headerKeys.map(k => cur.columns.find(c => c.key === k)).filter(Boolean);
    const cols = cur.columns.filter(c => !headerKeys.includes(c.key));
    $('thead').innerHTML = '<tr>' + cols.map(col => {
      const active = state.sort === col.key;
      const arrow = active ? ` <span class="arrow">${state.dir === 'asc' ? '▲' : '▼'}</span>` : '';
      return `<th data-key="${col.key}">${esc(col.label)}${arrow}</th>`;
    }).join('') + '</tr>';
    $('thead').querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.key;
      if (state.sort === k) state.dir = state.dir === 'asc' ? 'desc' : 'asc';
      else { state.sort = k; state.dir = 'desc'; }
      state.offset = 0; load();
    }));
    applyColgroup(cols);   // persisted column widths + resize grips
    attachGrips(cols);
    let _prevGroup = null, _gi = -1;
    const groupNeeds = {};   // group index -> any turn in it still needs a Ted reply
    $('tbody').innerHTML = data.rows.map(row => {
      let out = '';
      // A group-header row starts each new group (e.g. one per Pierre conversation),
      // carrying the Session/User once instead of repeating them on every turn.
      if (cur.groupBy) {
        const g = row[cur.groupBy];
        if (g !== _prevGroup) {
          _gi++; groupNeeds[_gi] = false;
          const hdr = headerMeta.map(c =>
            `<span class="gh-k">${esc(c.label)}</span> <span class="gh-v">${esc(row[c.key] == null ? '' : row[c.key])}</span>`
          ).join('<span class="gh-sep">·</span>');
          out += `<tr class="group-header" data-gi="${_gi}"><td colspan="${cols.length}"><span class="gh-caret">▾</span>${hdr}</td></tr>`;
        }
        _prevGroup = g;
        if (Number(row.needs_reply) === 1) groupNeeds[_gi] = true;
      }
      const giAttr = cur.groupBy ? ` data-gi="${_gi}"` : '';
      const escAttr = (Number(row.needs_reply) === 1) ? ` data-esc="${esc(row._id || '')}"` : '';
      const rkAttr = cur.reorderScope ? ` data-rk="${esc(row[cur.reorderScope] == null ? '' : row[cur.reorderScope])}"` : '';
      out += `<tr data-id="${esc(row._id || '')}"${giAttr}${escAttr}${rkAttr}>` + cols.map(col => {
        const msg = col.key === 'content' || col.key === 'message';
        const wrap = ['note','name','episode_name','show_name','transcription','excerpt','flaggers','all_comments','feel'].includes(col.key);
        const cls = msg ? 'msgcell' : (wrap ? 'wrapcell' : '');
        return `<td class="${cls}">${cell(col, row[col.key], row)}</td>`;
      }).join('') + '</tr>';
      return out;
    }).join('') || `<tr><td colspan="${cols.length}" class="muted" style="padding:22px">No rows.</td></tr>`;
    $('tbody').querySelectorAll('.hide-chk').forEach(chk => chk.addEventListener('change', onHideToggle));
    $('tbody').querySelectorAll('.edit-cell').forEach(sel => sel.addEventListener('change', onEditCell));
    if (cur.reorder) enableRowReorder();
    $('tbody').querySelectorAll('.copy-comments').forEach(btn => btn.addEventListener('click', onCopyComments));
    $('tbody').querySelectorAll('.ted-reply-send').forEach(btn => btn.addEventListener('click', onTedReply));
    // Collapsible sessions: click a header to toggle. When any session still needs a Ted
    // reply, auto-collapse the ones that do not, so the ones needing a response stand out.
    if (cur.groupBy) {
      const anyNeeds = Object.keys(groupNeeds).some(gi => groupNeeds[gi]);
      Object.keys(groupNeeds).forEach(gi => {
        const hdr = $('tbody').querySelector(`tr.group-header[data-gi="${gi}"]`);
        if (hdr && groupNeeds[gi]) hdr.classList.add('needs');
        setGroupCollapsed(gi, anyNeeds ? !groupNeeds[gi] : false);
      });
      $('tbody').querySelectorAll('tr.group-header').forEach(h =>
        h.addEventListener('click', () => toggleGroup(h.dataset.gi)));
    }
    // Get Ted: a full-width reply box under each session that needs Ted (works on a phone,
    // unlike a cramped table cell). Targets that session's escalation turn.
    if (cur.key === 'get_ted') {
      $('tbody').querySelectorAll('tr.group-header.needs').forEach(hdr => {
        const gi = hdr.dataset.gi;
        const rows = [...$('tbody').querySelectorAll(`tr[data-gi="${gi}"]:not(.group-header)`)];
        if (!rows.length) return;
        const escRow = rows.find(r => r.dataset.esc) || rows[rows.length - 1];
        const escId = (escRow && (escRow.dataset.esc || escRow.dataset.id)) || '';
        const tr = document.createElement('tr');
        tr.className = 'reply-row'; tr.dataset.gi = gi;
        tr.innerHTML = `<td colspan="${cols.length}"><div class="ted-reply"><textarea class="ted-reply-in" rows="2" placeholder="Write back to the user…"></textarea><button class="ted-reply-send" data-esc="${esc(escId)}">Send</button></div></td>`;
        rows[rows.length - 1].insertAdjacentElement('afterend', tr);
      });
      $('tbody').querySelectorAll('.ted-reply-send').forEach(b => b.addEventListener('click', onTedReply));
    }

    $('count').textContent = `${data.total.toLocaleString()} row${data.total === 1 ? '' : 's'}`;
    const from = data.total ? state.offset + 1 : 0;
    const to = Math.min(state.offset + LIMIT, data.total);
    $('range').textContent = `${from}–${to} of ${data.total.toLocaleString()}`;
    $('prev').disabled = state.offset === 0;
    $('next').disabled = to >= data.total;
  }

  function renderPivot(data) {
    $('pager').hidden = true;
    clearColgroup();   // pivot has its own columns; drop any table-view widths
    const cols = data.columns;
    $('thead').innerHTML = '<tr>' + cols.map(col => `<th class="nosort">${esc(col.label)}</th>`).join('') + '</tr>';
    $('tbody').innerHTML = data.rows.map(row => '<tr>' + cols.map(col => {
      const v = row[col.key];
      return `<td>${v == null || v === '' ? '<span class="muted">—</span>' : esc(v)}</td>`;
    }).join('') + '</tr>').join('') || `<tr><td colspan="${cols.length}" class="muted" style="padding:22px">No data.</td></tr>`;
    $('count').textContent = `${data.rows.length} group${data.rows.length === 1 ? '' : 's'}`;
  }

  $('prev').addEventListener('click', () => { state.offset = Math.max(0, state.offset - LIMIT); load(); });
  $('next').addEventListener('click', () => { state.offset += LIMIT; load(); });

  $('unlock').addEventListener('click', unlock);
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
  // Collapse or show the left nav.
  $('navToggle').addEventListener('click', () => $('app').classList.toggle('nav-collapsed'));
  if (PW) unlock();
</script>
</body>
</html>
