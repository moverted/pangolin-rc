<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#17120e; --panel:#211a13; --panel-2:#2b2218; --line:#3a2f22;
    --amber:#e89f3d; --text:#f3ebe0; --muted:#a7967f;
    --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0c0907}
  body{display:flex;align-items:center;justify-content:center;padding:16px;font-family:var(--body);color:var(--text)}
  .face{position:relative;width:min(92vw,420px);height:min(92vw,420px);
    background:radial-gradient(120% 80% at 50% -10%, #241b12 0%, var(--base) 60%);
    border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
  .head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;flex-shrink:0}
  .label{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--muted)}
  .badge{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--amber);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
  .body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:6px 14px 18px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  :root{ --notch:#0c0907; --tear:rgba(255,255,255,.45); }

  /* ─────────────────────────────────────────────────────────────────────────
     Activity card = a 1×1 square. Poster art fills the WHOLE card. A centered
     TOP block reads the activity as a sentence; a small blurry BOTTOM block holds
     the comment counter, WATCH, like, and the episode note + audio. Theater
     TICKET entries additionally get the perforated stub treatment. */
  .card{position:relative;aspect-ratio:1/1;margin-top:15px;border-radius:16px;overflow:hidden;isolation:isolate;
    display:flex;flex-direction:column;color:#f4ecdf;background:#16110d center/cover no-repeat;
    box-shadow:0 18px 36px -20px rgba(0,0,0,.92);animation:cardIn .32s ease both}
  .card.noart{background:linear-gradient(150deg,#3a2c1c,#17120e)}
  .card:first-child{margin-top:2px}
  /* scrim: darken top + bottom so both text zones read on any art */
  .card::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(12,9,7,.72) 0%,rgba(12,9,7,.2) 26%,rgba(12,9,7,.12) 55%,rgba(12,9,7,.68) 100%)}
  .card>*{position:relative;z-index:1}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  .card.bumped{animation:cardBump .6s cubic-bezier(.2,.9,.25,1) both}
  @keyframes cardBump{0%{transform:translateY(26px) scale(.97);opacity:.4;box-shadow:0 0 0 0 rgba(232,159,61,.0)}
    35%{box-shadow:0 0 0 2px rgba(232,159,61,.55)}100%{transform:none;opacity:1;box-shadow:0 18px 36px -20px rgba(0,0,0,.92)}}
  /* kind glyph — sits just BELOW the sentence (never over it); no box, just the mark */
  .c-kind{align-self:flex-start;margin:8px 0 0 12px;display:flex;color:var(--amber);
    filter:drop-shadow(0 1px 5px rgba(0,0,0,.9))}
  .c-kind .ico{width:32px;height:32px}

  /* ── TOP BLOCK — the activity as a centered sentence ── */
  .c-top{padding:12px 13px 0;text-align:center}
  .c-line1{font-family:var(--body);font-weight:600;font-size:12.5px;line-height:1.3;color:#eaded0;text-shadow:0 1px 8px rgba(0,0,0,.85);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .c-line1 .who{font-weight:700;color:#fff} .c-line1 .verb.done{color:#7fce9d;font-weight:700}
  .c-line1 .epn{font-style:italic;color:#f0e6d6} .c-line1 .show{font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.01em}
  .c-line1 .c-where{color:#d3ba90;font-weight:700}
  .c-line2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:8px}
  .c-line2 .ep{grid-column:2;justify-self:center;font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.06em;
    color:#f4ecdf;text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .c-line2 .c-date{grid-column:3;justify-self:end;font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:.06em;
    color:#d8c7ad;text-shadow:0 1px 5px rgba(0,0,0,.85)}
  .c-line2 .theater{grid-column:2 / span 2;justify-self:end;font-family:var(--mono);font-size:9px;font-weight:600;
    color:#d3ba90;text-shadow:0 1px 5px rgba(0,0,0,.85)}
  /* ticket line 2 — chip + "at THEATER on DATE" all on ONE line */
  .c-line2.tk{display:flex;align-items:center;gap:8px}
  .c-line2.tk .theater{flex:1 1 auto;min-width:0;grid-column:auto;justify-self:auto;text-align:right;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8.5px}
  /* relationship / follow chip lives at the left of line 2 — every state is tappable */
  .c-rel{grid-column:1;justify-self:start;font-family:var(--mono);font-size:7.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:2px 7px;color:#e9dcc6;
    background:rgba(0,0,0,.35);backdrop-filter:blur(2px);cursor:pointer}
  .c-rel:active{transform:scale(.94)}
  .c-rel.friend{color:#1c1a17;border-color:transparent;background:var(--amber)}
  .c-rel.following{color:#e9dcc6}
  .c-rel.follow{color:#1c1a17;border-color:transparent;background:#7fc99a}
  .c-rel.followback{color:#1c1a17;border-color:transparent;background:#6cc4e0}
  .c-rel.capped{color:#fff;border-color:transparent;background:#c25b4a}

  .c-fill{flex:1 1 auto;min-height:8px}

  /* ── BOTTOM — actions row (outside) + a small blurry note box (inside) ── */
  .c-actions{display:flex;align-items:center;gap:8px;padding:0 12px 7px;flex-wrap:wrap}
  /* binge stepper — ◀ EP ▶ to walk consecutively-watched episodes */
  .c-binge{display:flex;align-items:center;gap:3px;flex:0 0 auto;
    background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:2px 4px;backdrop-filter:blur(2px)}
  .c-step{border:none;background:none;padding:0;cursor:pointer;color:#f4ecdf;display:flex;align-items:center;justify-content:center;width:16px;height:16px}
  .c-step .ico{width:14px;height:14px}
  .c-step:disabled{opacity:.28;cursor:default}
  .c-step-ep{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.04em;color:#f4ecdf;min-width:42px;text-align:center}
  .c-synced{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--mono);font-size:8.5px;font-weight:600;
    color:#e4d7bf;text-shadow:0 1px 5px rgba(0,0,0,.85)}
  .c-synced .ico{width:13px;height:13px;flex:0 0 auto;opacity:.9}
  .c-pips{display:inline-flex;gap:3px;flex:0 0 auto}
  .c-pips i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
  .c-pips i.on{background:var(--amber);box-shadow:none}
  .c-synced .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-watch{margin-left:auto;flex:0 0 auto;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.1em;
    color:#f4ecdf;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 9px;cursor:pointer;backdrop-filter:blur(2px);white-space:nowrap}
  .c-watch.wide{font-size:7.5px;letter-spacing:.06em;padding:3px 8px}
  .c-watch:active{transform:scale(.95)}
  .c-like{flex:0 0 auto;width:26px;height:26px;border:none;background:none;padding:0;cursor:pointer;color:#f0e6d6;
    display:flex;align-items:center;justify-content:center}
  .c-like .ico{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2}
  .c-like.liked{color:#ff566f} .c-like.liked .ico{fill:currentColor;stroke:none}
  .c-like-n{flex:0 0 auto;margin-left:-3px;font-family:var(--mono);font-size:9px;font-weight:700;color:#f0e6d6;text-shadow:0 1px 5px rgba(0,0,0,.85)}
  .c-like:active{transform:scale(.85)}
  .c-flag{flex:0 0 auto;width:26px;height:26px;border:none;background:none;padding:0;cursor:pointer;color:#f0e6d6}
  .c-flag .ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
  .c-flag.flagged{color:#d9534f} .c-flag.flagged .ico{fill:currentColor;stroke:none}
  .c-flag:active{transform:scale(.85)}
  /* Flag glyph sits on the comment bubble (top-right of the note header). */
  .c-note .nhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .c-note .c-flag{width:22px;height:22px;opacity:.6}
  .c-note .c-flag .ico{width:15px;height:15px}
  .c-note .c-flag.flagged{opacity:1}

  /* the blurry note box */
  .c-bottom{margin:0 10px 10px;padding:7px 8px;display:flex;gap:8px;align-items:flex-start;border-radius:11px;
    background:rgba(12,9,7,.34);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(7px)}
  .c-note{display:flex;gap:8px;align-items:flex-start;width:100%}
  .c-note .body{flex:1 1 auto;min-width:0;padding:0;display:block}
  .c-note .tag{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:7.5px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:#8fdca9;margin-bottom:2px}
  .c-note.spoiler .tag{color:#eaa08f}
  .c-note .q{font-family:var(--display);font-weight:600;font-size:12px;line-height:1.28;color:#f4ecdf;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c-note.spoiler:not(.revealed){cursor:pointer}
  .c-note.spoiler:not(.revealed) .q{filter:blur(6px);opacity:.72;user-select:none}
  .c-note.spoiler.revealed .tag{color:#8fdca9}
  /* PREMIERES line for unreleased films */
  .c-premiere{width:100%;text-align:center;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;
    color:#f0e2c8;text-transform:uppercase}
  .c-premiere b{display:block;color:#fff;font-size:11px;margin-top:2px}

  /* icon glyphs (SVG, not emoji) */
  .ico{display:inline-block;vertical-align:middle;fill:currentColor}

  /* Audio button: a speaker glyph that, engaged, becomes ▶/❚❚ inside a progress ring */
  .c-audio{flex:0 0 auto;width:30px;height:30px;position:relative;border:none;background:none;cursor:pointer;padding:0;
    color:#f4ecdf;display:flex;align-items:center;justify-content:center}
  .c-audio .ring{width:30px;height:30px;position:absolute;inset:0;transform:rotate(-90deg)}
  .c-audio .ring-bg{stroke:rgba(255,255,255,.24);fill:none} .c-audio .ring-fg{stroke:var(--amber);fill:none;stroke-linecap:round;
    stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .15s linear}
  .c-audio .ico{width:15px;height:15px;position:relative;z-index:1}
  .c-audio .g{display:none}
  .c-audio.speaker .spk{display:block} .c-audio.speaker .ring{display:none}
  .c-audio:not(.speaker):not(.playing) .play{display:block}
  .c-audio.playing .pause{display:block}
  .c-note.spoiler:not(.revealed) .c-audio{display:none}

  /* ── TICKET ONLY: perforated stub — dashed tear + punched side-notches ── */
  .card.ticket .c-bottom{border-top:2px dashed var(--tear)}
  .card.ticket .c-bottom::before, .card.ticket .c-bottom::after{content:"";position:absolute;top:-9px;width:16px;height:16px;
    border-radius:50%;background:var(--notch);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);z-index:3}
  .card.ticket .c-bottom::before{left:-8px} .card.ticket .c-bottom::after{right:-8px}
  .card.ticket .c-bottom{position:relative;margin-left:0;margin-right:0;border-radius:0 0 16px 16px}

  .empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);font-size:13px;line-height:1.55;margin-top:8px}
  .empty b{color:var(--text);font-weight:600}
  /* Floating cube — back to cube navigation (shared across trunk sides) */
</style>
</head>
<body>
<div class="face">
  <div class="head"><span class="label">FEED</span><span class="badge">ACTIVITY</span></div>
  <div class="body" id="feed"></div>
</div>
<script>
// FEED posts the who / what / when / where of REAL activity: the member's own
// watch log (server truth from /profile/{email}/watch), newest first. No composer —
// every card is a real event you generated by finishing / watching / logging a show.
const API = (location.protocol === 'http:' && location.hostname === 'localhost') ? 'http://localhost:8787'
          : 'https://pangolin-rc.edward-m-willett.workers.dev';
const _esc  = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Dev-only URL overrides so a localhost feed can be opened with a plain link
// (?user=email&name=Name) without touching localStorage. Ignored off localhost.
const _q = new URLSearchParams(location.search);
const _dev = location.hostname === 'localhost';
const acct  = () => { try{ return (_dev && _q.get('user')) || localStorage.getItem('pg_user')||''; }catch(_){ return ''; } };
const uname = () => { try{ return ((_dev && _q.get('name')) || localStorage.getItem('pg_username')||'').trim(); }catch(_){ return ''; } };
function pad2(n){ n = parseInt(n,10); if(isNaN(n)) return ''; return (n<10?'0':'')+n; }
// Weighted-random rotation: each synonym starts with N votes; each use spends one
// of that word's votes; when every word is spent, all reset to N. Picking is
// weighted by remaining votes, so usage stays even with no immediate repeats.
// State is per-key and module-level (persists across renders for the session).
const _bag = {};
function weightedPick(key, words){
  let b = _bag[key];
  if(!b || words.every(w => (b[w]||0) <= 0)){ b = {}; for(const w of words) b[w] = words.length; _bag[key] = b; }
  const pool = words.filter(w => b[w] > 0);
  const total = pool.reduce((s,w) => s + b[w], 0);
  let r = Math.random() * total, pick = pool[pool.length - 1];
  for(const w of pool){ r -= b[w]; if(r <= 0){ pick = w; break; } }
  b[pick]--; return pick;
}
const BAIL_SYNONYMS = ['bailed on', 'gave up on', 'abandoned', 'quit'];
function verbFor(status, kind){
  const s = String(status||'').toLowerCase();
  if(kind === 'ticket') return 'saw';   // past default; feedCard uses 'bought a ticket for' for upcoming
  if(s === 'stopped') return weightedPick('bail', BAIL_SYNONYMS);
  if(kind === 'movie'){
    switch(s){
      case 'completed': return 'watched';
      case 'comfort':   return 'is rewatching';
      default:          return 'is watching';
    }
  }
  switch(s){
    case 'completed': return 'finished';
    case 'comfort':   return 'is rewatching';
    case 'returning': return 'caught up on';
    case 'current':   return 'is watching';
    default:          return 'is logging';
  }
}
// Short date for a past ticket ("Jun 20, 2023").
function fmtShort(s){
  if(!s) return '';
  const d = new Date(String(s).length <= 10 ? String(s) + 'T00:00:00' : String(s));
  if(isNaN(d.getTime())) return '';
  const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${MO[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}
function isFuture(s){ if(!s) return false; const d = new Date(String(s).length <= 10 ? String(s)+'T00:00:00' : String(s)); return !isNaN(d.getTime()) && d.getTime() > Date.now(); }
function fmtDate(ts){
  let n = Number(ts); if(!n) return ''; if(n < 1e12) n *= 1000;   // seconds → ms
  const d = new Date(n); if(isNaN(d.getTime())) return '';
  const wd = ['SUN','MON','TUES','WED','THURS','FRI','SAT'][d.getDay()];
  const mo = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];
  return `${wd}, ${d.getDate()} ${mo} ${d.getFullYear()}`;
}
// Premiere date → { future, label } for the "PREMIERES …" block. A film's public
// premiere IS OK to show even though it's in the future; a member's own future
// viewing date is not (we never render ticket_date).
function premiereInfo(s){
  if(!s) return null;
  const d = new Date(String(s) + 'T00:00:00'); if(isNaN(d.getTime())) return null;
  const WD = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const MO = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  return { future: d.getTime() > Date.now(), label: `${WD[d.getDay()]}, ${MO[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` };
}

// ── SVG glyphs (not emoji) ──
const ICON = {
  play:   '<svg class="ico g play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:  '<svg class="ico g pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  spk:    '<svg class="ico g spk" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M15.5 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  comment:'<svg class="ico" viewBox="0 0 24 24"><path d="M20 4H4a1 1 0 00-1 1v11a1 1 0 001 1h3v3l4-3h9a1 1 0 001-1V5a1 1 0 00-1-1z"/></svg>',
  heart:  '<svg class="ico" viewBox="0 0 24 24"><path d="M12 20.3l-1.3-1.2C6 14.9 3 12.1 3 8.8 3 6.2 5 4.2 7.5 4.2c1.5 0 2.9.7 3.8 1.9.9-1.2 2.3-1.9 3.8-1.9C17.6 4.2 19.6 6.2 19.6 8.8c0 3.3-3 6.1-7.7 10.3L12 20.3z"/></svg>',
  flag:   '<svg class="ico" viewBox="0 0 24 24"><path d="M5 21V4h13l-2.2 3.5L18 11H5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  // kind badges: series / streamed film / physical media / theater ticket
  tv:     '<svg class="ico" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3.5l4 3 4-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  film:   '<svg class="ico" viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="13" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 10.5l6-3v9l-6-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  dvd:    '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg>',
  ticket: '<svg class="ico" viewBox="0 0 24 24"><path d="M3 8a2 2 0 012-2h14a2 2 0 012 2 2 2 0 000 4 2 2 0 000 4 2 2 0 01-2 2H5a2 2 0 01-2-2 2 2 0 000-4 2 2 0 000-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  prev:   '<svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  next:   '<svg class="ico" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
// kind → the badge glyph. 'disc' reserved for physical-media watches.
function kindGlyph(kind){ return ICON[kind === 'ticket' ? 'ticket' : kind === 'movie' ? 'film' : kind === 'disc' ? 'dvd' : 'tv']; }
function pips(n){ const on = Math.min(n, 5); let s=''; for(let i=0;i<5;i++) s += `<i class="${i<on?'on':''}"></i>`; return s; }

// The end-of-episode note (inside the blurry box). NOSP → quote + speaker glyph. SPLR →
// blurred until tapped; revealed, the affordance is a ▶ play button with a progress ring.
function noteBlock(it){
  if(!it.endnote) return '';
  const audioUrl = (it.endnoteAudio && it.endnoteId) ? (API + '/transcribe/audio/' + encodeURIComponent(it.endnoteId)) : '';
  const btn = audioUrl
    ? `<button class="c-audio${it.endnoteSpoiler ? '' : ' speaker'}" data-audio="${_esc(audioUrl)}" aria-label="Play audio note">
         <svg class="ring" viewBox="0 0 30 30"><circle class="ring-bg" cx="15" cy="15" r="13" stroke-width="2" pathLength="1"/><circle class="ring-fg" cx="15" cy="15" r="13" stroke-width="2" pathLength="1"/></svg>
         ${ICON.spk}${ICON.play}${ICON.pause}</button>`
    : '';
  // The note is the LATEST episode's end-note, which can be an episode behind what
  // you're now watching — so we stamp which episode it's from to remove the ambiguity.
  const epLabel = (it.endnoteEp && it.endnoteEp !== '🎬') ? ` · ${_esc(it.endnoteEp)}` : '';
  const tag = (it.endnoteSpoiler ? '⚠ spoiler — tap to reveal' : 'episode note') + epLabel;
  // Report glyph lives ON the comment now (top-right of the bubble) — turns red once
  // reported, stays red across reloads. Reports THIS comment (the endnote).
  const flag = it.endnoteId
    ? `<button class="c-flag${_isFlagged(it.endnoteId) ? ' flagged' : ''}" data-cid="${_esc(it.endnoteId)}" aria-label="Report comment for review" title="Report for review">${ICON.flag}</button>`
    : '';
  return `<div class="c-note${it.endnoteSpoiler ? ' spoiler' : ''}" data-eplabel="${_esc(epLabel)}">
      <div class="body"><div class="nhead"><div class="tag">${tag}</div>${flag}</div><div class="q">“${_esc(it.endnote)}”</div></div>
      ${btn}
    </div>`;
}
// Relationship chip — every state is a two-way control:
//  Follow +   (neither)            → tap follows  → following
//  Follow Back(they follow you)    → tap follows  → friend  (pair now mutual)
//  following  (you follow, one-way)→ tap unfollows→ Follow +
//  friend     (mutual)             → tap unfollows→ Follow Back (they still follow you)
function relChip(it){
  if(it.rel === 'self')      return '';
  const em = _esc(it.actorEmail);
  if(it.rel === 'friend')    return `<button class="c-rel friend" data-email="${em}" data-act="unfollow" data-from="friend">friend</button>`;
  if(it.rel === 'following') return `<button class="c-rel following" data-email="${em}" data-act="unfollow" data-from="following">following</button>`;
  if(it.rel === 'follower')  return `<button class="c-rel followback" data-email="${em}" data-act="follow" data-to="friend">Follow Back</button>`;
  return `<button class="c-rel follow" data-email="${em}" data-act="follow" data-to="following">Follow +</button>`;
}
// ── Binge cycler: a card for a binged show carries every content-bearing episode
//    (synced comments or an end-note). The foot renders ONE selected episode and, when
//    there's more than one, a ◀ EP ▶ stepper to walk the consecutively-watched run. ──
const _foot = {};   // card key -> { it, sel }
function _epList(it){ return (it.episodes && it.episodes.length) ? it.episodes : []; }
function defaultSel(it){
  const eps = _epList(it); if(!eps.length) return 0;
  for(let i=eps.length-1;i>=0;i--) if(eps[i].endnote_text) return i;   // surface the newest note
  return eps.length - 1;
}
function selectedEp(it, sel){
  const eps = _epList(it);
  if(!eps.length) return { ep: it.ep, synced: it.synced, endnote: it.endnote, endnoteSpoiler: it.endnoteSpoiler, endnoteId: it.endnoteId, endnoteAudio: it.endnoteAudio, endnoteEp: it.endnoteEp };
  const e = eps[Math.max(0, Math.min(sel, eps.length-1))];
  return { ep: e.ep, synced: e.synced, endnote: e.endnote_text||'', endnoteSpoiler: !!e.endnote_spoiler, endnoteId: e.endnote_id||'', endnoteAudio: !!e.endnote_audio, endnoteEp: e.ep };
}
function renderFoot(it, sel){
  const eps = _epList(it), se = selectedEp(it, sel), multi = eps.length > 1;
  const n = Math.min(se.synced, 5);
  const label = multi ? `${n}/5` : `${n} of 5 sync comments`;
  const left = se.synced > 0
    ? `<div class="c-synced">${ICON.comment}<span class="c-pips">${pips(se.synced)}</span><span class="lbl">${label}</span></div>`
    : '<div class="c-synced"></div>';
  const stepper = multi
    ? `<div class="c-binge"><button class="c-step" data-key="${_esc(it.key)}" data-d="-1"${sel<=0?' disabled':''} aria-label="Previous episode">${ICON.prev}</button><span class="c-step-ep">${_esc(se.ep)}</span><button class="c-step" data-key="${_esc(it.key)}" data-d="1"${sel>=eps.length-1?' disabled':''} aria-label="Next episode">${ICON.next}</button></div>`
    : '';
  // WATCH deep-links the viewer's LOG to the SELECTED episode.
  const watch = it.kind === 'show'
    ? `<button class="c-watch${se.synced>0?' wide':''}" data-id="${_esc(it.id)}" data-ep="${_esc(se.ep)}">${se.synced>0?'WATCH WITH COMMENTS':'WATCH'}</button>`
    : '';
  const likeCls = 'c-like' + (it.liked ? ' liked' : '') + (watch ? '' : ' solo');
  const likeCt = it.likeCt > 0 ? `<span class="c-like-n">${it.likeCt}</span>` : '';
  const actions = `<div class="c-actions">${left}${stepper}${watch}<button class="${likeCls}" data-key="${_esc(it.key)}" data-subject="${_esc(it.actorEmail)}" data-title="${_esc(it.id)}" data-kind="${_esc(it.kind)}" aria-label="Like">${ICON.heart}</button>${likeCt}</div>`;
  const note = se.endnote ? `<div class="c-bottom">${noteBlock(se)}</div>` : '';
  return actions + note;
}
function feedCard(it){
  const isTicket = it.kind === 'ticket';
  const who = _esc(it.who), show = _esc(it.show);
  // Kind badge sits BELOW the sentence (left), so it never crashes into the copy.
  const kindChip = `<div class="c-kind" aria-hidden="true">${kindGlyph(it.kind)}</div>`;
  // LINE 1 — the activity as a sentence. Episode phrasing is for SERIES only —
  // a film reads "…bailed on HIGH FIDELITY", never "…episode of".
  const epn = (it.kind === 'show' && it.episodeName) ? `<span class="epn">“${_esc(it.episodeName)}”</span> episode of ` : '';
  const whereSpan = isTicket ? '' : '<span class="c-where"></span>';   // streamer filled async
  const line1 = `<span class="who">${who}</span> <span class="verb${it.done?' done':''}">${_esc(it.verb)}</span> ${epn}<span class="show">${show}</span>${whereSpan}`;
  // LINE 2 — chip · episode · date.  Ticket: chip · "at THEATER [on <date>]"
  let line2;
  if(isTicket){
    const at = it.theater ? 'at ' + _esc(it.theater) : 'in theaters';
    const on = (!it.upcoming && it.ticketDate) ? ' on ' + _esc(fmtShort(it.ticketDate)) : '';
    line2 = `${relChip(it)}<span class="theater">${at}${on}</span>`;
  } else {
    line2 = `${relChip(it)}${it.ep ? `<span class="ep">${_esc(it.ep)}</span>` : ''}<span class="c-date">${_esc(it.date)}</span>`;
  }
  // FOOT — upcoming film shows only PREMIERES; else the actions row + note, driven by
  // the selected (binge) episode. Stash state so the stepper can re-render in place.
  const showPremiere = it.upcoming && it.premiere;
  const sel = defaultSel(it);
  _foot[it.key] = { it, sel };
  const foot = showPremiere
    ? `<div class="c-bottom"><div class="c-premiere">Premieres<b>${_esc(it.premiere.label)}</b></div></div>`
    : renderFoot(it, sel);
  const cls = 'card noart' + (isTicket ? ' ticket' : '');
  return `<article class="${cls}" data-key="${_esc(it.key)}">
    <div class="c-top"><div class="c-line1">${line1}</div><div class="c-line2${isTicket?' tk':''}">${line2}</div></div>
    ${kindChip}
    <div class="c-fill"></div>
    <div class="c-foot" data-key="${_esc(it.key)}">${foot}</div>
  </article>`;
}
function emptyState(msg){ return `<div class="empty"><b>Activity posts here.</b><br>${_esc(msg)}</div>`; }

const _meta = {};   // show_id -> { img, where }  (TVMaze: poster + streamer)
async function showMeta(id){
  if(id == null) return null;
  if(_meta[id] !== undefined) return _meta[id];
  try{
    // A film: poster comes from TMDB (our proxy), not TVmaze.
    if(String(id).startsWith('tmdb:')){
      const rid = String(id).replace(/^tmdb:/, '');
      const r = await fetch(API + '/tmdb/movie/' + encodeURIComponent(rid));
      if(!r.ok){ _meta[id] = null; return null; }
      const d = await r.json();
      _meta[id] = { img:(d.movie && d.movie.poster) || '', where:'' };
      return _meta[id];
    }
    // show_id is the prefixed title_id ('tvmaze:81110'); TVmaze wants the bare id.
    const rid = String(id).replace(/^tvmaze:/, '');
    const r = await fetch('https://api.tvmaze.com/shows/' + encodeURIComponent(rid));
    if(!r.ok){ _meta[id] = null; return null; }
    const d = await r.json();
    _meta[id] = { img:(d.image && (d.image.medium || d.image.original)) || '',
                  where:(d.network && d.network.name) || (d.webChannel && d.webChannel.name) || '' };
  }catch(_){ _meta[id] = null; }
  return _meta[id];
}

let _loading = false;
async function loadFeed(){
  const el = document.getElementById('feed'); if(!el || _loading) return;
  _loading = true;
  try{
    if(typeof _stopAudio === 'function') _stopAudio(); // the DOM (and its ▶ buttons) is about to be replaced
    const email = acct();
    if(!email){ el.innerHTML = emptyState('Sign in and your feed — yours, friends’, and people you follow — shows up here.'); return; }
    let feed = [];
    try{ const r = await fetch(API + '/profile/' + encodeURIComponent(email) + '/feed');
      if(r.ok){ const d = await r.json(); feed = (d && d.feed) || []; } }catch(_){}
    if(!feed.length){ el.innerHTML = emptyState('No activity yet. Follow people in Profile, or log a show — yours and theirs lands here. Nothing faked.'); return; }
    const me = uname() || 'You';
    const items = feed.map(row => {
      const isSelf = row.relationship === 'self';
      const done = ['completed','returning'].includes(String(row.status||'').toLowerCase());
      const ep = (row.kind !== 'movie' && row.kind !== 'ticket' && row.last_season && row.last_number)
        ? ('S' + pad2(row.last_season) + 'E' + pad2(row.last_number)) : '';
      // A ticket is "upcoming" if the film hasn't premiered yet (or the ticket date
      // is still in the future) → "bought a ticket for" + PREMIERES; else "saw … on <date>".
      const premiere = premiereInfo(row.premiered);
      const upcoming = row.kind === 'ticket' && ((premiere && premiere.future) || isFuture(row.ticket_date));
      let verb = row.kind === 'ticket' ? (upcoming ? 'bought a ticket for' : 'saw') : verbFor(row.status, row.kind);
      if(isSelf) verb = verb.replace(/^is\b/, 'are');   // "You are watching", not "You is watching"
      return {
        who: isSelf ? 'You' : (row.actor || String(row.actor_email||'').split('@')[0] || 'Someone'),
        rel: row.relationship, actorEmail: row.actor_email || '',
        verb, kind: row.kind, done,
        ep, show: row.show_name || (row.kind === 'movie' || row.kind === 'ticket' ? 'a film' : 'a show'),
        episodeName: row.last_name || '',
        date: fmtDate(row.updated_at), id: row.show_id, poster: row.poster || '',
        theater: row.theater || '', ticketDate: row.ticket_date || '', upcoming,
        synced: Number(row.synced_ct) || 0, premiere,
        endnote: row.endnote_text || '', endnoteSpoiler: !!row.endnote_spoiler,
        endnoteId: row.endnote_id || '', endnoteAudio: !!row.endnote_audio, endnoteEp: row.endnote_ep || '',
        episodes: Array.isArray(row.episodes) ? row.episodes : [],
        liked: !!row.liked, likeCt: Number(row.like_ct) || 0,
        // a stable identity for the row (actor + title), so a re-render can tell an
        // UPDATED card (same key, new content) from a brand-new one — used to bump it.
        key: (row.actor_email||'') + '|' + (row.show_id||'') + '|' + (row.kind||''),
      };
    });
    // Which keys were already on screen before this render? Any key that was here
    // before but is now at the very top with changed content = "just happened" → bump.
    const prevTopKey = el.querySelector('.card')?.getAttribute('data-key') || '';
    const prevKeys = new Set([...el.querySelectorAll('.card')].map(c => c.getAttribute('data-key')));
    el.innerHTML = items.map(feedCard).join('');
    const cards = el.querySelectorAll('.card');
    // Animate the top card when its activity moved it up (key already existed but is
    // now #1, or it's a fresh key landing at the top over an existing feed).
    if(items.length && cards[0]){
      const topKey = items[0].key;
      if(topKey !== prevTopKey && (prevKeys.has(topKey) || prevKeys.size)) cards[0].classList.add('bumped');
    }
    // Paint any poster we already have from the API immediately, then fill gaps
    // (poster / streamer name) from TVmaze/TMDB lazily so the art shows up fast.
    const paint = (card, img) => { if(card && img){ card.style.backgroundImage = `url('${img}')`; card.classList.remove('noart'); } };
    items.forEach((it, i) => { if(it.poster) paint(cards[i], it.poster); });
    items.forEach(async (it, i) => {
      const card = cards[i]; if(!card) return;
      // Only reach out to TVmaze/TMDB when we actually still need something. A movie
      // ticket already carries its poster (from the API) and its where (the theater),
      // so hitting /tmdb/movie for it is a pure wasted round-trip — skip it.
      const needPoster = !it.poster;
      const needWhere  = it.kind !== 'ticket' && it.kind !== 'movie'; // films have no streamer
      if(!needPoster && !needWhere) return;
      const meta = await showMeta(it.id); if(!meta) return;
      if(meta.img && needPoster) paint(card, meta.img);
      if(meta.where && needWhere){ const w = card.querySelector('.c-where'); if(w && !w.textContent) w.textContent = ' on ' + meta.where; }
    });
  } finally { _loading = false; }
}
// ── Audio: one shared player, one ▶ at a time, with a circular progress ring ──
let _audio = null, _audioBtn = null, _raf = 0;
function _setRing(btn, p){ const fg = btn.querySelector('.ring-fg'); if(fg) fg.style.strokeDashoffset = String(1 - Math.max(0, Math.min(1, p))); }
function _stopAudio(){
  if(_raf) cancelAnimationFrame(_raf), _raf = 0;
  if(_audio){ _audio.pause(); _audio.src = ''; _audio = null; }
  if(_audioBtn){ _audioBtn.classList.remove('playing'); _setRing(_audioBtn, 0); _audioBtn = null; }
}
function _tick(){ if(_audio && _audioBtn && _audio.duration){ _setRing(_audioBtn, _audio.currentTime / _audio.duration); _raf = requestAnimationFrame(_tick); } }
function playAudio(btn){
  const url = btn.getAttribute('data-audio'); if(!url) return;
  // tapping the one that's playing → pause/stop; tapping a new one → switch to it
  if(_audioBtn === btn && _audio && !_audio.paused){ _stopAudio(); return; }
  _stopAudio();
  btn.classList.remove('speaker');           // 🔊 → the ▶/❚❚ + ring player
  _audioBtn = btn; _audio = new Audio(url);
  // Drive the UI off real media events (resilient to buffering) rather than the
  // play() promise alone: ❚❚ + ring while playing, back to ▶ on pause/end.
  _audio.addEventListener('playing', () => { btn.classList.add('playing'); if(!_raf) _tick(); });
  _audio.addEventListener('pause',   () => { btn.classList.remove('playing'); });
  _audio.addEventListener('ended',   _stopAudio);
  _audio.addEventListener('error',   _stopAudio);
  _audio.play().catch(() => {});
}

// Two-way follow control, swapped in place. The resulting chip is derived from what
// the action does to the pair:
//   follow  +to=following → "following"  (unless they already follow you → "friend")
//   follow  +to=friend    → "friend"     (following back an inbound follower)
//   unfollow from=friend  → "Follow Back"(they still follow you)
//   unfollow from=following→ "Follow +"  (neither now follows)
function makeChip(rel, email){
  const b = document.createElement('button'); b.className = 'c-rel'; b.dataset.email = email;
  if(rel === 'friend'){ b.classList.add('friend'); b.textContent = 'friend'; b.dataset.act = 'unfollow'; b.dataset.from = 'friend'; }
  else if(rel === 'following'){ b.classList.add('following'); b.textContent = 'following'; b.dataset.act = 'unfollow'; b.dataset.from = 'following'; }
  else if(rel === 'follower'){ b.classList.add('followback'); b.textContent = 'Follow Back'; b.dataset.act = 'follow'; b.dataset.to = 'friend'; }
  else { b.classList.add('follow'); b.textContent = 'Follow +'; b.dataset.act = 'follow'; b.dataset.to = 'following'; }
  return b;
}
async function followAct(btn){
  const target = btn.getAttribute('data-email'), me = acct();
  const act = btn.getAttribute('data-act');
  if(!target || !me) return;
  btn.disabled = true; const prevHTML = btn.textContent; btn.textContent = '…';
  try{
    let nextRel;
    if(act === 'unfollow'){
      const r = await fetch(API + '/profile/' + encodeURIComponent(me) + '/follow/' + encodeURIComponent(target), { method:'DELETE' });
      if(!r.ok) throw 0;
      nextRel = btn.getAttribute('data-from') === 'friend' ? 'follower' : 'none';
    } else {
      const r = await fetch(API + '/profile/' + encodeURIComponent(me) + '/follow', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ target }) });
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw (d && d.error) || 0;
      nextRel = (btn.getAttribute('data-to') === 'friend' || d.friend) ? 'friend' : 'following';
    }
    btn.replaceWith(makeChip(nextRel, target));
  }catch(err){
    // Friend slots are tier-capped — following back when full completes no pair. Say so
    // instead of silently reverting, then restore the button.
    if(err === 'slot_limit'){ btn.textContent = 'slots full'; btn.classList.add('capped'); setTimeout(()=>{ btn.textContent = prevHTML; btn.classList.remove('capped'); btn.disabled = false; }, 1600); }
    else { btn.textContent = prevHTML; btn.disabled = false; }
  }
}

// Like / unlike a member's activity, server-backed with a live count.
async function likeAct(btn){
  const me = acct(); if(!me) return;
  const nowLiked = !btn.classList.contains('liked');
  btn.classList.toggle('liked', nowLiked);   // optimistic
  const nEl = btn.parentElement.querySelector('.c-like-n');
  try{
    const r = await fetch(API + '/profile/' + encodeURIComponent(me) + '/like', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ subject: btn.dataset.subject, title_id: btn.dataset.title, kind: btn.dataset.kind, liked: nowLiked }) });
    const d = await r.json().catch(()=>({}));
    if(r.ok){
      const n = Number(d.count) || 0;
      if(nEl) nEl.textContent = n > 0 ? String(n) : '';
      else if(n > 0){ const s = document.createElement('span'); s.className = 'c-like-n'; s.textContent = n; btn.after(s); }
      btn.classList.toggle('liked', !!d.liked);
    } else { btn.classList.toggle('liked', !nowLiked); }   // revert
  }catch(_){ btn.classList.toggle('liked', !nowLiked); }
}

// Report a comment for review (the flag glyph). One-way for the member — once
// reported it stays red (persisted locally so it survives reload); the server keeps
// the running count for the admin Comments page. Best-effort; never blocks the UI.
function _isFlagged(cid){ try{ return localStorage.getItem('pg_flagged:'+cid)==='1'; }catch(_){ return false; } }
async function flagAct(btn){
  const cid = btn.getAttribute('data-cid'); if(!cid) return;
  if(btn.classList.contains('flagged')) return;   // already reported
  const me = acct(); if(!me) return;
  btn.classList.add('flagged');                    // immediate red
  try{ localStorage.setItem('pg_flagged:'+cid,'1'); }catch(_){}
  try{ await fetch(API + '/transcribe/comments/' + encodeURIComponent(cid) + '/flag', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email: me }) }); }catch(_){}
}

// Binge stepper: walk the selected episode ◀/▶ and re-render just this card's foot.
function stepBinge(btn){
  const key = btn.getAttribute('data-key'), d = Number(btn.getAttribute('data-d')) || 0;
  const st = _foot[key]; if(!st) return;
  const max = _epList(st.it).length - 1;
  const ns = Math.max(0, Math.min(st.sel + d, max));
  if(ns === st.sel) return;
  st.sel = ns;
  if(typeof _stopAudio === 'function') _stopAudio();   // foot (and its ▶) is about to be replaced
  const foot = [...document.querySelectorAll('.c-foot')].find(f => f.getAttribute('data-key') === key);
  if(foot) foot.innerHTML = renderFoot(st.it, ns);
}

document.getElementById('feed').addEventListener('click', e => {
  const step = e.target.closest('.c-step');
  if(step){ e.stopPropagation(); stepBinge(step); return; }
  const rel = e.target.closest('.c-rel.follow, .c-rel.followback, .c-rel.friend, .c-rel.following');
  if(rel){ e.stopPropagation(); followAct(rel); return; }
  const like = e.target.closest('.c-like');
  if(like){ e.stopPropagation(); likeAct(like); return; }
  const flag = e.target.closest('.c-flag');
  if(flag){ e.stopPropagation(); flagAct(flag); return; }
  const watch = e.target.closest('.c-watch');
  if(watch){ e.stopPropagation();
    // Deep-link into the viewer's LOG face (cube_log_face = shell face 'episodes'),
    // loading this title at the episode; withComments opens the co-view thread.
    const payload = { titleId: watch.getAttribute('data-id'), episode: watch.getAttribute('data-ep') || '', comments: watch.classList.contains('wide') };
    try{
      if(window.parent && typeof window.parent.cubeRotateTo === 'function') window.parent.cubeRotateTo('episodes', payload);
      else window.parent.postMessage({ type:'cube:rotateTo', face:'episodes', payload }, '*');
    }catch(_){}
    return; }
  const btn = e.target.closest('.c-audio');
  if(btn){ e.stopPropagation(); playAudio(btn); return; }
  // Spoiler notes stay blurred until the reader taps to opt in; revealing exposes the
  // text and (if present) the ▶ play button.
  const n = e.target.closest('.c-note.spoiler:not(.revealed)'); if(!n) return;
  n.classList.add('revealed');
  const tag = n.querySelector('.tag'); if(tag) tag.textContent = 'spoiler note' + (n.dataset.eplabel || '');
});

loadFeed(); // audio player + handlers are defined above, so a re-render can stop playback safely
// The shell nudges FEED when the log changes (a show logged/finished on another face).
window.addEventListener('message', e => {
  const t = e.data && e.data.type;
  if(t === 'feed:refresh' || (t === 'cube:payload' && e.data.face === 'feed')) loadFeed();
});

if (window.parent !== window) {
  document.documentElement.style.height = "100%";
  document.body.style.padding = "0";
  document.body.style.height = "100%";
  document.body.style.alignItems = "stretch";
  const face = document.querySelector(".face");
  if (face) {
    face.style.width = "100%"; face.style.height = "100%"; face.style.borderRadius = "0"; face.style.border = "0";
    // Back navigation is the floating cube button only (double-tap / pinch removed).
  }
}
// Keep momentum scrolling responsive: nudge .body off its top/bottom edge as a drag
// begins so the first up-swipe isn't eaten by iOS overscroll chaining.
const _bodyEl=document.querySelector('.body');
if(_bodyEl) document.addEventListener('touchstart',()=>{
  const max=_bodyEl.scrollHeight-_bodyEl.clientHeight; if(max<=0) return;
  if(_bodyEl.scrollTop<=0) _bodyEl.scrollTop=1; else if(_bodyEl.scrollTop>=max) _bodyEl.scrollTop=max-1;
},{passive:true});
</script>
