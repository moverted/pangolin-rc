<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>pangolinRC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0c0a08;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  /* Horizontal pager: six face panels, native scroll-snap. The faces scroll
     vertically inside themselves, so horizontal swipes fall through to this
     container. The tab bar below is the guaranteed nav (taps land on the parent,
     never intercepted by an iframe). */
  #stage {
    position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0;
    bottom: calc(56px + env(safe-area-inset-bottom));
    display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #stage::-webkit-scrollbar { display: none; }
  .panel { flex: 0 0 100%; height: 100%; scroll-snap-align: start; position: relative; }
  .panel iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: transparent;
  }

  /* keyboard up → hide the tab bar (it would sit behind the keyboard anyway) */
  body.kb #tabbar { display: none; }
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: calc(56px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    display: flex; background: #14110c; border-top: 1px solid #2a2418; z-index: 10;
  }
  .tab {
    flex: 1; background: none; border: 0; color: #8c8172; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 6px 0;
    font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: .2px;
  }
  .tab .tab-ic {
    height: 26px; width: auto; display: block;
    opacity: .8; transition: opacity .15s ease, transform .15s ease;
  }
  .tab .lbl { line-height: 1; }
  .tab.on { color: #f0a93b; }            /* selected tab → theme amber (was off-white) */
  .tab.on .tab-ic { opacity: 1; transform: scale(1.06); }
  .tab:active { color: #f0a93b; }

  /* Return to the 3D cube. Mirrors the cube's bug button (top-right, same shape),
     tinted JOIN-blue so it reads as "the blue bug" that takes you back. */
  #cube-btn {
    display: none;   /* return-to-cube now lives on the Profile toggle; bug icon hidden app-wide */
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    right: calc(env(safe-area-inset-right, 0px) + 8px);
    z-index: 9999;
    width: 34px; height: 34px; padding: 0;
    border: none; border-radius: 50%;
    background: rgba(20,16,12,0.45);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    color: #00BBEE;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0.7;
    transition: opacity .2s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }
  #cube-btn:active { transform: scale(0.9); opacity: 1; }
</style>
</head>
<body>
  <div id="stage"></div>
  <nav id="tabbar" aria-label="Faces"></nav>
  <button id="cube-btn" type="button" aria-label="Back to the cube"
    onclick="location.href='/index.html'+location.search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l1.88 1.88"/><path d="M14.12 3.88L16 2"/><path d="M9 7.13v-1a3 3 0 1 1 6 0v1"/><path d="M18 11a4 4 0 0 0-4-4h-4a4 4 0 0 0-4 4v3c0 3.3 2.7 6 6 6s6-2.7 6-6z"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg></button>
  <script type="module" src="/flat_shell.js"></script>
</body>
</html>
