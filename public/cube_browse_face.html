<!doctype html>
<!--
  PangolinRC cube face: JOIN (splash slides to Pierre intake)
  Self-contained HTML. Data fetched live in the browser from TVMaze.
  NOTE FOR CLAUDE CODE: this file fetches https://api.tvmaze.com live.
  Do not "fix" the fetch or treat the file as broken if a sandbox cannot
  reach the network. Typeahead simply returns no results offline.
  No scroll by design: the face is a fixed square, everything fits inside.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PangolinRC . Join</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#17120e; --panel:#211a13; --panel-2:#2b2218; --line:#3a2f22;
    --amber:#e89f3d; --amber-soft:#c98a37; --green:#5f8f5a;
    --red:#9d4a3f; --text:#f3ebe0; --muted:#a7967f;
    --display:"Space Grotesk",system-ui,sans-serif;
    --body:"Inter",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #241b12 0%, var(--base) 60%);
    color:var(--text);font-family:var(--body);
    display:flex;align-items:center;justify-content:center;padding:18px;
  }
  .face{
    position:relative;
    width:min(92vw,420px);height:min(92vw,420px);
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 80px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .track{position:absolute;inset:0;display:flex;width:200%;height:100%;
    transition:transform .5s cubic-bezier(.7,0,.2,1)}
  .track.toPierre{transform:translateX(-50%)}
  .panel{flex:0 0 50%;width:50%;height:100%;padding:18px;
    display:flex;flex-direction:column;overflow:hidden}

  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted)}

  .splash{justify-content:flex-start}
  .splash h1{font-family:var(--display);font-weight:700;
    font-size:25px;line-height:1.06;letter-spacing:-.01em;margin:7px 0 5px}
  .splash .sub{margin:0;color:var(--muted);font-size:12.5px;line-height:1.4}
  .video{margin:13px 0;border-radius:12px;overflow:hidden;border:1px solid var(--line);
    background:#000;aspect-ratio:16/9;flex:0 0 auto}
  .video iframe{display:block;width:100%;height:100%;border:0}
  .join{margin-top:auto;width:100%;font-family:var(--display);font-weight:700;
    font-size:17px;letter-spacing:.04em;color:#1a130b;background:var(--amber);
    border:0;border-radius:12px;padding:15px 16px;cursor:pointer;
    box-shadow:0 10px 26px -12px rgba(232,159,61,.7);
    transition:transform .08s ease,filter .15s ease}
  .join:hover{filter:brightness(1.05)}
  .join:active{transform:translateY(1px)}
  .join:focus-visible{outline:2px solid var(--text);outline-offset:3px}

  .phead{display:flex;align-items:center;gap:11px;flex:0 0 auto}
  .mark{flex:0 0 auto;width:38px;height:38px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f2b457, var(--amber-soft));
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.25)}
  .mark svg{width:24px;height:24px}
  .phead .who{font-family:var(--display);font-weight:700;font-size:15px}
  .phead .who small{display:block;font-family:var(--mono);font-weight:400;
    font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

  .steps{display:flex;align-items:center;gap:6px;margin:14px 0 2px;flex:0 0 auto}
  .seg{height:4px;flex:1;border-radius:3px;background:var(--line)}
  .seg.done{background:var(--green)}
  .seg.active{background:var(--amber)}
  .here{width:10px;height:10px;border-radius:50%;background:var(--amber,#f0a93b);display:inline-block;box-shadow:0 0 8px rgba(240,169,59,.6)}

  .bubble{flex:0 0 auto;margin:14px 0 4px;font-family:var(--display);font-weight:500;
    font-size:17px;line-height:1.25;min-height:46px;animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.bubble{animation:none}.track{transition:none}}

  .search{position:relative;flex:0 0 auto}
  .search input{width:100%;font-family:var(--body);font-size:13.5px;color:var(--text);
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .search input::placeholder{color:#7d7060}
  .search input:focus{outline:none;border-color:var(--amber-soft)}
  .results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;
    border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:172px;
    background:var(--panel-2);box-shadow:0 18px 40px -20px rgba(0,0,0,.8)}
  .results:empty{display:none}
  .res{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;
    border-bottom:1px solid var(--line)}
  .res:last-child{border-bottom:0}
  .res:hover{background:#332819}
  .res img{width:28px;height:40px;object-fit:cover;border-radius:4px;background:#000;flex:0 0 auto}
  .res .noimg{width:28px;height:40px;border-radius:4px;background:#3a2f22;flex:0 0 auto}
  .res .meta{min-width:0}
  .res .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res .yr{font-family:var(--mono);font-size:10px;color:var(--muted)}

  .pickwrap{flex:1 1 auto;min-height:0;overflow:hidden;margin-top:12px}
  .picks{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 11px;font-size:12px;max-width:100%}
  .chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
  .chip button{border:0;background:#3a2f22;color:var(--text);width:18px;height:18px;
    border-radius:50%;cursor:pointer;font-size:12px;line-height:1;
    display:flex;align-items:center;justify-content:center}
  .chip button:hover{background:var(--red)}

  .meter{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;
    flex:0 0 auto;margin-bottom:10px}
  .meter b{color:var(--amber)}

  .nav{display:flex;gap:10px;flex:0 0 auto}
  .next{flex:1;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.03em;
    color:#1a130b;background:var(--amber);border:0;border-radius:11px;padding:13px;cursor:pointer;
    transition:filter .15s ease}
  .next:hover{filter:brightness(1.05)}
  .next:disabled{background:#4a3f30;color:#8a7c6a;cursor:not-allowed}
  .back{font-family:var(--body);font-size:13px;color:var(--muted);background:transparent;
    border:1px solid var(--line);border-radius:11px;padding:13px 16px;cursor:pointer}
  .back:hover{color:var(--text)}

  .stub{font-family:var(--mono);font-size:9.5px;color:#7d7060;margin-top:10px;flex:0 0 auto}

  /* ---- BROWSE (shown once this device has an account; JOIN flips to this) ---- */
  .browse{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
  .browse.show{display:flex}
  /* top bar matched to FEED / LOG / WATCH: mono face label + pill badge */
  .head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;flex-shrink:0}
  .label{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--muted)}
  .badge{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--amber);
    border:1px solid var(--line);padding:3px 8px;border-radius:999px}
  .bscroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;touch-action:pan-y;
    padding:0 16px 12px;display:flex;flex-direction:column}
  .rail{margin-top:15px;flex:0 0 auto}
  .rail h2{font-family:var(--display);font-size:14px;font-weight:700;margin:0;
    display:flex;justify-content:space-between;align-items:baseline}
  .rail h2 em{font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .rail .why{font-family:var(--mono);font-size:10px;color:var(--muted);margin:2px 0 8px}
  .cards{display:flex;gap:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding-bottom:2px}
  .cards::-webkit-scrollbar{display:none}
  .bcard{flex:0 0 auto;width:86px;cursor:pointer}
  .bcard .pi{width:86px;height:120px;border-radius:9px;background:#000 center/cover;border:1px solid var(--line)}
  .bcard .nm{font-size:11px;margin-top:5px;line-height:1.2;color:var(--text)}
  .bcard:active{opacity:.7}
  .bcard{position:relative}
  .bcard .frm{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--amber);
    margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bcard .note{font-size:9.5px;color:var(--muted);line-height:1.25;margin-top:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bcard .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border:none;border-radius:50%;
    background:rgba(8,6,4,.78);color:#fff;font-size:12px;line-height:1;cursor:pointer;display:flex;
    align-items:center;justify-content:center}
  .bempty{border:1px dashed var(--line);border-radius:11px;padding:13px;color:var(--muted);
    font-size:12px;line-height:1.5}
  .bempty b{color:var(--text)}
  .signout{margin-top:auto;padding-top:14px;font-family:var(--mono);font-size:10px;
    letter-spacing:.06em;color:#7d7060;text-align:center;flex:0 0 auto}
  .signout button{background:none;border:0;color:var(--amber-soft);cursor:pointer;font:inherit;text-decoration:underline}

  /* ---- IRL tab bar (Suggestions / Tickets / Physical media) ---- */
  .tabs{display:flex;gap:6px;padding:0 16px 10px;flex-shrink:0}
  .tab{flex:1;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    padding:8px 4px;cursor:pointer;transition:color .15s,border-color .15s,background .15s;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.on{color:#1a130b;background:var(--amber);border-color:var(--amber)}

  /* ---- Tickets: a shelf of theater ticket stubs ---- */
  .tixgrid{display:flex;flex-direction:column;gap:11px;margin-top:14px}
  .tix{position:relative;display:flex;flex-direction:column;background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s}
  .tix.open{border-color:rgba(232,159,61,.5)}
  .tix-row{position:relative;display:flex;align-items:stretch}
  .tix .poster{flex:0 0 58px;width:58px;background:#000 center/cover;border-right:1px dashed var(--line)}
  .tix .noposter{flex:0 0 58px;width:58px;background:repeating-linear-gradient(45deg,#241c13,#241c13 6px,#2b2218 6px,#2b2218 12px)}
  .tix .body{flex:1 1 auto;min-width:0;padding:9px 11px;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .tix .film{font-family:var(--display);font-weight:700;font-size:13.5px;line-height:1.15;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tix .where{font-family:var(--mono);font-size:10px;color:var(--amber-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tix .when{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.04em}
  /* torn stub end: date block + two punch notches on the perforation */
  .tix .stub{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;padding:0 12px;border-left:1px dashed var(--line);background:rgba(0,0,0,.16)}
  .tix .stub .d{font-family:var(--display);font-weight:700;font-size:16px;line-height:1;color:var(--amber)}
  .tix .stub .mo{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tix .notch{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
  .tix .notch.t{top:-5px}
  .tix .notch.b{bottom:-5px}
  /* Popped-open reflection recorder: a large mic with a 10s countdown ring. */
  .tix-rec{display:none;flex-direction:column;align-items:center;gap:9px;padding:15px 0 17px;
    border-top:1px dashed var(--line);background:rgba(0,0,0,.14)}
  .tix.open .tix-rec{display:flex}
  .tixmic{position:relative;width:64px;height:64px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--amber);cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px -10px rgba(232,159,61,.6)}
  .tixmic:active{transform:scale(.96)}
  .tixmic svg{width:28px;height:28px}
  .tixmic.rec{color:#e0554e;border-color:rgba(224,85,78,.65)}
  .tixmic.busy{color:var(--muted)}
  .tixmic .rec-ring{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px)}
  .tixmic .rec-seg{transition:opacity .15s}
  .tixmic .rec-num{font-family:var(--mono);font-weight:700;font-size:18px}
  .tixhint{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--muted)}
  .tixhint.ok{color:var(--green)} .tixhint.bad{color:var(--amber-soft)}

  /* ---- Physical media: scanner viewport + the collected shelf ---- */
  .cam{position:relative;flex:0 0 auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    background:#0a0806;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
  .addpanel{margin-top:14px;animation:rise .28s ease both}
  .camclose{position:absolute;top:8px;right:8px;z-index:4;width:26px;height:26px;border-radius:50%;
    border:0;background:rgba(8,6,4,.82);color:#fff;font-size:13px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cam .placeholder{font-family:var(--mono);font-size:10.5px;color:#6d6152;text-align:center;line-height:1.6;padding:0 24px;z-index:1}
  .cam .reticle{position:absolute;left:14%;right:14%;top:38%;bottom:38%;border:2px solid rgba(232,159,61,.85);
    border-radius:8px;box-shadow:0 0 0 100vmax rgba(6,4,2,.32);z-index:2}
  .cam .laser{position:absolute;left:16%;right:16%;top:50%;height:2px;background:rgba(232,159,61,.9);
    box-shadow:0 0 8px rgba(232,159,61,.8);z-index:3;animation:scan 2.2s ease-in-out infinite}
  @keyframes scan{0%,100%{top:40%}50%{top:60%}}
  @media (prefers-reduced-motion:reduce){.cam .laser{animation:none}}
  .camrow{display:flex;gap:8px;margin-top:10px}
  .camrow button{flex:1;font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.03em;
    border:0;border-radius:10px;padding:11px;cursor:pointer}
  .camrow .scan{color:#1a130b;background:var(--amber)}
  .camrow .manual{color:var(--text);background:var(--panel-2);border:1px solid var(--line)}
  .camrow button:active{transform:translateY(1px)}
  .shelfhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;flex:0 0 auto}
  .shelfhead h2{font-family:var(--display);font-size:14px;font-weight:700;margin:0}
  .shelfright{display:flex;align-items:center;gap:10px}
  .shelfright em{font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .addbtn{width:27px;height:27px;border-radius:50%;border:0;background:var(--amber);color:#1a130b;
    font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px -8px rgba(232,159,61,.85)}
  .addbtn.on{background:var(--panel-2);color:var(--amber);border:1px solid var(--line)}
  .addbtn:active{transform:translateY(1px)}
  .shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .mcard{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:1px solid var(--line);
    background:#000 center/cover;cursor:pointer}
  .mcard .spine{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
    padding:6px;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(6,4,2,.88))}
  .mcard .mtitle{font-size:10px;font-weight:600;line-height:1.15;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mcard .fmt{position:absolute;top:5px;left:5px;font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;
    padding:2px 5px;border-radius:5px;background:rgba(6,4,2,.78);color:var(--amber)}
  .mcard .x{position:absolute;top:4px;right:4px;width:19px;height:19px;border:none;border-radius:50%;
    background:rgba(8,6,4,.8);color:#fff;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .camstatus{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--muted);
    text-align:center;margin-top:9px;min-height:14px;line-height:1.35}
  .camstatus.ok{color:var(--green)}
  .camstatus.bad{color:var(--amber-soft)}

  /* Floating cube — back to cube navigation (shared across trunk sides) */
</style>
<script src="zxing.min.js"></script>
</head>
<body>
<div class="face">
  <div class="track" id="track">

    <section class="panel splash">
      <div class="eyebrow">PangolinRC</div>
      <h1>Watch what you want, when you want. For less.</h1>
      <p class="sub">Pierre learns your taste and builds your room in a minute.</p>
      <div class="video">
        <iframe src="https://www.youtube.com/embed/brdzZG3Bas8?si=R_mptZFrb39IQ15H"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <button class="join" id="joinBtn">JOIN / LOGIN</button>
    </section>

    <section class="panel pierre" id="pierre"></section>

  </div>

  <section class="browse" id="browse"></section>
</div>

<script>
const STEP = [
  { key:"favorites", target:5, ph:"Search a show you love",
    bubble:"I'm Pierre. Let's build your room. Drop five all time favorites." },
  { key:"current", target:3, ph:"Search a current show",
    bubble:"Nice picks. Now three you are watching this week." },
  { key:"future", target:0, ph:"Search a show you want",
    bubble:"Anything you are waiting on? Add a few or skip." },
  { key:"email", target:0, ph:"you@email.com",
    bubble:"Last step. Where should I send your room?" },
];
const state = { step:0, picks:[[],[],[]], email:"", done:false };
const pierre = document.getElementById("pierre");
const track = document.getElementById("track");
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mark = `<div class="mark"><svg viewBox="0 0 24 24" fill="none">
  <path d="M6 12.5c0-3.6 2.7-6.3 6.3-6.3 3.3 0 5.7 2.6 5.7 5.8 0 3.4-2.4 5.8-5.9 5.8" stroke="#1a130b" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M9 9.5l2-1M9.5 12l2.2-1M10 14.5l2.3-1" stroke="#1a130b" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="15.4" cy="10.6" r="1" fill="#1a130b"/></svg></div>`;

const DEMO = location.hostname.split('.').includes('demo') || new URLSearchParams(location.search).has('demo');
// Demo build (remote.demo.pangolinrc.com, or ?demo=1 preview): hide the Join button.
if (DEMO) { const jb = document.getElementById('joinBtn'); if (jb) jb.style.display = 'none'; }

// ---- Trunk: JOIN before this device has an account, BROWSE after ----
// Login is remembered per-device: Pierre writes pg_user (email) + pg_username on
// signup, and faces share an origin, so reading it here is enough. The session
// persists until "not you?" clears it.
function isMember(){ try{ return !!localStorage.getItem('pg_user'); }catch(_){ return false; } }
function memberName(){ try{ return localStorage.getItem('pg_username') || ''; }catch(_){ return ''; } }
function memberEmail(){ try{ return localStorage.getItem('pg_user') || ''; }catch(_){ return ''; } }
// Preview/testing convenience: ?member=1 on the shell forces BROWSE without a real
// signup. The iframe reads the parent's query (same-origin); falls back to its own.
function forcedMember(){
  try{ const s = (window.parent !== window ? window.parent.location.search : location.search);
    return new URLSearchParams(s).has('member'); }
  catch(_){ return new URLSearchParams(location.search).has('member'); }
}

// Pierre's picks rail — real shows pulled live from TVMaze (posters + ids), so a
// tap can open the actual show on the Watch face. Friends/Following stay honest
// empties until that data is real.
const PICKS_SEED = ['Severance','The Bear','Shogun','Slow Horses','Fallout','The Penguin'];

async function fetchShow(name){
  try{
    const r = await fetch('https://api.tvmaze.com/singlesearch/shows?q=' + encodeURIComponent(name));
    if(!r.ok) return null; const d = await r.json();
    return { id:d.id, name:d.name, img:(d.image && (d.image.medium || d.image.original)) || '' };
  }catch(_){ return null; }
}
// Remember the title just chosen so the WATCH face opens (selects/expands) the same
// card when you rotate to it — bare TVmaze ids are normalized to the catalog title_id.
function markWatchOpen(titleId){ try{ localStorage.setItem('pg_watch_open', String(titleId)); }catch(_){} }
function openShow(id, name){
  markWatchOpen(String(id).startsWith('tvmaze:') ? id : 'tvmaze:'+id);
  if (window.parent !== window){
    // addToLog:true loads the show on BOTH faces at selection time — the episode
    // (LOG) face AND the WATCH list — instead of waiting on the async episode:track
    // relay, which could land before the Watch iframe was ready and get dropped.
    const payload = { show:{ id, name }, addToLog:true };
    if (typeof window.parent.cubeRotateTo === 'function') window.parent.cubeRotateTo('episodes', payload);
    else window.parent.postMessage({ type:'cube:rotateTo', face:'episodes', payload }, '*');
  }
}
// Open a catalog title by its full id ('tvmaze:…' | 'tmdb:…'), routing films through
// the movie hand-off and shows through the show hand-off (the Watch face branches
// on payload shape). Used by the "From friends" rail, where shares carry a title_id.
function openTitle(titleId, name){
  markWatchOpen(titleId);   // already a full catalog id ('tvmaze:…' | 'tmdb:…')
  const payload = String(titleId).startsWith('tmdb:')
    ? { movie:{ id:titleId, title:name }, addToLog:true } : { show:{ id:titleId, name }, addToLog:true };
  if (window.parent !== window){
    if (typeof window.parent.cubeRotateTo === 'function') window.parent.cubeRotateTo('episodes', payload);
    else window.parent.postMessage({ type:'cube:rotateTo', face:'episodes', payload }, '*');
  }
}

  irlTab = key;

// ── TICKETS: the member's logged theater stubs. Real data lives in watch_ticket
//    (POST /ticket → OCR of date/time/theater); a user-wide list endpoint is still
//    to come, so for now we render whatever loadTickets returns and fall back to an
//    honest empty. Each stub shows film · theater · time, with the torn date end.
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MONTH_IDX = {JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11,SEPT:8,
  JANUARY:0,FEBRUARY:1,MARCH:2,APRIL:3,JUNE:5,JULY:6,AUGUST:7,SEPTEMBER:8,OCTOBER:9,NOVEMBER:10,DECEMBER:11};
// Ticket dates arrive raw from OCR ("TUE, AUG 04", "AUG 6", "Saturday, June 20 8:15 a.m.",
// or ISO). Pull the {day, month-abbr} for the torn stub end from whatever form it's in.
function ticketDateBits(dateStr){
  const s = String(dateStr||'');
  let m = /(\d{4})-(\d{2})-(\d{2})/.exec(s);                                   // ISO
  if(m) return { d:String(+m[3]), mo:MONTHS[(+m[2]-1)%12]||'' };
  m = /([A-Za-z]{3,9})\.?\s+(\d{1,2})\b/.exec(s);                              // "AUG 6", "June 20"
  if(m){ const i=MONTH_IDX[m[1].toUpperCase()]; if(i!=null) return { d:String(+m[2]), mo:MONTHS[i] }; }
  m = /\b(\d{1,2})\s+([A-Za-z]{3,9})\b/.exec(s);                               // "6 August"
  if(m){ const i=MONTH_IDX[m[2].toUpperCase()]; if(i!=null) return { d:String(+m[1]), mo:MONTHS[i] }; }
  return { d:'—', mo:'' };
}
function sampleTickets(){

async function renderTickets(pane){

      <div class="tix-row">
        <span class="notch t"></span><span class="notch b"></span>
        <div class="${img?'poster':'noposter'}" style="${img?`background-image:url('${esc(img)}')`:''}"></div>
        <div class="body">

        </div>

      </div>
      <div class="tix-rec">
        <button class="tixmic" aria-label="Record a reflection">${MIC_SVG}</button>
        <div class="tixhint">tap the mic · 10s reflection on ${esc(t.film||'this film')}</div>
      </div>
    </div>`;
  }).join('');
  // Tap a stub to pop it open (only one at a time); the mic runs its own recorder.
  grid.querySelectorAll('.tix').forEach(tx => {
    tx.addEventListener('click', e => {
      if(e.target.closest('.tixmic')) return;          // mic handles its own tap
      const wasOpen = tx.classList.contains('open');
      grid.querySelectorAll('.tix.open').forEach(o => { if(o!==tx){ o.classList.remove('open'); stopTixRec(o, true); } });
      tx.classList.toggle('open', !wasOpen);
      if(wasOpen) stopTixRec(tx, true);
    });
    tx.querySelector('.tixmic').addEventListener('click', () => toggleTixRec(tx));
  });
}
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
// 10-segment countdown ring (matches the composer/LOG REC indicators).
function tixRecRing(total){
  const C=289.03, step=C/total, seg=Math.max(6, step-11); let s='';
  for(let i=0;i<total;i++){ s+='<circle class="rec-seg" data-i="'+i+'" cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+seg.toFixed(2)+' '+(C-seg).toFixed(2)+'" stroke-dashoffset="'+(-step*i).toFixed(2)+'" transform="rotate(-90 50 50)"/>'; }
  return '<svg class="rec-ring" viewBox="0 0 100 100" aria-hidden="true">'+s+'</svg>';
}
let _tixRec=null, _tixChunks=[], _tixTimer=null, _tixLeft=0, _tixEl=null;
function toggleTixRec(tx){ if(_tixTimer && _tixEl===tx) stopTixRec(tx); else startTixRec(tx); }
async function startTixRec(tx){
  if(_tixTimer) stopTixRec(_tixEl, true);
  const mic = tx.querySelector('.tixmic'), hint = tx.querySelector('.tixhint');
  let stream; try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(_){ if(hint){ hint.textContent='mic blocked — allow microphone access'; hint.className='tixhint bad'; } return; }
  _tixEl = tx; _tixChunks = []; _tixRec = new MediaRecorder(stream); _tixRec.ondataavailable = e=>_tixChunks.push(e.data); _tixRec.start();
  _tixLeft = 10;
  mic.classList.add('rec'); mic.innerHTML = tixRecRing(10) + '<span class="rec-num">10</span>';
  if(hint){ hint.textContent='recording… tap to stop'; hint.className='tixhint'; }
  const sync=()=>{ mic.querySelectorAll('.rec-seg').forEach(s=>{ s.style.opacity=(+s.getAttribute('data-i')<_tixLeft)?'1':'0'; });
    const n=mic.querySelector('.rec-num'); if(n) n.textContent=Math.max(_tixLeft,0); };
  sync();
  _tixTimer = setInterval(()=>{ _tixLeft--; sync(); if(_tixLeft<=0) stopTixRec(tx); }, 1000);
}
function stopTixRec(tx, discard){
  if(!tx || _tixEl!==tx){ return; }
  if(_tixTimer){ clearInterval(_tixTimer); _tixTimer=null; }
  const mic = tx.querySelector('.tixmic'), hint = tx.querySelector('.tixhint');
  const restore=()=>{ if(mic){ mic.classList.remove('rec','busy'); mic.innerHTML=MIC_SVG; } };
  if(!_tixRec || _tixRec.state==='inactive'){ restore(); return; }
  _tixRec.onstop = async()=>{
    try{ _tixRec.stream.getTracks().forEach(t=>t.stop()); }catch(_){}
    if(discard || !_tixChunks.length){ restore(); if(hint && discard){ hint.textContent='tap the mic · 10s reflection'; hint.className='tixhint'; } return; }
    if(mic){ mic.classList.remove('rec'); mic.classList.add('busy'); mic.innerHTML='…'; }
    if(hint){ hint.textContent='saving…'; hint.className='tixhint'; }
    const email = memberEmail();
    try{
      const blob = new Blob(_tixChunks, { type:(_tixChunks[0]&&_tixChunks[0].type)||'audio/webm' });
      const fd = new FormData(); fd.append('audio', blob);
      fd.append('episodeId', tx.dataset.ep || 'pierre-note');
      if(tx.dataset.show) fd.append('showId', tx.dataset.show);
      fd.append('timestampMs','0'); fd.append('reflection','1'); fd.append('private','1');
      fd.append('userEmail', email||'');
      const res = await fetch(ART_API + '/transcribe', { method:'POST', body:fd, mode:'cors' });
      restore();
      if(hint){ if(res.ok){ hint.textContent='saved ✓ tap to record another'; hint.className='tixhint ok'; }
                else { hint.textContent="didn't save — try again"; hint.className='tixhint bad'; } }
    }catch(_){ restore(); if(hint){ hint.textContent="didn't save — try again"; hint.className='tixhint bad'; } }
  };
  try{ _tixRec.stop(); }catch(_){ restore(); }
}

// ── MEDIA (the shelf): scan a barcode (camera) or type it in, and the disc joins
//    the member's collection. Camera is simulated locally from a screengrab the user
//    supplies; the collection persists in localStorage until the backend exists.
const MEDIA_KEY = 'pg_irl_media';
function loadMedia(){
  try{ const m = JSON.parse(localStorage.getItem(MEDIA_KEY)||'[]'); if(Array.isArray(m)) return m; }catch(_){}
  return [];
}
function saveMedia(list){ try{ localStorage.setItem(MEDIA_KEY, JSON.stringify(list)); }catch(_){} }
// Unique per call — Date.now() alone collides when two shelve back-to-back, which cross-
// wired their async title/poster updates onto the same card.
function mediaId(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function addMedia(item){ const list = loadMedia(); list.unshift({ id:mediaId(), ...item }); saveMedia(list); }
// ?seed preview shelf — real physical-edition box art (Amazon product images) so the
// layout reads true without a live scan. Never shown to a real member (needs ?seed).
function sampleMedia(){
  return [
    { id:'d1', title:'Homicide: Life on the Street', fmt:'DVD',     barcode:'', poster:'https://m.media-amazon.com/images/I/91adBKeJ4bL._SY679_.jpg' },
    { id:'d2', title:'Mr. Robot',                    fmt:'BLU-RAY', barcode:'', poster:'https://m.media-amazon.com/images/I/81MzYDozu0L._SX522_.jpg' },
    { id:'d3', title:'V for Vendetta',               fmt:'DVD',     barcode:'', poster:'https://m.media-amazon.com/images/I/915bUmAaOJL._SY679_.jpg' },
  ];
}
// The camera/scan module is collapsed by default — the shelf shows first, and a (+)
// opens the scanner only when the member wants to add a disc.
let mediaAdding = false;
function renderMedia(pane){
  const addPanel = mediaAdding ? `
    <div class="addpanel">
      <div class="cam" id="cam">
        <div class="placeholder" id="camPlaceholder">camera preview<br>tap to use your camera · or drop a screengrab</div>
        <div class="reticle"></div><div class="laser"></div>
        <button class="camclose" id="camClose" aria-label="Close">✕</button>
      </div>
      <div class="camrow">
        <button class="scan" id="scanBtn">Scan barcode</button>
        <button class="manual" id="manualBtn">Enter by hand</button>
      </div>
      <div class="camstatus" id="camStatus">point the camera at the barcode on the case</div>
    </div>` : '';
  pane.innerHTML = `
    ${addPanel}
    <div class="shelfhead"><h2>My shelf</h2>
      <div class="shelfright"><em id="shelfCount"></em>
        <button class="addbtn ${mediaAdding?'on':''}" id="addBtn" aria-label="Add a disc">${mediaAdding?'✕':'+'}</button></div>
    </div>
    <div class="shelf" id="shelf"></div>`;
  document.getElementById('addBtn').onclick = () => { mediaAdding = !mediaAdding; renderMedia(pane); };

  if(mediaAdding){
    // Take a photo (or drop a screengrab) → ZXing decodes the barcode from the still and
    // shelves it. Live camera streaming needs a secure origin (blocked on http-over-LAN
    // on iOS), so this snap-and-decode path is what works for local testing; the iOS app
    // swaps in a native scanner. ?cam=<url> preset feeds an image straight in.
    const cam = document.getElementById('cam');
    function setStatus(msg, cls){ const st = document.getElementById('camStatus');
      if(st){ st.textContent = msg; st.classList.remove('ok','bad'); if(cls) st.classList.add(cls); } }
    function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('load')); i.src=src; }); }
    // A rotated + downscaled copy of the photo. Phone shots arrive sideways, and decoding
    // at full 4K resolution over-reads into false positives, so every attempt runs on a
    // reduced, re-oriented copy.
    function variantCanvas(img, rot, scale){
      const w=Math.round(img.naturalWidth*scale), h=Math.round(img.naturalHeight*scale);
      const c=document.createElement('canvas');
      if(rot===90||rot===270){ c.width=h; c.height=w; } else { c.width=w; c.height=h; }
      const ctx=c.getContext('2d'); ctx.imageSmoothingQuality='high';
      ctx.translate(c.width/2,c.height/2); ctx.rotate(rot*Math.PI/180); ctx.drawImage(img,-w/2,-h/2,w,h); return c;
    }
    async function readOnce(cv){
      try{ const r=await new ZXing.BrowserMultiFormatReader(new Map([[ZXing.DecodeHintType.TRY_HARDER,true]]))
                          .decodeFromImageUrl(cv.toDataURL('image/jpeg',0.92)); return (r.getText()||'').trim(); }
      catch(_){ return null; }
    }
    // Consensus decode: a real barcode reads identically across orientations/scales, while
    // a misread is a one-off. Accept the first code seen TWICE (which beats singleton
    // garbage); never shelve an unconfirmed guess. Early-exit keeps a clean frame near
    // instant (~2 reads); the sideways/glare case still lands, just a beat slower.
    async function decodeBarcode(src){
      if(!window.ZXing){ setStatus('scanner unavailable — use Enter by hand','bad'); return; }
      setStatus('scanning…');
      let img; try{ img=await loadImg(src); }catch(_){ setStatus('could not open that image — retake','bad'); return; }
      const tally={}; let best=null, bestN=0;
      for(const scale of [0.6,0.5]) for(const rot of [0,90,270,180]){
        const code=await readOnce(variantCanvas(img,rot,scale));
        if(!code) continue;
        tally[code]=(tally[code]||0)+1;
        if(tally[code]>bestN){ best=code; bestN=tally[code]; }
        if(bestN>=2){ shelveBarcode(best); setStatus('found '+best+' · added to shelf','ok'); return; }
      }
      setStatus('no clear read — fill the frame, hold steady, and retake','bad');
    }
    function showCam(src){
      let img = cam.querySelector('img');
      if(!img){ img = document.createElement('img'); cam.insertBefore(img, cam.firstChild); }
      img.src = src;
      const ph = document.getElementById('camPlaceholder'); if(ph) ph.style.display='none';
      decodeBarcode(src);
    }
    function openCapture(){
      const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment';
      inp.onchange = () => { const f = inp.files && inp.files[0]; if(f) showCam(URL.createObjectURL(f)); };
      inp.click();
    }
    cam.onclick = openCapture;
    cam.addEventListener('dragover', e => e.preventDefault());
    cam.addEventListener('drop', e => { e.preventDefault();
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(f && /^image\//.test(f.type)) showCam(URL.createObjectURL(f)); });
    try{ const preset = new URLSearchParams(location.search).get('cam'); if(preset) showCam(preset); }catch(_){}
    document.getElementById('camClose').onclick = () => { mediaAdding = false; renderMedia(pane); };
    document.getElementById('scanBtn').onclick = openCapture;
    document.getElementById('manualBtn').onclick = () => {
      const title = prompt('Title on the disc');
      if(!title || !title.trim()) return;
      const fmt = (prompt('Format (DVD / BLU-RAY / 4K UHD / VHS)','BLU-RAY')||'').trim().toUpperCase() || 'DISC';
      addMedia({ title:title.trim(), fmt, barcode:'', poster:'' });
      paintShelf();
    };
  }
  paintShelf();
}
// ── Barcode → title + cover art ──────────────────────────────────────────────
// A scanned UPC resolves through the Worker: GET /tmdb/resolve does the UPCitemdb
// lookup + title cleanup + guarded TMDB poster match server-side (keys held there, no
// CORS proxy). Localhost has no local API, so resolve always hits the public Worker.
const ART_API = API_BASE.includes('localhost') ? 'https://pangolin-rc.edward-m-willett.workers.dev' : API_BASE;

// Resolve a scanned code to { title, fmt, poster } via the Worker. Null on no match.
async function resolveDiscArt(code){
  try{
    const r = await fetch(ART_API + '/tmdb/resolve?upc=' + encodeURIComponent(code));
    if(!r.ok) return null;
    const d = await r.json();
    if(!d || !d.title) return null;
    return { title:d.title, fmt:d.fmt || 'DISC', poster:d.poster || '' };
  }catch(_){ return null; }
}
function updateMedia(id, patch){ saveMedia(loadMedia().map(m => m.id===id ? {...m, ...patch} : m)); paintShelf(); }
// Shelve a decoded/typed barcode: drop a card in immediately ("Looking up…"), then fill
// in the real title/poster/format async. If nothing resolves, keep the bare code.
function shelveBarcode(code){
  const id = mediaId();
  const list = loadMedia(); list.unshift({ id, title:'Looking up…', fmt:'DISC', barcode:code, poster:'' });
  saveMedia(list); paintShelf();
  resolveDiscArt(code)
    .then(res => updateMedia(id, res ? { title:res.title, fmt:res.fmt, poster:res.poster } : { title:'Barcode '+code }))
    .catch(() => updateMedia(id, { title:'Barcode '+code }));
}
function addByBarcode(code){ shelveBarcode(code); }
function paintShelf(){
  const shelf = document.getElementById('shelf'); if(!shelf) return;
  let list = loadMedia();
  if(SEED && !list.length) list = sampleMedia();
  const count = document.getElementById('shelfCount'); if(count) count.textContent = list.length ? list.length+' titles' : '';
  if(!list.length){
    // Keep #shelf in the DOM (message spans the grid) so later scans can repaint it.
    shelf.innerHTML = `<div class="bempty" style="grid-column:1/-1"><b>Nothing on the shelf yet.</b><br>Tap <b>+</b> to scan a disc's barcode or add one by hand.</div>`;
    return;
  }
  shelf.innerHTML = list.map(m=>`<div class="mcard" data-id="${esc(m.id)}" style="${m.poster?`background-image:url('${esc(m.poster)}')`:''}">
    <span class="fmt">${esc(m.fmt||'DISC')}</span>
    <button class="x" data-x="${esc(m.id)}" aria-label="Remove">✕</button>
    <div class="spine"><div class="mtitle">${esc(m.title||'Untitled')}</div></div></div>`).join('');
  shelf.querySelectorAll('[data-x]').forEach(x => x.onclick = (ev)=>{
    ev.stopPropagation();
    saveMedia(loadMedia().filter(m=>m.id!==x.dataset.x));
    paintShelf();
  });
}

// "From friends": real shares pushed to me by friends (see /profile/:email/share).
// Each card opens the title on the Watch face; the × dismisses it off the rail.
async function loadFriendShares(){
  const wrap = document.getElementById('cardsFriends'); if(!wrap) return;
  const email = memberEmail();
  if(!email){ friendsEmpty(wrap, 'When friends share a show with you, it shows up here.'); return; }
  let shares=[];
  try{
    const r = await fetch(API_BASE + '/profile/' + encodeURIComponent(email) + '/shares');
    if(r.ok) shares = (await r.json()).shares || [];
  }catch(_){}
  if(!shares.length){ friendsEmpty(wrap, 'When friends share a show with you, it shows up here.'); return; }
  wrap.innerHTML = shares.map(s => `<div class="bcard" data-id="${esc(s.titleId)}" data-name="${esc(s.showName)}" data-share="${esc(s.id)}">
    <button class="x" data-x="${esc(s.id)}" aria-label="Dismiss">✕</button>
    <div class="pi" style="${s.poster?`background-image:url('${esc(s.poster)}')`:''}"></div>
    <div class="nm">${esc(s.showName||'Untitled')}</div>
    <div class="frm">from ${esc(s.from||'a friend')}</div>
    ${s.note?`<div class="note">${esc(s.note)}</div>`:''}</div>`).join('');
  wrap.querySelectorAll('.bcard').forEach(el => el.onclick = (ev)=>{
    if(ev.target.closest('[data-x]')) return;   // the × handles its own tap
    openTitle(el.dataset.id, el.dataset.name);
  });
  wrap.querySelectorAll('[data-x]').forEach(x => x.onclick = (ev)=>{
    ev.stopPropagation(); dismissShare(email, x.dataset.x, x.closest('.bcard'), wrap);
  });
}
function friendsEmpty(wrap, msg){
  wrap.outerHTML = '<div class="bempty"><b>'+esc(msg)+'</b><br>Nothing faked.</div>';
}
async function dismissShare(email, id, card, wrap){
  if(card) card.remove();
  try{ await fetch(API_BASE + '/profile/' + encodeURIComponent(email) + '/shares/' + encodeURIComponent(id), { method:'DELETE' }); }catch(_){}
  if(wrap && !wrap.querySelector('.bcard')) friendsEmpty(wrap, 'When friends share a show with you, it shows up here.');
}
if ((isMember() || forcedMember()) && !DEMO) renderBrowse();

// Login can happen in Pierre AFTER this face loaded, so re-check membership each time
// the cube rotates in — otherwise the JOIN intake keeps obscuring the browse content.
window.addEventListener('message', (e) => {
  if (!e.data) return;
  // A ticket capture (Pierre / LOG finish) swings here → open the Tickets tab.
  if (e.data.type === 'cube:payload' && e.data.face === 'join' && e.data.payload && e.data.payload.tab
      && (isMember() || forcedMember()) && !DEMO) {
    irlTab = e.data.payload.tab;
    if (document.getElementById('browse').classList.contains('show')) switchTab(irlTab);
    else renderBrowse();
    return;
  }
  if (e.data.type === 'cube:focus'
      && (isMember() || forcedMember()) && !DEMO
      && !document.getElementById('browse').classList.contains('show')) {
    renderBrowse();
  }
});

document.getElementById("joinBtn").onclick = () => {
  // In the cube, hand the intake to the real Pierre face. Standalone, run the
  // in-face intake as before.
  if (window.parent !== window) {
    if (typeof window.parent.cubeRotateTo === "function") window.parent.cubeRotateTo("pierre", { intent:"join" });
    else window.parent.postMessage({ type:"cube:rotateTo", face:"pierre", payload:{ intent:"join" } }, "*");
    return;
  }
  track.classList.add("toPierre");
  renderPierre();
};

function progress(active){
  return `<div class="steps">
    ${[0,1,2,3].map(n=>`<div class="seg ${n<active?'done':''} ${n===active?'active':''}"></div>`).join("")}
    <span class="here"></span></div>`;
}

function renderPierre(){
  if(state.done) return renderDone();
  const i = state.step, cfg = STEP[i];
  if(cfg.key === "email") return renderEmail();

  const picks = state.picks[i], have = picks.length, need = cfg.target;
  const ready = need===0 ? true : have>=need;
  const status = ["five favorites","three current","the future","almost done"][i];

  pierre.innerHTML = `
    <div class="phead">${mark}<div class="who">Pierre<small>${status}</small></div></div>
    ${progress(i)}
    <div class="bubble">${esc(cfg.bubble)}</div>
    <div class="search">
      <input id="q" type="text" autocomplete="off" placeholder="${esc(cfg.ph)}">
      <div class="results" id="results"></div>
    </div>
    <div class="pickwrap"><div class="picks" id="picks"></div></div>
    <div class="meter" id="meter"></div>
    <div class="nav">
      <button class="back" id="back">Back</button>
      <button class="next" id="next" ${ready?'':'disabled'}>${i<2?'Next':'Continue'}</button>
    </div>`;

  drawPicks(); drawMeter(); wireSearch();
  document.getElementById("next").onclick = e => {
    if(e.currentTarget.disabled) return; state.step++; renderPierre();
  };
  document.getElementById("back").onclick = () => {
    if(i===0){ track.classList.remove("toPierre"); return; }
    state.step--; renderPierre();
  };
}

function drawPicks(){
  const i=state.step, w=document.getElementById("picks");
  w.innerHTML = state.picks[i].map((p,x)=>`<span class="chip"><span>${esc(p.name)}</span>
    <button data-x="${x}" aria-label="Remove">&times;</button></span>`).join("");
  w.querySelectorAll("button").forEach(b=>b.onclick=()=>{state.picks[i].splice(+b.dataset.x,1);renderPierre();});
}
function drawMeter(){
  const i=state.step, have=state.picks[i].length, need=STEP[i].target, m=document.getElementById("meter");
  m.innerHTML = need===0 ? `<b>${have}</b> added . optional`
    : `<b>${have}</b> of <b>${need}</b> . ${have<need?(need-have)+' to go':'ready'}`;
}

let timer=null, ctrl=null;
function wireSearch(){
  const q=document.getElementById("q"), box=document.getElementById("results");
  q.focus();
  q.oninput=()=>{const t=q.value.trim();clearTimeout(timer);
    if(t.length<2){box.innerHTML="";return;} timer=setTimeout(()=>runSearch(t,box),220);};
}
async function runSearch(term,box){
  try{
    if(ctrl) ctrl.abort(); ctrl=new AbortController();
    const r=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(term),{signal:ctrl.signal});
    const data=await r.json(); const i=state.step;
    const chosen=new Set(state.picks[i].map(p=>p.id));
    const rows=data.slice(0,6).map(d=>d.show).filter(s=>!chosen.has(s.id));
    box.innerHTML=rows.map(s=>{
      const yr=s.premiered?s.premiered.slice(0,4):"";
      const net=(s.network&&s.network.name)||(s.webChannel&&s.webChannel.name)||"";
      const img=s.image&&s.image.medium?`<img src="${s.image.medium}" alt="">`:`<div class="noimg"></div>`;
      const tail=[yr,net].filter(Boolean).join(" . ");
      return `<div class="res" data-id="${s.id}" data-name="${esc(s.name)}">${img}
        <div class="meta"><div class="nm">${esc(s.name)}</div><div class="yr">${esc(tail)}</div></div></div>`;
    }).join("");
    box.querySelectorAll(".res").forEach(el=>el.onclick=()=>addPick(+el.dataset.id,el.dataset.name));
  }catch(e){}
}
function addPick(id,name){
  const i=state.step, max=STEP[i].target;
  if(max && state.picks[i].length>=max){flashMeter();return;}
  if(!state.picks[i].some(p=>p.id===id)) state.picks[i].push({id,name});
  const q=document.getElementById("q"); if(q) q.value="";
  document.getElementById("results").innerHTML=""; renderPierre();
}
function flashMeter(){const m=document.getElementById("meter");if(!m)return;
  m.style.color="var(--amber)";setTimeout(()=>m.style.color="",600);}

function renderEmail(){
  const valid=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email);
  pierre.innerHTML=`
    <div class="phead">${mark}<div class="who">Pierre<small>almost done</small></div></div>
    ${progress(3)}
    <div class="bubble">${esc(STEP[3].bubble)}</div>
    <div class="search">
      <input id="email" type="email" data-kb="email" autocomplete="email" placeholder="${esc(STEP[3].ph)}" value="${esc(state.email)}">
    </div>
    <div class="pickwrap"></div>
    <div class="meter">i'll send your room and a recap of your picks</div>
    <div class="nav">
      <button class="back" id="back">Back</button>
      <button class="next" id="done" ${valid?'':'disabled'}>Build my room</button>
    </div>`;
  const inp=document.getElementById("email"); inp.focus();
  inp.oninput=()=>{state.email=inp.value.trim();
    const ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email);
    document.getElementById("done").disabled=!ok;};
  document.getElementById("back").onclick=()=>{state.step--;renderPierre();};
  document.getElementById("done").onclick=e=>{if(e.currentTarget.disabled)return;state.done=true;renderDone();};
}

function renderDone(){
  pierre.innerHTML=`
    <div class="phead">${mark}<div class="who">Pierre<small>you're in</small></div></div>
    ${progress(4)}
    <div class="bubble">You're in. I'll have your room ready in your inbox.</div>
    <div class="pickwrap"><div class="meter" style="line-height:1.6">
      <b>${state.picks[0].length}</b> favorites . <b>${state.picks[1].length}</b> current . <b>${state.picks[2].length}</b> waiting<br>
      sent to ${esc(state.email)}</div></div>
    <div class="nav"><button class="back" id="restart" style="flex:1">Start over</button></div>
    <div class="stub">DEMO . capture only, no email is actually sent</div>`;
  document.getElementById("restart").onclick=()=>{
    state.step=0;state.picks=[[],[],[]];state.email="";state.done=false;
    track.classList.remove("toPierre");
    setTimeout(()=>{pierre.innerHTML="";},520);
  };
}

// ---- Cube embedding ---------------------------------------------------------
// Fill the iframe completely, and let a pinch contract back to cube navigation
// (the overlay captures touches, so it needs its own way out).
if (window.parent !== window) {
  document.documentElement.style.height = "100%";
  document.body.style.padding = "0";
  document.body.style.minHeight = "100%";
  document.body.style.height = "100%";
  document.body.style.alignItems = "stretch";
  const face = document.querySelector(".face");
  if (face) { face.style.width = "100%"; face.style.height = "100%"; face.style.borderRadius = "0"; face.style.border = "0"; }
  // Back navigation is the floating cube button only (double-tap / pinch removed).
}
// Keep momentum scrolling responsive: nudge .bscroll off its top/bottom edge as a drag
// begins so the first up-swipe isn't eaten by iOS overscroll chaining.
const _bsc=document.querySelector('.bscroll');
if(_bsc) document.addEventListener('touchstart',()=>{
  const max=_bsc.scrollHeight-_bsc.clientHeight; if(max<=0) return;
  if(_bsc.scrollTop<=0) _bsc.scrollTop=1; else if(_bsc.scrollTop>=max) _bsc.scrollTop=max-1;
},{passive:true});
</script>
