<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=overlays-content, viewport-fit=cover">
  <title>pangolinRC</title>
  <script>
    // Flat is the app. The 3D cube was retired 2026-09-14 — the root now always
    // routes to the flat swipe/tab shell. This stub is the site + native (Capacitor)
    // entry point; replace() keeps it out of history. Any legacy pg_mode='cube' is
    // ignored and cleared so a returning device lands on flat.
    try { localStorage.removeItem('pg_mode'); } catch (e) {}
    location.replace('/app.html' + location.search);
  </script>
  <meta http-equiv="refresh" content="0; url=/app.html">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a14; color: #f3ede4;
      font-family: system-ui, -apple-system, sans-serif; }
    .wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    a { color: #e89f3d; }
  </style>
</head>
<body>
  <div class="wrap"><noscript><a href="/app.html">Enter pangolinRC →</a></noscript></div>
</body>
</html>
