/* Cross-face contract. In production the cube shell provides window.cube and
   window.viewingLog. Standalone (no shell) we shim them so this face still runs:
   rotateTo falls back to the on-screen flash, on/emit are a tiny local bus, and
   viewingLog reads and writes the in-file LOG array (the one store). */
const _bus={};
if(!window.cube){
  window.cube={
    rotateTo(face,payload){
      // Embedded: call the shell directly so the tap's activation carries through
      // (lets Pierre raise the keyboard). Standalone: the on-screen flash.
      if(window.parent!==window){
        if(typeof window.parent.cubeRotateTo==="function") window.parent.cubeRotateTo(face, payload||{});
        else window.parent.postMessage({type:"cube:rotateTo",face,payload:payload||{}},"*");
      } else { flashFallback(face,payload||{}); }
    },
    on(evt,handler){ (_bus[evt]=_bus[evt]||[]).push(handler); },
    emit(evt,payload){ (_bus[evt]||[]).forEach(h=>h(payload)); }
  };
}
if(!window.viewingLog){
  window.viewingLog={
    all(){ return LOG; },
    get(showId){ return LOG.find(s=>s.id===showId)||null; },
    upsert(record){ const i=LOG.findIndex(s=>s.id===record.id);
      if(i>=0)LOG[i]={...LOG[i],...record}; else LOG.push(record); },
    recordWatch(showId,{season,number,at}){ const s=LOG.find(x=>x.id===showId); if(!s)return;
      const idx=s.episodes.findIndex(e=>e.season===season&&e.number===number);
      if(idx>=0)s.watched=Math.max(s.watched,idx+1);
      s.lastWatched={season,number,title:(s.episodes[idx]&&s.episodes[idx].title)||"",at:at||new Date().toISOString()}; },
    setStopped(showId,bool){ const s=LOG.find(x=>x.id===showId); if(s)s.stopped=!!bool; },
    setPlan(showId,plan){ const s=LOG.find(x=>x.id===showId); if(s)s.plan=plan; }
  };
}

/* Episodes-to-Log lifecycle events (episode:logged, show:finished, show:stopped,
   show:resumed) are intentionally not subscribed yet. The finish and stop
   animations stay driven by the demo chips for now. Wire cube.on to these once
   the Episodes face emits them. */

/* Standalone fallback for cube.rotateTo: the existing on-screen flash. */
function flashFallback(face,payload){
  const o=document.getElementById("flash"),lbl=o.querySelector(".flabel");
  if(face==="pierre"){
    lbl.innerHTML="&#8594; PIERRE";
    o.querySelector(".fsub").textContent="Add a show";
    o.querySelector(".fnote").textContent="Pierre checks your history first";
    o.classList.add("show"); setTimeout(()=>o.classList.remove("show"),900);
    return;
  }
  const s=payload.showId?LOG.find(x=>x.id===payload.showId):null;
  const name=(payload.show&&payload.show.name)||(s?s.name:(payload.name||""));
  const planLabel=payload.plan?payload.plan.label:null;
  lbl.innerHTML="&#8594; "+(face||"episodes").toUpperCase();
  o.querySelector(".fsub").innerHTML=planLabel?esc(planLabel):esc(name);
  o.querySelector(".fnote").textContent=planLabel?("plan adopted \u00b7 "+name):"";
  o.classList.add("show"); setTimeout(()=>o.classList.remove("show"),planLabel?1050:850);
}

/* Add a show: route to Pierre with an add intent. Never creates a record. */
function addShow(){ cube.rotateTo("pierre",{intent:"add"}); }

/* Publish a snapshot of the store to the cube shell so Pierre and Episodes can
   read the user's real history (status branch, resume position). Name + TVMaze
   id let other faces match a typed show against what is already tracked. */
function publishLog(){
  if(window.parent===window) return;
  // The show to resume, as a ready-to-load Episodes payload, so the Watch face can
  // resume the last thing watched when it opens.
  const last=resumeShow();
  window.parent.postMessage({type:"log:data", shows: LOG.map(s=>({
    id:s.id, tvmazeId:s.tvmazeId||null, kind:s.kind||'show', name:s.name, status:s.status,
    total:s.total, released:s.released, watched:s.watched, lastWatched:s.lastWatched,
    stopped:!!s.stopped, forceCompleted:!!s.forceCompleted, comfort:!!s.comfort,
    returnDate:s.returnDate||null, bucket:bucketOf(s)
  })), resume: last ? episodesPayload(last,false) : null }, "*");
}

/* ---- Account persistence (signed-in members) ----------------------------- */
// Title-level state lives server-side now (watch_title); episode progress flows
// through POST /episodes. PATCH a title's bucket or run a bulk op (finish/reset).
function patchTitle(s, body){
  const email=acct(); if(!email || !s || !s.titleId) return Promise.resolve();
  return fetch(API+"/profile/"+encodeURIComponent(email)+"/titles/"+encodeURIComponent(s.titleId),
    {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body||{})}).catch(()=>{});
}

// Build a LOG record from a /titles row. The catalog already carries name, poster,
// counts and bucket — no TVmaze fetch needed. The full title_id ('tvmaze:81110' /
// 'tmdb:123') is the key everywhere (carried in tvmazeId for message compatibility).
function recordFromTitle(t){
  const today=new Date(t.updated_at||Date.now()).toISOString().slice(0,10);
  const isMovie=t.kind==='movie';
  return { id:"acct-"+t.title_id, titleId:t.title_id, tvmazeId:t.title_id, kind:t.kind,
    q:t.name, name:t.name, poster:t.poster||null, platform:t.platform||"",
    summary:t.summary||"",
    status:t.title_status||(isMovie?"Film":"Unknown"), failed:false,
    episodes:[], total:t.total||0, released:t.released||0, watched:t.watched||0,
    lastWatched: t.last_season ? {season:t.last_season,number:t.last_number,title:"",at:today} : null,
    lastDate:today, returnDate:null,
    comfort:t.status==="comfort", forceCompleted:t.status==="completed", stopped:t.status==="stopped",
    plan:null, isNew:false, addedSeq:0,
    runtime: t.runtime||null,   // movie length (episodes.runtime of the single unit), for "min left"
    // Seed a movie's paused position from its summed minutes so the tile bar/meta show
    // progress on cold load (episode shows fill from watched counts instead).
    lastMinute: isMovie ? (t.minutes||0) : 0, startedAt:t.started_at||null, epDetail:{}, currentEpisodeId:t.current_episode_id||null,
    releaseDate: t.premiered||null,          // film's theatrical release (drives the ticket freshness class)
    ticketAt: t.ticket_at||null,             // when a theater ticket was logged (epoch ms) → shows the stub badge
    ticketDate: t.ticket_date||null,         // the ticket's printed date ("TUE, AUG 04") → real screening day
    ticketTime: t.ticket_time||null };       // the ticket's showtime ("6:30 PM") → auto-flip point (+25 min previews)
}

// Load the signed-in member's tracked titles from the catalog-backed endpoint.
async function loadAccount(email){
  _wowPrefetched=false; _wowModesPrefetched=false;   // fresh account load → re-derive scheduler
  if(window.WoW){ try{ await WoW.store.load(email); }catch(_){} }
  try{
    const r=await fetch(API+"/profile/"+encodeURIComponent(email)+"/titles"); if(!r.ok) return [];
    const data=await r.json();
    return (data.titles||[]).map(recordFromTitle);
  }catch(e){ return []; }
}

// Episode face reported progress within an episode (minutes / done / BP). Writes
// the single watch_episode row; the server recomputes the bucket + resume pointer,
// then we refresh the title's counts from the authoritative list.
function applyProgress(pr){
  const email=acct(); if(!email) return;
  // pr.tvmazeId IS the title_id ('tvmaze:…' / 'tmdb:…'). Derive the episode key from
  // it directly so the write ALWAYS lands server-side — even if the Log face hasn't
  // loaded this show into memory yet (watching before the Log opened used to silently
  // drop the write, which lost the resume pointer and left the next open at S1E1).
  const titleId = pr.tvmazeId; if(!titleId) return;
  const episodeId = titleId+":s"+(pr.season||1)+"e"+(pr.number||1);
  const s=LOG.find(x=>x.titleId===titleId || x.tvmazeId===titleId);
  if(s){   // keep the in-memory snapshot in step for a snappy Log render
    s.lastWatched={season:pr.season||1,number:pr.number||1,title:"",at:new Date().toISOString().slice(0,10)};
    s.lastMinute = pr.done ? 0 : (pr.minute||0);
    if(pr.started_at!=null) s.startedAt=pr.started_at;
    s.lastDate=new Date().toISOString().slice(0,10); s.isNew=false;
    render(); renderPierre();
  }
  fetch(API+"/profile/"+encodeURIComponent(email)+"/episodes/"+encodeURIComponent(episodeId),
    {method:"POST", headers:{"Content-Type":"application/json"},
     body:JSON.stringify({done:!!pr.done, minute:pr.minute||0, bp:!!pr.bp, sessions:pr.sessions||[]})})
    .then(async ()=>{ if(s){ refreshTitle(titleId); }
      else { LOG = await loadAccount(email); render(); renderPierre(); } })   // pull in the show we just persisted
    .catch(()=>{});
}

// Pull one title's authoritative counts/bucket back into its LOG record.
async function refreshTitle(titleId){
  const email=acct(); if(!email) return;
  try{
    const r=await fetch(API+"/profile/"+encodeURIComponent(email)+"/titles"); if(!r.ok) return;
    const t=((await r.json()).titles||[]).find(x=>x.title_id===titleId);
    const s=LOG.find(x=>x.titleId===titleId); if(!t || !s) return;
    s.watched=t.watched||0; s.total=t.total||0; s.released=t.released||0;
    s.forceCompleted=t.status==="completed"; s.stopped=t.status==="stopped"; s.comfort=t.status==="comfort";
    s.lastWatched = t.last_season ? {season:t.last_season,number:t.last_number,title:"",at:s.lastDate} : s.lastWatched;
    s.currentEpisodeId = t.current_episode_id || s.currentEpisodeId;
    render(); renderPierre();
  }catch(_){}
}

/* Selecting a show on Log loads it on Episodes at the user's position (resume to
   last watched if there is one, otherwise from the beginning). The Watch face now
   loads episodes from the catalog by title_id. */
function episodesPayload(s, fromStart){
  // Resume LANDS ON the server's current episode (first not-done). BP-backfill keeps
  // that pointer honest even when earlier episodes were never logged, so it's the
  // partially-watched episode, or the next one if the current is finished.
  let pat = {kind:"beginning"};
  if(!fromStart && !s.comfort && s.currentEpisodeId){
    const m = /:s(\d+)e(\d+)$/i.exec(s.currentEpisodeId);
    if(m) pat = {kind:"resume", season:+m[1], number:+m[2], on:true};
  }
  return { titleId:s.titleId, kind:s.kind, name:s.name, pattern:pat };
}

// Distinct real seasons (drops specials/season 0) in ascending order.
function seasonsOf(eps){
  return [...new Set((eps||[]).map(e=>e.season).filter(n=>n>=1))].sort((a,b)=>a-b);
}
// Where to land when a season chip is tapped. Default is the season's first episode,
// but if the member has watched into that season we resume at the next episode to
// watch (the LOG face restores the saved minute marker on that episode). We pass the
// last finished episode number as the resume point; the LOG face focuses the next one.
function seasonResumeNumber(s, season){
  const eps=s._eps;   // account detail: per-episode done flags
  if(eps && eps.length){
    const done=eps.filter(e=>e.season===season && e.done).map(e=>e.number);
    return done.length ? Math.max(...done) : 0;   // 0 → start of season
  }
  // Seed/DEMO records carry no per-episode progress; fall back to the single pointer.
  if(s.lastWatched && s.lastWatched.season===season) return s.lastWatched.number||0;
  return 0;
}
function seasonJump(s, season){
  const number=seasonResumeNumber(s, season);
  cube.rotateTo("episodes", Object.assign(episodesPayload(s), {pattern:{kind:"resume", season:season, number:number}}));
}
// Fill the expanded card's SEASONS chips. Seed records carry s.episodes; account
// records don't, so we lazily fetch the title's episodes once and cache the seasons.
async function fillSeasons(s){
  if(!s || s.kind==="movie") return;
  const host=document.getElementById("seas-"+s.id); if(!host) return;
  let seasons=s._seasons;
  if(!seasons){
    const email=acct();
    if(email && s.titleId){
      // Account record: pull the full episode list (carries per-episode done/minute),
      // cache it for the resume-aware jump, and derive the season list from it.
      try{ const r=await fetch(API+"/profile/"+encodeURIComponent(email)+"/titles/"+encodeURIComponent(s.titleId));
        if(r.ok){ const d=await r.json(); s._eps=d.episodes||[]; seasons=seasonsOf(s._eps); } }catch(e){}
    }
    if(!seasons && s.episodes && s.episodes.length){ seasons=seasonsOf(s.episodes); }  // seed/DEMO fallback
    s._seasons = seasons = seasons || [];
  }
  if(document.getElementById("seas-"+s.id)!==host) return;   // card collapsed/changed mid-fetch
  if(seasons.length<2){ host.innerHTML=""; return; }          // 0/1 season: nothing to pick
  const cur=(s.lastWatched && s.lastWatched.season) || seasons[0];
  const chips=seasons.map(n=>{
    const isCur=n===cur;
    return '<button class="exc-seas-chip'+(isCur?" cur":"")+'" data-season="'+n+'">'+n+'</button>';
  }).join("");
  host.innerHTML='<div class="exc-seas-label">SEASONS</div><div class="exc-seas-grid">'+chips+'</div>';
  host.querySelectorAll(".exc-seas-chip").forEach(b=>b.addEventListener("click",ev=>{
    ev.stopPropagation(); seasonJump(s, +b.dataset.season);
  }));
}

// Map whatever Pierre/Join hands us (bare tvmaze id, bare tmdb id, or a prefixed
// id) onto a canonical title_id.
function toTitleId(show){
  const id=String(show.id||"");
  if(id.startsWith('tvmaze:')||id.startsWith('tmdb:')) return id;
  return (show.kind==='movie') ? ('tmdb:'+id) : ('tvmaze:'+id);
}

/* Pierre's add flow asks the shell to add the picked title here too. The server
   materializes the catalog + per-user episode rows (/catalog/initiate); we then
   reload the list. Idempotent: an already-tracked title is not duplicated. */
async function addToLog(show, pattern){
  const titleId=toTitleId(show);
  const norm=(show.name||"").toLowerCase();
  const existing=LOG.find(s=>s.titleId===titleId || (s.name&&s.name.toLowerCase()===norm));
  if(existing){
    if(existing.stopped){ existing.stopped=false; patchTitle(existing,{status:'current'}); }
    existing.lastDate=new Date().toISOString().slice(0,10); consumeWatchOpen(); render(); renderPierre(); return;
  }
  const email=acct(); if(!email) return;   // signed-out: nothing to materialize against
  try{
    const r=await fetch(API+"/catalog/initiate",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email, title_id:titleId, pattern:pattern||{kind:"beginning"}})});
    if(!r.ok) return;
    LOG = await loadAccount(email);                       // bring in the new title with real counts
    const s=LOG.find(x=>x.titleId===titleId); if(s){ s.isNew=true; s.addedSeq=++addSeq; }
    consumeWatchOpen();
    render(); renderPierre();
  }catch(e){ /* Pierre validated the title; ignore transient failures */ }
}

// Re-pull the account whenever WATCH rotates into view, so a show added from BROWSE or
// Pierre (or any face) while we weren't focused appears without a full page reload — the
// catalog/initiate already persisted it, this just resyncs the list. Belt-and-suspenders
// to the addShow message, which can race the iframe's own cold-load. NEW badges already
// in memory are preserved across the resync.
// A title chosen on another face (BROWSE/Pierre stamps pg_watch_open) opens here:
// select its card and switch to its bucket so WATCH lands "already open" on it. Cleared
// once consumed, so a later manual pick on WATCH isn't overridden.
function consumeWatchOpen(){
  let want=''; try{ want=localStorage.getItem('pg_watch_open')||''; }catch(_){}
  if(!want) return;
  const s=LOG.find(x=>x.titleId===want);
  if(!s) return;                       // not in the list yet → try again on the next sync
  selectedId=s.id; activeTab=bucketOf(s);
  try{ localStorage.removeItem('pg_watch_open'); }catch(_){}
}

let _refreshing=false;
async function refreshLog(){
  if(DEMO || _refreshing) return;
  const email=acct(); if(!email) return;
  _refreshing=true;
  try{
    const prevNew=new Map(LOG.filter(s=>s.isNew).map(s=>[s.titleId, s.addedSeq]));
    const fresh=await loadAccount(email);
    fresh.forEach(s=>{ if(prevNew.has(s.titleId)){ s.isNew=true; s.addedSeq=prevNew.get(s.titleId); } });
    fresh.sort((a,b)=>new Date(b.lastDate)-new Date(a.lastDate));
    LOG=fresh; consumeWatchOpen(); render(); renderPierre();
  }catch(_){ /* transient; keep the current list */ }
  _refreshing=false;
}

window.addEventListener("message",(e)=>{
  if(e.data && e.data.type==="cube:focus"){ refreshLog(); return; }   // resync on rotate-in
  if(e.data && e.data.type==="cube:payload" && e.data.face==="log"){
    const p=e.data.payload||{};
    // Front-door deep-link: land on the COMFORT tab and open the named marathon
    // (so the marathon's own back button returns cleanly to this tab).
    if(p.openMarathon){
      if(activeTab!=="comfort") switchTab("comfort");
      const m=MARATHONS.find(x=>x.id===p.openMarathon);
      if(m) openMarathon(m);
    }
    // A ticket just logged in Pierre → land on its tab (CURRENT = upcoming, COMPLETED =
    // already screened) and select the tile once the log reloads.
    if(p.focusTicket && p.focusTicket.titleId){
      const tab=p.focusTicket.tab||'current', tid=p.focusTicket.titleId;
      Promise.resolve(refreshLog()).then(()=>{
        if(activeTab!==tab) switchTab(tab);
        const s=LOG.find(x=>x.titleId===tid); if(s){ selectedId=s.id; }
        render(); renderPierre();
      });
    }
    if(p.addShow && p.addShow.id) addToLog(p.addShow, p.pattern);
    if(p.progress && p.progress.tvmazeId) applyProgress(p.progress);   // Episode minute log
    // Episode finale tap (MVP): finish the matching show and land back on CURRENT.
    if(p.finishShow && p.finishShow.tvmazeId){
      const s=LOG.find(x=>x.tvmazeId===p.finishShow.tvmazeId);
      if(s && bucketOf(s)!=="completed"){
        if(activeTab!=="current") switchTab("current");
        setTimeout(()=>finishShow(s.id,"current"),80);
      }
    }
  }
});

function burst(cx,cy){const fx=document.getElementById("fx");
  for(let i=0;i<40;i++){const p=document.createElement("div");p.className="particle";
    const ang=Math.random()*Math.PI*2,vel=50+Math.random()*170;
    p.style.left=cx+"px";p.style.top=cy+"px";
    p.style.setProperty("--dx",Math.cos(ang)*vel+"px");p.style.setProperty("--dy",(Math.sin(ang)*vel-(70+Math.random()*90))+"px");
    p.style.setProperty("--rot",(Math.random()*720-360)+"deg");p.style.setProperty("--dur",(0.9+Math.random()*0.7)+"s");
    if(Math.random()<0.62){p.textContent="\u{1F37F}";p.style.fontSize=(11+Math.random()*11)+"px";}else p.classList.add("dot");
    fx.appendChild(p);setTimeout(()=>p.remove(),1800);}}
function dustParticles(rect,fr){const fx=document.getElementById("fx");
  for(let i=0;i<60;i++){const p=document.createElement("div");p.className="ash";
    p.style.left=(rect.left-fr.left+Math.random()*rect.width)+"px";p.style.top=(rect.top-fr.top+Math.random()*rect.height)+"px";
    p.style.setProperty("--dx",(Math.random()*30-15)+"px");p.style.setProperty("--dy",(50+Math.random()*120)+"px");p.style.setProperty("--dur",(0.7+Math.random()*0.6)+"s");
    fx.appendChild(p);setTimeout(()=>p.remove(),1500);}}

function finishShow(id, land){
  const tileEl=document.querySelector('.tile[data-id="'+id+'"]'),s=LOG.find(x=>x.id===id); if(!s)return;
  const fr=face.getBoundingClientRect();
  if(tileEl){const tr=tileEl.getBoundingClientRect();
    burst(tr.left-fr.left+tr.width/2,tr.top-fr.top+tr.height/2);
    const tab=document.querySelector('.tab[data-tab="completed"]').getBoundingClientRect();
    tileEl.style.transition="transform .75s cubic-bezier(.5,0,.2,1),opacity .75s ease";
    tileEl.style.transform="translate("+((tab.left+tab.width/2)-(tr.left+tr.width/2))+"px,"+((tab.top+tab.height/2)-(tr.top+tr.height/2))+"px) scale(.1)";
    tileEl.style.opacity="0";}else burst(fr.width/2,fr.height/2);
  s.forceCompleted=true;s.watched=s.total; patchTitle(s,{op:'finish'});
  const tabEl=document.querySelector('.tab[data-tab="completed"]');tabEl.classList.add("pulse");setTimeout(()=>tabEl.classList.remove("pulse"),700);
  setTimeout(()=>{render();renderPierre();},780); setTimeout(()=>switchTab(land||"completed"),1300);
  // After the popcorn: Pierre catches the reaction. He hosts the thought and
  // the share offer on his own face — no in-face comment box.
  setTimeout(()=>routeFinishedToPierre(s),900);
}

// Every finished watch (film or series finale) routes to Pierre for the thought.
function routeFinishedToPierre(s){
  if(window.parent===window) return;
  const payload={ intent:'note', finished:true, kind:s.kind||'show', show:s.name, titleId:s.titleId||null };
  window.parent.postMessage({type:'cube:rotateTo', face:'pierre', payload}, '*');
}

// ─── Per-episode archive: every completed episode's full record in one place ──
// Folds session timestamps, tickets, audio comments, friends' co-view comments +
// replies, and reflections into ONE collapsible block per episode (no more "viewing
// info separate from comment data"). CURRENT cards pass includeBp=false (real
// watches only); COMPLETED passes true (the full record, BP episodes included).
function epCodeOf(season, number){ return 'S'+String(season||1).padStart(2,'0')+'E'+String(number||0).padStart(2,'0'); }
function hmClock(ms){ try{ return new Date(ms).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }catch(_){ return ''; } }
function markAt(ms){ const m=Math.round((ms||0)/60000); return Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); }
// One shared, in-DOM <audio> element keeps playback INSIDE the face — a fresh
// `new Audio()` inside the cube iframe can hand the clip to an external player.
let _archAudio=null;
function playAudio(url){
  if(!url) return;
  if(!_archAudio){ _archAudio=document.createElement('audio'); _archAudio.setAttribute('playsinline',''); _archAudio.preload='none'; document.body.appendChild(_archAudio); }
  try{ _archAudio.pause(); }catch(_){}
  _archAudio.src=url; _archAudio.currentTime=0;
  _archAudio.play().catch(()=>{});
}

async function loadEpisodeArchive(s, includeBp){
  const host=document.getElementById('arch-'+s.id); if(!host) return;
  const email=acct(); if(!email || !s.titleId){ host.innerHTML='<div class="vw-empty">sign in to see episodes</div>'; return; }
  const sid=encodeURIComponent(s.titleId), em=encodeURIComponent(email);
  let detail={episodes:[]}, comments=[], tickets=[], refs=[], coview=[];
  try{
    // Co-view needs the mutual-follow set first; the rest fan out in parallel.
    let friends=[];
    try{ const fr=await fetch(API+'/profile/'+em+'/follows'); if(fr.ok) friends=((await fr.json()).friends||[]).map(f=>f.email); }catch(_){}
    const reqs=[
      fetch(API+'/profile/'+em+'/titles/'+sid),
      fetch(API+'/transcribe/comments?showId='+sid+'&email='+em),
      fetch(API+'/tickets?showId='+sid+'&email='+em),
      fetch(API+'/reflections?showId='+sid+'&email='+em),
      // seenMs=MAX → a completed episode reveals all of its co-view comments.
      friends.length ? fetch(API+'/transcribe/coview?showId='+sid+'&email='+em+'&with='+encodeURIComponent(friends.join(','))+'&seenMs='+Number.MAX_SAFE_INTEGER) : null
    ];
    const [dr,cr,tr,rr,vr]=await Promise.all(reqs.map(r=>r||Promise.resolve(null)));
    if(dr&&dr.ok) detail=await dr.json();
    if(cr&&cr.ok) comments=(await cr.json()).comments||[];
    if(tr&&tr.ok) tickets=(await tr.json()).tickets||[];
    if(rr&&rr.ok) refs=(await rr.json()).reflections||[];
    if(vr&&vr.ok) coview=(await vr.json()).comments||[];
  }catch(_){}
  renderEpisodeArchive(host, s, {episodes:detail.episodes||[], comments, tickets, refs, coview}, includeBp);
}

function renderEpisodeArchive(host, s, data, includeBp){
  const isMovie = s.kind==='movie';
  // Completed episodes only; drop force-advanced (BP) unless this is COMPLETED.
  let eps=(data.episodes||[]).filter(e=>e.done && (includeBp || !e.bp));
  // A film has no real episode rows — fold its whole record into one block.
  if(isMovie || !eps.length){
    if(isMovie || data.tickets.length || data.comments.length || data.refs.length || data.coview.length)
      eps=[{ key:isMovie?'🎬':'', name:isMovie?'Film':'', sessions:[], bp:false, _all:true }];   // '🎬' = stored data key, never rendered
  }
  if(!eps.length){ host.innerHTML='<div class="vw-empty">nothing logged yet</div>'; return; }

  const key=e=>e.key!==undefined?e.key:epCodeOf(e.season,e.number);
  const ticketsByEp={}, commentsByEp={}, coviewByEp={};
  data.tickets.forEach(t=>{ (ticketsByEp[t.episodeId||'']||=[]).push(t); });
  data.comments.forEach(c=>{ (commentsByEp[c.episodeId||'']||=[]).push(c); });
  data.coview.forEach(c=>{ (coviewByEp[c.episodeId||'']||=[]).push(c); });
  // Reflections tie to a ticket → its episode; orphan (null-ticket) ones ride newest.
  const ticketEp={}; data.tickets.forEach(t=>{ ticketEp[t.id]=t.episodeId||''; });
  const reflByEp={}, orphanRefs=[];
  data.refs.forEach(r=>{ const k=(r.ticketId && ticketEp[r.ticketId]!==undefined)?ticketEp[r.ticketId]:null;
    if(k!==null) (reflByEp[k]||=[]).push(r); else orphanRefs.push(r); });

  // Newest-finished first (latest session finishTs, else latest ticket).
  const sortTs=e=>{ let m=0; (e.sessions||[]).forEach(x=>{ const t=Math.max(x.finishTs||0,x.startTs||0); if(t>m) m=t; });
    (ticketsByEp[key(e)]||[]).forEach(t=>{ if((t.createdAt||0)>m) m=t.createdAt; }); return m; };
  eps.sort((a,b)=>sortTs(b)-sortTs(a));

  // A different show than the state remembers → start it all-closed.
  if(archState.showId !== s.id) archState = { showId:s.id, open:false, eps:new Set() };

  const rowsHTML = eps.map((e,i)=>{
    const k = e._all ? (Object.keys(ticketsByEp)[0] ?? Object.keys(commentsByEp)[0] ?? Object.keys(coviewByEp)[0] ?? '') : key(e);
    const sessions=e.sessions||[];
    const fin=sessions.filter(x=>x.finished).pop();
    // Ticketed film → the viewing header shows the real screening date, not the upload day.
    const tScreen = (isMovie && s.ticketAt) ? parseTicketDate(s.ticketDate, s.ticketAt) : null;
    const when = e._all
      ? (tScreen ? new Date(tScreen).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})
                 : (s.lastDate?relDate(s.lastDate):''))
      : (fin?fin.date:'');
    const head = e._all ? (isMovie?'Film':'Viewing') : ('<b>'+key(e)+'</b>'+(e.name?' '+esc(e.name):''));
    const refl = (reflByEp[k]||[]).concat(i===0?orphanRefs:[]);
    const body = archiveBody(s, k, sessions, ticketsByEp[k]||[], commentsByEp[k]||[], coviewByEp[k]||[], refl, includeBp);
    const openCls = archState.eps.has(k) ? ' open' : '';   // restore this episode's state
    return '<div class="vw'+openCls+'" data-k="'+esc(String(k))+'">'+
      '<div class="vw-head"><span class="vw-caret">&#8250;</span><span class="vw-when">'+head+
        (when?' <span class="th">&middot; '+when+'</span>':'')+'</span></div>'+
      '<div class="vw-body">'+body+'</div></div>';
  }).join('');

  // Whole log starts collapsed behind one header; the chevron > turns to v on tap.
  const label = isMovie ? 'VIEWING' : 'VIEWING LOG';
  host.innerHTML = '<div class="arch-toggle"><span class="arch-caret">&#8250;</span>'+label+
    ' <span class="arch-n">'+eps.length+'</span></div><div class="arch-list">'+rowsHTML+'</div>';
  host.classList.toggle('open', !!archState.open);   // restore the master toggle
  host.querySelector('.arch-toggle').addEventListener('click',()=>{
    archState.open = !archState.open; host.classList.toggle('open', archState.open);
  });

  // Each episode toggles independently; its open/closed persists in archState.eps so the
  // next render (refresh/rotate-in) restores exactly what the member left open.
  host.querySelectorAll('.vw-head').forEach(h=>h.addEventListener('click',()=>{
    const vw=h.parentElement, k=vw.dataset.k||'';
    if(vw.classList.toggle('open')) archState.eps.add(k); else archState.eps.delete(k);
  }));
  host.querySelectorAll('.ep-tix').forEach(b=>b.addEventListener('click',()=>showImg(b.dataset.img)));
  host.querySelectorAll('.ep-play').forEach(b=>b.addEventListener('click',()=>playAudio(b.dataset.audio)));
  host.querySelectorAll('.ep-share').forEach(b=>b.addEventListener('click',()=>viewingShare(s, b.dataset.tid||null, includeBp)));
  host.querySelectorAll('.rf-share').forEach(b=>b.addEventListener('click',()=>reshareFromLog(s, b.dataset)));
  host.querySelectorAll('.rf-del').forEach(b=>b.addEventListener('click',()=>deleteLogEntry(b)));
}
// Stage 3 — share a past reflection from the logs. Hands the existing text (+ audio URL /
// comment id for a recorded one) to Pierre, who rebuilds the card and offers the share.
function reshareFromLog(s, d){
  if(window.parent===window) return;
  const payload={ intent:'reshare', show:s.name, titleId:s.titleId||null, kind:s.kind||'show',
    ep:d.key||'', text:d.txt||'', audioUrl:d.audio||'', commentId:d.id||'' };
  window.parent.postMessage({type:'cube:rotateTo', face:'pierre', payload}, '*');
}

// One episode block's inner body: sessions, tickets, my comments, friends' comments
// + replies, reflections — everything for that episode, together.
function archiveBody(s, k, sessions, tickets, comments, coview, refl, includeBp){
  let h='';
  // 1) session timestamps (date · finished/paused · Nm · in→out); BP dimmed.
  if(sessions.length){
    h+='<div class="ep-sessions">'+sessions.slice().reverse().map(x=>{
      if(x.bp) return '<div class="ep-sess bp">BP &middot; force-advanced</div>';
      const span=x.startTs?(' <span class="ts">&middot; '+hmClock(x.startTs)+'&rarr;'+(x.finishTs?hmClock(x.finishTs):'…')+'</span>'):'';
      return '<div class="ep-sess">'+esc(x.date||'')+' &middot; '+(x.finished?'finished':'paused')+' &middot; '+(x.minutes||0)+'m'+span+'</div>';
    }).join('')+'</div>';
  }
  // 2) tickets
  tickets.forEach(t=>{ const cap=[t.date,t.time,t.theater].filter(Boolean).join(' · ');
    h+='<div class="ep-line"><button class="ep-tix" data-img="'+esc(t.ticketUrl)+'"><span>&#127903;</span> ticket</button>'+
       (cap?'<span class="ep-cap">'+esc(cap)+'</span>':'')+'</div>'; });
  // 3+4) comments + replies. Replies (co-view) thread under their parent, which may
  // be one of MY comments or a friend's comment. /transcribe/comments returns my
  // OWN replies too, but co-view already threads those — dedupe so they show once.
  const repliesByParent={}; coview.forEach(c=>{ if(c.replyTo) (repliesByParent[c.replyTo]||=[]).push(c); });
  const cvIds=new Set(coview.map(c=>c.id));
  comments.filter(c=>!cvIds.has(c.id)).forEach(c=>{ h+=myCommentLine(c); (repliesByParent[c.id]||[]).forEach(r=>h+=coviewLine(r,true)); });
  coview.filter(c=>!c.replyTo).forEach(c=>{ h+=coviewLine(c,false); (repliesByParent[c.id]||[]).forEach(r=>h+=coviewLine(r,true)); });
  // 5) reflections
  refl.forEach(r=>{ h+='<div class="ep-refl">&ldquo;'+esc(r.text)+'&rdquo; <span class="rq">'+relDate(new Date(r.createdAt).toISOString())+'</span>'+
    '<button class="rf-share" data-txt="'+esc(r.text)+'" data-key="'+esc(k||'')+'">Share</button>'+
    '<button class="rf-del" data-rid="'+esc(r.id||'')+'" title="Delete">&#10005;</button></div>'; });
  // 6) share a thought (lands as a reflection on this episode's first ticket, if any)
  h+='<div class="ep-actions"><button class="ep-share" data-tid="'+((tickets[0]&&tickets[0].id)||'')+'">&#8599; share a thought</button></div>';
  return h;
}
function myCommentLine(c){
  const play=c.audioUrl?'<button class="ep-play" data-audio="'+esc(c.audioUrl)+'">&#9654;</button>':'';
  const share='<button class="rf-share" data-txt="'+esc(c.transcription||'')+'" data-audio="'+esc(c.audioUrl||'')+'" data-id="'+esc(c.id||'')+'" data-key="'+esc(c.episodeId||'')+'">Share</button>';
  const del='<button class="rf-del" data-cid="'+esc(c.id||'')+'" title="Delete">&#10005;</button>';
  return '<div class="ep-cmt mine">'+play+'<span class="ep-mark">'+markAt(c.timestampMs)+'</span>'+
    '<span class="ep-txt">'+esc(c.transcription||'Audio')+'</span>'+share+del+'</div>';
}
function coviewLine(c, nested){
  const play=c.audioUrl?'<button class="ep-play" data-audio="'+esc(c.audioUrl)+'">&#9654;</button>':'';
  return '<div class="ep-cmt '+(nested?'reply':'friend')+'">'+play+
    '<span class="ep-who">'+esc(c.author||'friend')+(nested?' &#8617;':'')+'</span>'+
    '<span class="ep-mark">'+markAt(c.timestampMs)+'</span>'+
    '<span class="ep-txt">'+esc(c.transcription||'Audio')+'</span></div>';
}

// Delete one of my own viewing-log entries — a reflection (data-rid) or an audio comment
// (data-cid) — via the scoped DELETE endpoints, then drop the row from view.
async function deleteLogEntry(btn){
  const email=acct(); if(!email) return;
  const rid=btn.dataset.rid, cid=btn.dataset.cid;
  if(!rid && !cid) return;
  if(!confirm('Delete this? This can’t be undone.')) return;
  const url = rid ? (API+'/reflection/'+encodeURIComponent(rid)) : (API+'/transcribe/'+encodeURIComponent(cid));
  btn.disabled=true;
  try{
    const r = await fetch(url, { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
    if(r.ok || r.status===404){ const row=btn.closest('.ep-refl, .ep-cmt'); if(row) row.remove(); }
    else { btn.disabled=false; alert('Could not delete that.'); }
  }catch(_){ btn.disabled=false; alert('Could not delete that.'); }
}

// Share a thought → Pierre hosts the entry (and the share offer) on his face;
// the thought persists as a reflection on this viewing's ticket.
function viewingShare(s, ticketId, includeBp){
  if(window.parent===window) return;
  const payload={ intent:'note', offerShare:true, show:s.name, titleId:s.titleId||null, ticketId:ticketId||null };
  window.parent.postMessage({type:'cube:rotateTo', face:'pierre', payload}, '*');
}
async function saveReflection(showId, ticketId, text){
  const email=acct(); if(!email || !text) return;
  try{ await fetch(API+'/reflection',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({userEmail:email, showId, ticketId:ticketId||null, text})}); }catch(_){}
}
function showImg(url){ const lb=document.getElementById('imgLb'); if(!lb||!url)return;
  lb.querySelector('img').src=url; lb.onclick=()=>lb.classList.remove('show'); lb.classList.add('show'); }

function stopShow(id){
  const tileEl=document.querySelector('.tile[data-id="'+id+'"]'),s=LOG.find(x=>x.id===id); if(!s)return;
  const fr=face.getBoundingClientRect();
  if(tileEl){dustParticles(tileEl.getBoundingClientRect(),fr);tileEl.classList.add("dusting");}
  s.stopped=true; patchTitle(s,{status:'stopped'}); setTimeout(()=>{render();renderPierre();},640);
}

const OWNER_EMAIL='edward.m.willett@gmail.com';
// COMPLETED → "try again": reset progress and send the show back to CURRENT.
function tryAgain(id){
  const s=LOG.find(x=>x.id===id); if(!s)return;
  s.forceCompleted=false; s.stopped=false; s.watched=0; s.lastWatched=null;
  s.lastMinute=0; s.startedAt=null; s.epDetail={}; s.isNew=false;
  s.lastDate=new Date().toISOString().slice(0,10);
  selectedId=null; patchTitle(s,{op:'reset'}); switchTab("current"); renderPierre();
}
// COMPLETED/STOPPED → "remove from log": a real, permanent delete of THIS member's
// title + all its progress (the shared catalog row stays). The DELETE endpoint is
// scoped to the caller's own email, so any signed-in member may delete their own —
// not just the owner. Irreversible, so confirm first.
function removePermanently(id){
  const s=LOG.find(x=>x.id===id); if(!s)return;
  if(!confirm('Delete “'+(s.name||'this title')+'” from your log? This removes it and all its viewing history for good.')) return;
  const i=LOG.indexOf(s); if(i>=0) LOG.splice(i,1);
  selectedId=null;
  const email=acct();
  if(email && s.titleId)
    fetch(API+"/profile/"+encodeURIComponent(email)+"/titles/"+encodeURIComponent(s.titleId),{method:"DELETE"}).catch(()=>{});
  render(); renderPierre();
}

function switchTab(name){activeTab=name; selectedId=null;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab===name));render();}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchTab(t.dataset.tab)));
document.getElementById("marBack").addEventListener("click",closeMarathon);
function firstCurrent(){return LOG.filter(s=>bucketOf(s)==="current"&&!s.failed&&!s.forceCompleted&&!s.stopped&&s.watched<s.released)[0]
  || LOG.filter(s=>bucketOf(s)==="current"&&!s.failed&&!s.forceCompleted&&!s.stopped)[0];}
document.getElementById("finishBtn").addEventListener("click",()=>{const t=firstCurrent();if(t){if(activeTab!=="current")switchTab("current");setTimeout(()=>finishShow(t.id),60);}});
// Watch + stop watching now live inline on each CURRENT show's expanded card.

function buildSavings(){
  document.getElementById("savings").textContent=money(TOTAL_SAVED);
  const rows=SUBS.map(s=>'<div class="sav-row"><span class="svc">'+esc(s.name)+'</span><span class="full">'+money(s.full)+
    '</span><span class="paid">'+money(s.paid)+' <b>&times;'+s.months+'</b></span></div>').join("");
  document.getElementById("savCard").innerHTML='<h4>WHAT THE PROGRAM COVERS</h4>'+rows+
    '<div class="sav-total"><span class="t">SAVED SO FAR</span><span class="v">'+money(TOTAL_SAVED)+'</span></div>'+
    '<div class="sav-foot">Half of each bill, covered in exchange for your viewing data. That data is the product.</div>';
}
document.getElementById("addBtn").addEventListener("click",e=>{e.stopPropagation();addShow();});
document.getElementById("savingsBtn").addEventListener("click",e=>{e.stopPropagation();document.getElementById("savpop").classList.add("show");});
document.getElementById("savpop").addEventListener("click",()=>document.getElementById("savpop").classList.remove("show"));

(async function(){buildSavings();
  // DEMO is always the showcase seed. Otherwise a signed-in member loads their
  // saved shows from the account; a signed-out MVP visitor starts empty.
  const email=acct();
  if(DEMO)        LOG = await Promise.all(SEED.map(hydrate));
  else if(email)  LOG = await loadAccount(email);
  else            LOG = [];
  LOG.sort((a,b)=>new Date(b.lastDate)-new Date(a.lastDate));
  // Cold open lands with the last-watched show already selected (expanded card),
  // so WATCH shows the last series and its action buttons without a tap. Only when
  // it sits in the default CURRENT tab — don't yank the user off another bucket.
  const _resume=resumeShow();
  if(_resume && activeTab==="current" && bucketOf(_resume)==="current") selectedId=_resume.id;
  consumeWatchOpen();   // a title chosen right before a reload still opens here
  render();renderPierre();})();

// Re-hydrate when the session changes (login/logout in another face).
window.addEventListener("storage", async (e)=>{
  if(e.key!=="pg_user" && e.key!=="pg_refresh") return;
  const email=acct();
  if(DEMO) return;
  LOG = email ? await loadAccount(email) : [];
  LOG.sort((a,b)=>new Date(b.lastDate)-new Date(a.lastDate)); render(); renderPierre();
});

/* Pinch to contract back to the cube. The face overlay captures touches when
   active, so it needs its own way out, like the other faces. */
if(window.parent!==window){
  // Fill the cube face edge to edge: no card, no rounded corners, no black margin.
  // With the face at full height its flex layout pins the head/tabbar and only
  // the shows pane (.scroll) scrolls.
  const _de=document.documentElement, _b=document.body;
  _de.style.height="100%"; _de.style.padding="0"; _de.style.display="block"; _de.style.overflow="hidden";
  _b.style.height="100%"; _b.style.minHeight="100%"; _b.style.padding="0"; _b.style.margin="0";
  _b.style.display="block"; _b.style.overflow="hidden";
  face.style.width="100%"; face.style.height="100%"; face.style.maxWidth="none";
  face.style.aspectRatio="unset"; face.style.borderRadius="0"; face.style.border="0";
  // Back navigation is the floating cube button only (double-tap / pinch removed).
  // Keep native momentum scrolling responsive: nudge .scroll a hair off its top/
  // bottom edge as each drag begins so the first up-swipe isn't eaten by overscroll
  // chaining ("had to scroll down a little first").
  const _sc=document.querySelector(".scroll");
  if(_sc) document.addEventListener("touchstart",()=>{
    const max=_sc.scrollHeight-_sc.clientHeight; if(max<=0) return;
    if(_sc.scrollTop<=0) _sc.scrollTop=1; else if(_sc.scrollTop>=max) _sc.scrollTop=max-1;
  },{passive:true});
}
