<!--
  Cube Face: LOG  (v4)
  v4 changes:
   - Orphan fix: titles with "Show: Subtitle" break at the colon, never leave
     a one-word last line. text-wrap:pretty handles the rest.
   - Comfort is now a different object: a paired row. Poster tile on the left,
     the rewatch PLAN on the right (label + a barcode bar + episode count).
     The barcode shows which episodes the plan includes, in a new palette
     colour (--plan). Clicking adopts the plan onto the Episodes face (stubbed
     as a flash here; the small Pierre to reset/edit/re-cut lives on Episodes).
   - Pierre always offers a Top 10 / Top 5. SVU carries a Pierre-generated
     "Top 10" to show the auto-offer next to the human-curated plans.
   - Plan kinds: all (complete), seasons (first N), seasonsScatter (e.g. Logan
     episodes), top (Pierre's top-N). Demo subsets, labelled as such.

  Data: TVMaze live. Plans, watched counts, prices, return dates = seeds.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#181210; --base-2:#211915; --line:#352a23;
    --amber:#E9A23C; --watched:#1c5a37; --avail:#46c46f; --unrel:#463d36;
    --countdown:#caa15e; --ash:#6b5d52; --plan:#bb8ae6; --text:#f5efe9; --muted:#b3a193;
    --hot:#ff5a3c; --fresh:#46c46f; --casual:#c9a15e;   /* theater ticket freshness */
    --mine:#FFFFFF; --friend:#F0C070; --reply:#A8E0A0;   /* comment tiers: me / friend / reply */
    --display:"Space Grotesk",sans-serif; --body:"Inter",sans-serif; --mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0c0907;color:var(--text);font-family:var(--body);min-height:100%;
    display:flex;align-items:center;justify-content:center;padding:16px}

  .face{width:min(92vw,460px);aspect-ratio:1/1;background:var(--base);border:1px solid var(--line);
    border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative}

  .head{display:flex;align-items:flex-start;justify-content:space-between;padding:13px 15px 8px;flex-shrink:0}
  .label{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--muted)}
  .savings{text-align:right;line-height:1;cursor:pointer;user-select:none}
  .savings .amt{font-family:var(--display);font-weight:700;font-size:17px;color:var(--amber)}
  .savings .cap{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--muted);margin-top:2px}
  .savings:hover .amt{filter:drop-shadow(0 0 6px rgba(233,162,60,.55))}
  .headright{display:flex;align-items:center;gap:11px}
  .addbtn{flex-shrink:0;padding:6px 11px;border:1px solid var(--line);border-radius:999px;
    background:var(--base-2);color:var(--amber);font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.04em;line-height:1;
    white-space:nowrap;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s ease,box-shadow .15s ease,transform .1s ease}
  .addbtn:hover{border-color:var(--amber);box-shadow:0 0 6px rgba(233,162,60,.35)}
  .addbtn:active{transform:scale(.92)}

  .pierre{flex-shrink:0;padding:6px 15px 9px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
  .pierre .read{display:flex;align-items:center;gap:8px;min-height:16px}
  .pierre .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;box-shadow:0 0 6px rgba(233,162,60,.7)}
  .pierre .line{font-size:11.5px;color:var(--text);line-height:1.25}
  .pierre .line b{font-weight:600} .pierre .line .q{color:var(--muted)}
  .pierre .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .pierre .chip{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);
    font-size:9px;letter-spacing:.02em;padding:4px 8px;border-radius:999px;cursor:pointer;transition:all .15s ease}
  .pierre .chip.on{color:var(--amber);border-color:var(--amber)}
  .pierre .chip.demo{border-style:dashed} .pierre .spacer{flex:1}
  /* CURRENT-tab action buttons: grey until a show is selected, then orange */
  .pierre .chip.act{color:var(--muted);border-color:var(--line)}
  .pierre .chip.act.lit{color:var(--amber);border-color:var(--amber);box-shadow:0 0 6px rgba(233,162,60,.35)}

  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 15px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .scroll::-webkit-scrollbar{width:5px} .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid.list{grid-template-columns:1fr;gap:12px}

  /* Poster tiles (current / returning / completed) */
  .tile{aspect-ratio:1/1;border-radius:12px;overflow:hidden;position:relative;background:var(--base-2);cursor:pointer;border:1px solid var(--line)}
  .tile.selected{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber),0 0 16px rgba(233,162,60,.5)}
  /* CURRENT-tab tap: the tapped tile stays put; a panel (buttons + synopsis)
     opens in the OTHER column of its row. The synopsis grows the row and pushes
     the tiles below it down. Tile keeps its side: left tile → panel right, and
     right tile → panel left (panel rendered first in source for that case). */
  .exp-row{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start}
  .exp-row > .tile{flex:0 0 calc(50% - 5px);aspect-ratio:1/1;
    border-color:var(--amber);box-shadow:0 0 0 2px var(--amber),0 0 16px rgba(233,162,60,.5)}
  .exp-row > .ex-panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;padding:2px 2px 4px}
  .exp-row .ex-title{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.1;color:var(--text)}
  .exp-row .ex-watch{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
    font-family:var(--display);font-weight:700;font-size:15px;color:#1a130b;
    background:linear-gradient(135deg,#f2b457,#e89f3d);border:none;border-radius:10px;padding:10px 22px;
    cursor:pointer;box-shadow:0 8px 20px -10px rgba(232,159,61,.85)}
  .exp-row .ex-watch:active{transform:scale(.96)}
  .exp-row .ex-syn{font-size:11.5px;line-height:1.45;color:var(--muted)}
  .exp-row .ex-stop{align-self:flex-start;margin-top:2px;font-family:var(--mono);font-size:11px;
    letter-spacing:.04em;color:var(--muted);background:transparent;border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;cursor:pointer}
  .exp-row .ex-stop:active{color:#ff8a8a;border-color:#ff8a8a}
  /* Selected-show expanded card: snaps to the top, poster left, two-line buttons. */
  .exp-card{grid-column:1/-1;background:var(--base-2);border:1px solid var(--amber);border-radius:14px;
    box-shadow:0 0 0 1px var(--amber),0 10px 26px -14px rgba(233,162,60,.7);padding:12px;
    display:flex;flex-direction:column;gap:11px;cursor:pointer}
  .exc-top{display:flex;gap:12px;align-items:flex-start}
  .exc-poster{flex:0 0 84px;width:84px;height:84px;border-radius:10px;background-size:cover;
    background-position:center top;background-color:#16100c}
  .exc-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
  /* SEASONS picker: number chips to the right of the poster/title. The season you
     are in gets the amber marker; every chip taps through to that season on the LOG face. */
  .exc-seas-col{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:9px;max-width:122px}
  .exc-seasons{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .exc-seas-label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted)}
  .exc-seas-grid{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
  .exc-seas-chip{min-width:27px;height:27px;padding:0 6px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.025);color:var(--text);font-family:var(--mono);font-weight:700;font-size:12px;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  .exc-seas-chip:active{transform:scale(.93)}
  .exc-seas-chip.cur{border-color:var(--amber);background:rgba(233,162,60,.16)}
  .exc-title{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.1;color:var(--text)}
  .exc-meta{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--muted)}
  .exc-syn{font-size:11.5px;line-height:1.45;color:var(--muted);max-height:4.4em;overflow:hidden}
  .exc-btns{display:flex;gap:10px}
  .exc-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;
    padding:11px 8px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:12.5px;line-height:1.05}
  .exc-btn .ic{font-size:15px;line-height:1}
  .exc-btn .lbl{text-align:left}
  .exc-btn.watch{color:#1a130b;background:linear-gradient(135deg,#f2b457,#e89f3d);box-shadow:0 8px 20px -10px rgba(232,159,61,.85)}
  .exc-btn.watch:active{transform:scale(.97)}
  .exc-btn.stop{color:#e9b9b9;background:transparent;border:1px solid var(--line)}
  .exc-btn.stop:active{color:#ff8a8a;border-color:#ff8a8a;transform:scale(.97)}
  .exc-btn.share{color:var(--amber);background:transparent;border:1px solid var(--amber)}
  .exc-btn.share:active{background:rgba(233,162,60,.16);transform:scale(.97)}

  /* Share dialog: a modal over the whole face. Friend list (all checked by
     default) + invite-by-text + send. */
  .sh-ov{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(8,6,4,.72);backdrop-filter:blur(2px)}
  .sh-card{width:100%;max-width:440px;max-height:86%;display:flex;flex-direction:column;
    background:var(--panel,#211a13);border:1px solid var(--amber);border-radius:16px 16px 0 0;
    box-shadow:0 -10px 40px -16px rgba(0,0,0,.9);padding:16px 16px 20px}
  .sh-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .sh-head .t{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15;color:var(--text)}
  .sh-x{flex:0 0 auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:2px 4px}
  .sh-all{display:flex;align-items:center;gap:9px;padding:9px 4px;cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--amber);border-bottom:1px solid var(--line)}
  .sh-list{overflow-y:auto;-webkit-overflow-scrolling:touch;margin:2px 0 4px;flex:1;min-height:40px}
  .sh-row{display:flex;align-items:center;gap:10px;padding:10px 4px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
  .sh-row .nm{flex:1;min-width:0;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sh-ck{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#1a130b}
  .sh-row.on .sh-ck{background:var(--amber);border-color:var(--amber)}
  .sh-empty{padding:14px 4px;color:var(--muted);font-size:12.5px;line-height:1.5}
  .sh-note{width:100%;box-sizing:border-box;margin-top:6px;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:inherit;font-size:13px;padding:10px}
  .sh-actions{display:flex;gap:10px;margin-top:12px}
  .sh-btn{flex:1;border:none;border-radius:11px;padding:13px 8px;cursor:pointer;
    font-family:var(--display);font-weight:700;font-size:13px}
  .sh-send{color:#1a130b;background:linear-gradient(135deg,#f2b457,#e89f3d)}
  .sh-send:disabled{opacity:.45}
  .sh-text{color:var(--amber);background:transparent;border:1px solid var(--amber)}
  .sh-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;
    background:rgba(20,15,10,.96);border:1px solid var(--amber);color:var(--text);
    padding:11px 18px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px -12px rgba(0,0,0,.8)}
  /* completed card: green treatment + single WATCH AGAIN pill in the corner */
  .exp-card.completed{position:relative;border-color:#3f7a44;
    box-shadow:0 0 0 1px #3f7a44,0 10px 26px -14px rgba(108,192,112,.55)}
  .exp-card.completed .exc-title,.exp-card.completed .exc-meta{padding-right:128px}
  .exc-meta.done{color:#6cc070}
  .exc-again{position:absolute;top:11px;right:11px;display:flex;align-items:center;gap:6px;z-index:2;
    border:1px solid #6cc070;background:rgba(108,192,112,.14);color:#6cc070;cursor:pointer;
    font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.05em;border-radius:999px;padding:7px 13px}
  .exc-again .ic{font-size:13px;line-height:1}
  .exc-again:active{transform:scale(.96)}
  /* completed/stopped card → permanently remove the title from the log */
  .exc-remove{display:inline-flex;align-items:center;gap:6px;margin:10px 0 2px;cursor:pointer;
    border:1px solid rgba(224,80,72,.5);background:rgba(224,80,72,.1);color:#e5726a;
    font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.05em;border-radius:999px;padding:6px 12px}
  .exc-remove:active{transform:scale(.96)}
  /* per-viewing list (one ticket = one viewing); newest open, older collapsed */
  .viewings{margin-top:11px;display:flex;flex-direction:column;gap:7px}
  .vw{border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.02);overflow:hidden}
  .vw-head{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;
    font-family:var(--mono);font-size:11px;color:var(--text);letter-spacing:.04em}
  .vw-caret{color:var(--muted);font-size:12px;transition:transform .15s;flex:none}
  .vw.open .vw-caret{transform:rotate(90deg)}
  .vw-when .th{color:#6cc070}
  .vw-body{display:none;flex-direction:column;gap:9px;padding:0 11px 11px}
  .vw.open .vw-body{display:flex}
  .vw-actions{display:flex;gap:8px;flex-wrap:wrap}
  .vw-stub,.vw-share{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;cursor:pointer;
    font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.05em}
  .vw-stub{color:#f3d9a0;background:rgba(58,13,18,.5);border:1px solid rgba(243,217,160,.45)}
  .vw-share{color:var(--amber);background:transparent;border:1px solid var(--amber)}
  .vw-stub:active,.vw-share:active{transform:scale(.96)}
  .vw-refs{display:flex;flex-direction:column;gap:6px}
  .vw-ref{font-size:11.5px;line-height:1.4;color:var(--text)}
  .vw-ref .rq{color:var(--muted);font-family:var(--mono);font-size:9px;letter-spacing:.04em}
  .vw-empty{font-family:var(--mono);font-size:10px;color:var(--muted);padding:2px 0}
  /* Per-episode archive (WATCH): one collapsible block per episode, folding session
     timestamps + tickets + comments + replies + reflections together. */
  .ep-arch{margin-top:11px;display:flex;flex-direction:column;gap:7px}
  /* Master collapse for the whole viewing log: starts closed, pops down on tap. */
  .arch-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted);
    text-transform:uppercase;padding:2px 0}
  .arch-caret{font-size:12px;transition:transform .15s;flex:none}
  .ep-arch.open .arch-caret{transform:rotate(90deg)}
  .arch-toggle .arch-n{color:var(--ash);font-weight:400}
  .arch-list{display:none;flex-direction:column;gap:7px}
  .ep-arch.open .arch-list{display:flex}
  .ep-sessions{display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
  .ep-sess{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.45}
  .ep-sess .ts{color:var(--ash)}
  .ep-sess.bp{color:var(--ash);opacity:.8}
  .ep-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ep-cap{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
  .ep-tix{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;cursor:pointer;
    font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.05em;
    color:#f3d9a0;background:rgba(58,13,18,.5);border:1px solid rgba(243,217,160,.45)}
  .ep-tix:active{transform:scale(.96)}
  .ep-cmt{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;line-height:1.4;padding:1px 0}
  .ep-cmt .ep-mark{font-family:var(--mono);font-size:9px;color:var(--muted);flex:none;margin-top:1px}
  .ep-cmt .ep-who{font-family:var(--mono);font-size:9px;flex:none;margin-top:1px;opacity:.9}
  .ep-cmt .ep-txt{flex:1;min-width:0}
  .ep-cmt.mine .ep-txt{color:var(--mine)}
  .ep-cmt.friend .ep-txt,.ep-cmt.friend .ep-who{color:var(--friend)}
  .ep-cmt.reply{padding-left:16px}
  .ep-cmt.reply .ep-txt,.ep-cmt.reply .ep-who{color:var(--reply)}
  .ep-play{flex:none;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:11px;line-height:1;
    display:flex;align-items:center;justify-content:center;color:var(--amber);
    background:rgba(233,162,60,.16);border:1px solid var(--amber)}
  .ep-play:active{transform:scale(.9)}
  .ep-refl{font-size:11.5px;line-height:1.4;color:var(--text);font-style:italic}
  .ep-refl .rq{color:var(--muted);font-family:var(--mono);font-size:9px;letter-spacing:.04em;font-style:normal}
  /* Stage 3: share a past reflection from the logs. */
  .rf-share{flex:none;margin-left:6px;background:transparent;border:1px solid var(--amber,#f0a93b);
    color:var(--amber,#f0a93b);border-radius:12px;padding:2px 9px;font-family:var(--mono);font-size:9px;
    letter-spacing:.06em;cursor:pointer;font-style:normal;vertical-align:1px}
  .ep-cmt .rf-share{align-self:center}
  /* Delete your own comment / thought from the viewing log. */
  .rf-del{flex:none;margin-left:5px;width:22px;height:22px;border-radius:50%;background:transparent;
    border:1px solid rgba(157,74,63,.6);color:#c99;font-size:11px;line-height:1;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;font-style:normal;vertical-align:1px}
  .rf-del:hover{background:rgba(157,74,63,.28);color:#fff;border-color:var(--red,#9d4a3f)}
  .ep-cmt .rf-del{align-self:center}
  .ep-actions{margin-top:3px}
  .ep-share{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;cursor:pointer;
    font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.05em;
    color:var(--amber);background:transparent;border:1px solid var(--amber)}
  .ep-share:active{transform:scale(.96)}
  /* CURRENT card action bar scrolls normally with the card (no sticky pinning — it
     janked the scroll on reverse). */
  /* tap the ticket-stub button → full ticket image */
  .imglb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(4,3,2,.93);padding:24px;cursor:zoom-out}
  .imglb.show{display:flex}
  .imglb img{max-width:100%;max-height:100%;border-radius:10px;border:1px solid var(--line)}
  .tile .poster,.pcell .poster{position:absolute;inset:0;background-size:cover;background-position:center top}
  .tile .scrim,.pcell .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,7,5,.94) 0%,rgba(10,7,5,.55) 40%,rgba(10,7,5,.04) 72%)}
  .tile .body{position:absolute;left:0;right:0;bottom:0;padding:10px;display:flex;flex-direction:column;gap:7px}
  .tile .title,.pcell .ctitle{font-family:var(--display);font-weight:700;line-height:1.08;text-shadow:0 1px 4px rgba(0,0,0,.6);
    text-wrap:pretty;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  .tile .title{font-size:13.5px;-webkit-line-clamp:2}
  .tile .meta,.tile .ret{font-family:var(--mono);font-size:9px;letter-spacing:.02em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:4px}
  .tile .meta .done{color:var(--amber);display:flex;align-items:center;gap:3px}
  .tile .ret .soon{color:var(--amber)}
  .tile .newflag{position:absolute;top:8px;left:8px;z-index:2;background:var(--amber);color:#1a1206;
    font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.12em;padding:3px 7px;border-radius:5px;

  {id:"svu",       q:"Law and Order Special Victims Unit", watchedAll:true, comfort:true, lastDate:"2026-05-10", plan:{label:"Pierre's Top 10", kind:"top", n:10}}

const SUBS=[

  {name:"Netflix",     full:26.99, paid:13.49, months:4},
  {name:"Peacock",     full:16.99, paid:8.49,  months:3},

const TOTAL_SAVED=SUBS.reduce((a,s)=>a+(s.full-s.paid)*s.months,0);

const NOW=new Date();
let LOG=[], activeTab="current", addSeq=0, selectedId=null;
// Archived rewatch passes (GET /profile/:email/passes) — null until first loaded.
let PASSES=null;
// Highlighter marker: stamps a partial-then-restarted ("highlights") pass in the Completed tab.
const HILITE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l3-1L17.5 8.5a2.1 2.1 0 0 0-3-3L4 16z"/><path d="M13.5 6.5l4 4"/><path d="M3 21h6"/></svg>';

// it (that was the "closes randomly"). Keyed by show: opening a different show resets to
// all-closed. `open` = the master toggle; `eps` = the episode keys whose block is open.
let archState = { showId:null, open:false, eps:new Set() };
const face=document.getElementById("face");

// DEMO = showcase build (dummy savings + "finished" chip); MVP = clean product.
const DEMO = location.hostname.split('.').includes('demo') || new URLSearchParams(location.search).has('demo');
if(!DEMO){
  const fb=document.getElementById("finishBtn"); if(fb) fb.style.display="none";   // MVP finishes via the Episode finale tap
  const sb=document.getElementById("savingsBtn"); if(sb) sb.style.display="none";  // MVP drops the savings object
}
// Member persistence: the Log is the single writer to the account. Signed-in
// members load their tracked shows on open and we POST each show on change.
const API = (location.protocol === 'http:' && location.hostname==='localhost') ? 'http://localhost:8787' : 'https://pangolin-rc.edward-m-willett.workers.dev';
const acct = () => { try{ return localStorage.getItem('pg_user')||''; }catch(_){ return ''; } };
const fmtDate=(iso)=>new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const daysTo=(iso)=>Math.round((new Date(iso)-NOW)/86400000);
const money=(n)=>"$"+n.toFixed(2);
const esc=(t)=>(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* Orphan fix: break "Show: Subtitle" at the colon. */
function titleHTML(name){
  const i=name.indexOf(": ");
  if(i>0) return esc(name.slice(0,i+1))+"<br>"+esc(name.slice(i+2));
  return esc(name);
}

function relDate(iso){const d=Math.round((NOW-new Date(iso))/86400000);
  if(d<=0)return"today"; if(d===1)return"yesterday"; if(d<7)return d+" days ago";
  if(d<14)return"last week"; if(d<60)return Math.round(d/7)+" weeks ago"; return Math.round(d/30)+" months ago";}

async function hydrate(seed){
  const base={...seed,name:seed.q,poster:null,status:"Unknown",failed:false,episodes:[],
    total:0,released:0,watched:0,lastWatched:null,forceCompleted:false,stopped:false};
  try{
    const url="https://api.tvmaze.com/singlesearch/shows?q="+encodeURIComponent(seed.q)+"&embed=episodes";
    const res=await fetch(url); if(!res.ok)throw new Error(res.status);
    const show=await res.json();
    const eps=(show._embedded?.episodes||[]).filter(e=>e.season>=1).sort((a,b)=>a.season-b.season||a.number-b.number);
    const released=eps.filter(e=>e.airdate&&new Date(e.airdate)<=NOW);

function wowEps(s){ return (window.WoW && s) ? WoW.epsCached(wowShowId(s)) : []; }

// Watch-pattern STAMP (WoW watchMode). Derived by classifying this show's cross-season
// watches (finishTs vs airstamp, matched by season+number) from the title detail;
// a manual choice always wins and freezes it. Hidden while UNSAMPLED / DECLINED / killed.
const _wowModes={};   // showId -> {mode, src}
async function wowClassifyShow(s){
  const showId=wowShowId(s);
  if(!window.WoW || !/^tvmaze:\d+$/.test(String(showId||''))) return;
  const eps=await WoW.episodes(showId); if(!eps.length) return;
  const email=acct(); if(!email) return;
  let detail=null; try{ const r=await fetch(API+"/profile/"+encodeURIComponent(email)+"/titles/"+encodeURIComponent(showId)); if(r.ok) detail=await r.json(); }catch(_){}
  const dEps=(detail&&detail.episodes)||[];
  const byKey={}; eps.forEach(e=>{ byKey[e.season+'-'+e.number]=e; });
  const deltas=[], tss=[];
  dEps.forEach(e=>{ if(!e.done) return; const air=byKey[e.season+'-'+e.number]; if(!air||!air.airstamp) return;
    const fin=(Array.isArray(e.sessions)?e.sessions:[]).filter(x=>x&&x.finishTs).pop(); const ts=fin?fin.finishTs:null; if(!ts) return;
    deltas.push((ts-new Date(air.airstamp).getTime())/3600000); tss.push(ts); });
  const st=WoW.store.stateNow()||{}; const killed=st.user&&st.user.globalKill; const manual=st.modes&&st.modes[showId];
  const now=Date.now(), WEEK=7*86400000;
  const lastWatch = tss.length ? Math.max.apply(null, tss) : 0;
  // Recency gate: nothing watched in the last week → DORMANT (no badge).
  if(!lastWatch || (now-lastWatch) > WEEK){ _wowModes[showId]={mode:'DORMANT', src:'derived'}; return; }
  // BINGE: 3+ episodes finished within a 3-day window in the last week.
  const recent = tss.filter(t=>now-t<=WEEK).sort((a,b)=>a-b);
  let binge=false;
  for(let i=0;i<recent.length && !binge;i++){ let c=1;
    for(let j=i+1;j<recent.length;j++){ if(recent[j]-recent[i]<=3*86400000) c++; }
    if(c>=3) binge=true; }
  if(binge){ _wowModes[showId]={mode:'MORE!', src:'derived'}; return; }
  // Else: FRESH if you're keeping up with a weekly (watched close to air), else CASUAL.
  const cls=WoW.classifyDeltas(deltas, tss, {manual, killed});
  let mode = (cls.mode==='LIVE'||cls.mode==='FRESH') ? 'FRESH' : 'CASUAL';   // vocab: Fresh/Binge/Casual
  _wowModes[showId]={mode, src:'derived'};
}
// Public-facing label: MORE! reads as BINGE everywhere the member sees it.
function wowLabel(mode){ return mode==='MORE!' ? 'BINGE' : mode; }
// The effective ON pattern for a show, ignoring any decline: a manually stored mode,
// else the derived classification, else the member's profile default (their general
// aspiration). Specific types are never picked per show here -- that is the Profile
// default's job; the show face only accepts (on) or declines (off) this pattern.
// Caught up on every aired episode AND inside the latest drop's fresh air-window
// (LIVE/FRESH, <=48h). This is the "fresh right now" signal that lights the leaf.
function wowFreshNow(s){
  if(!window.WoW || !s) return false;
  if((s.watched||0) < (s.released||0)) return false;   // still behind on aired episodes
  const ph=WoW.phase(wowEps(s));
  return !!ph && (ph.name==='LIVE' || ph.name==='FRESH');
}
function wowEffMode(showId, s){
  const st=WoW.store.stateNow()||{};
  const manual=st.modes&&st.modes[showId];
  if(manual && manual!=='DECLINED') return {mode:manual, src:'set'};
  const d=_wowModes[showId];
  const derived=(d && d.mode!=='UNSAMPLED' && d.mode!=='DECLINED' && d.mode!=='DORMANT') ? d.mode : null;
  // Binge wins (matches the fire playhead marker).
  if(derived==='MORE!') return {mode:'MORE!', src:'derived'};
  // Fresh override: catching the newest episode inside its fresh window reads as FRESH
  // now, even if the long-run median (diluted by old binges) classified this CASUAL.
  // Keeps the text badge in step with the leaf.
  if(wowFreshNow(s)) return {mode:'FRESH', src:'derived'};
  if(derived) return {mode:derived, src:'derived'};
  // No profile-default fallback: a show only earns a badge from its OWN recent activity
  // (else every show got stamped with the default). Dormant (>1 week unwatched) → none.
  return null;
}
function wowStampFor(s){
  if(!window.WoW) return null;
  // Movies have no weekly watch cadence -- the profile default shouldn't stamp them.
  // (Repeated-viewing is its own pattern, a job for a separate scheduler.)
  if(s && (s.kind==='movie' || /^tmdb:/.test(String(wowShowId(s))))) return null;
  const showId=wowShowId(s), st=WoW.store.stateNow()||{};
  if(st.user&&st.user.globalKill) return null;
  const declined=(st.modes&&st.modes[showId])==='DECLINED';   // toggled off for this show
  const eff=wowEffMode(showId, s);
  if(eff) return {mode:eff.mode, src:eff.src, off:declined};
  // Declined with no derivable/default pattern still shows a generic OFF stamp so the
  // toggle is always recoverable (tap it to switch back on).
  if(declined) return {mode:null, src:'declined', off:true};
  return null;
}
function wowStampHTML(s, big){
  const m=wowStampFor(s); if(!m) return '';
  // Only the expanded-card stamp is tappable (data-stamp); the tile stamp is display

  const cls='wowstamp'+(m.src==='set'?' set':'')+(m.off?' off':'')+(big?' big':'');
  const attr=big ? (' data-stamp="'+wowShowId(s)+'"') : '';

}
let _wowModesPrefetched=false;

// A film watched in a theater (a ticket is on file). These belong to the IRL/tickets

// physical-media movies have no ticketAt and stay.
function isTheaterMovie(s){ return !!(s && s.kind==='movie' && s.ticketAt); }
function bucketOf(s){
  if(ticketWatched(s)) return "completed";   // theater ticket: auto-flips to watched once the film has started
  if(s.stopped) return "completed";
  if(s.forceCompleted) return "completed";
  if(s.failed) return "current";
  if(s.comfort) return "comfort";
  const ended=s.status==="Ended"||s.status==="Canceled";

  if(s.watched < s.released) return "current";
  // Caught up but a new episode drops soon (in-season, e.g. a weekly mid-season show
  // waiting on next week's drop) → still CURRENT. Uses the scheduler's live airstamps.
  if(window.WoW && WoW.inSeason(wowEps(s), Date.now(), s.lastWatched)) return "current";
  // The RETURNING tab was retired -- a followed show on hiatus (caught up, next season
  // still out) stays in CURRENT with its return-countdown tile, rather than vanishing.
  if(s.returnDate) return "current";
  return ended ? "completed" : "current";
}

/* Which episodes a rewatch plan includes. Demo subsets. */
function planSet(s){
  const set=new Set(), eps=s.episodes, p=s.plan||{kind:"all"};
  const key=(e)=>e.season+"-"+e.number;
  if(p.kind==="all"){eps.forEach(e=>set.add(key(e)));}
  else if(p.kind==="seasons"){eps.filter(e=>e.season<=p.max).forEach(e=>set.add(key(e)));}
  else if(p.kind==="seasonsScatter"){const inS=eps.filter(e=>p.seasons.includes(e.season));inS.forEach((e,i)=>{if(i%2===0)set.add(key(e));});}
  else if(p.kind==="top"){const n=p.n||10,step=Math.max(1,Math.floor(eps.length/n));for(let i=0;i<eps.length&&set.size<n;i+=step)set.add(key(eps[i]));}
  return set;
}

const Pierre={

// Playhead marker: popcorn by default; flame when bingeing (3rd episode of a burst),
// leaf when the show is FRESH -- watching an episode within ~48h of its air. The leaf
// reads the phase engine directly (LIVE/FRESH air-window) so a first fresh watch lights
// it immediately, before the derived classifier has 2 samples. Movies always get popcorn.
function playheadMarkerHTML(s, leftPct){
  const popcorn='<div class="pop" style="left:'+leftPct+'%">&#127871;</div>';
  if(s.kind==='movie') return popcorn;   // movies have no weekly cadence
  const m=(typeof wowStampFor==='function')?wowStampFor(s):null;
  const mode=(m && !m.off)?m.mode:null;
  if(mode==='MORE!'||mode==='BINGE') return '<div class="pop mk flame" style="left:'+leftPct+'%"><svg viewBox="0 0 24 24"><use href="#mkFlame"/></svg></div>';
  const ph=window.WoW ? WoW.phase(wowEps(s)) : null;
  const fresh = mode==='FRESH' || (ph && (ph.name==='LIVE' || ph.name==='FRESH'));
  if(fresh) return '<div class="pop mk leaf" style="left:'+leftPct+'%"><svg viewBox="0 0 24 24"><use href="#mkLeaf"/></svg></div>';
  return popcorn;
}
function episodeBar(s){
  if(s.failed)return '<div class="bar"></div>';
  // A movie is one runtime, not a pile of episodes: fill by minutes watched / runtime.
  if(s.kind==='movie'){
    const rt=s.runtime||0, mins=Math.max(0,s.lastMinute||0), done=bucketOf(s)==="completed";
    const w=done?100:(rt>0?Math.max(0,Math.min(100,mins/rt*100)):0);
    let h='<div class="bar">';
    if(w>0)h+='<div class="seg w" style="width:'+w+'%"></div>';
    if(w<100)h+='<div class="seg u" style="width:'+(100-w)+'%"></div>';
    if(!done&&mins>0)h+=playheadMarkerHTML(s,w);
    return h+"</div>";
  }
  if(s.total===0)return '<div class="bar"></div>';
  const w=(s.watched/s.total)*100,a=((s.released-s.watched)/s.total)*100,u=((s.total-s.released)/s.total)*100;
  let h='<div class="bar">';
  if(w>0)h+='<div class="seg w" style="width:'+w+'%"></div>';
  if(a>0)h+='<div class="seg a" style="width:'+a+'%"></div>';
  if(u>0)h+='<div class="seg u" style="width:'+u+'%"></div>';
  if(bucketOf(s)!=="completed"&&s.watched>0&&s.watched<s.total&&!s.returnDate)h+=playheadMarkerHTML(s,w);
  return h+"</div>";
}
function countdownBar(s){
  const span=(new Date(s.returnDate)-new Date(s.lastDate))/86400000,elapsed=(NOW-new Date(s.lastDate))/86400000;
  const pct=Math.max(0,Math.min(100,(elapsed/span)*100)),soon=daysTo(s.returnDate)<=7;
  return '<div class="bar cd"><div class="fill'+(soon?' soon':'')+'" style="width:'+pct+'%"></div></div>';
}
function returnLine(s){const d=daysTo(s.returnDate);
  if(d<=7) return '<div class="ret"><span class="soon">&#128276; new season</span><span class="soon">in '+d+'d</span></div>';
  return '<div class="ret"><span>returns '+fmtDate(s.returnDate)+'</span><span>'+d+'d</span></div>';}
function metaFor(s){
  if(s.failed)return '<span>data unavailable</span>';
  if(s.kind==='movie'){
    if(bucketOf(s)==="completed")return '<span class="done">&#10003; watched</span><span>film</span>';
    const rt=s.runtime||0, mins=Math.max(0,s.lastMinute||0), left=Math.max(0,rt-mins);

// WoW TAG: the next episode's airdate relative to today ("Sunday", "Next Week"...).
// Derived client-side from the episode airstamps already loaded per show. Series only.
function wowTag(s){
  if(!window.WoW || !s || s.kind==='movie') return '';
  const n = wowNext(s);
  return n ? WoW.tag(n.airstamp) : '';
}
// Films have no weekly cadence, but they still get a day badge: the weekday the film
// entered the system — its screening/watch anchor (started_at, e.g. a Tuesday ticket),
// or failing that the day the row was logged. Mirrors the series weekly-release TAG.
// A film's day badge is ONLY the theater-ticket day (screening weekday); a movie with
// no ticket gets no day badge (its freshness lives on the ticket, not a generic tag).
function filmDayTag(s){
  if(!s || s.kind!=='movie' || !s.ticketAt) return '';
  const scr = parseTicketDate(s.ticketDate, s.ticketAt);
  if(!scr) return '';
  return new Date(scr).toLocaleDateString('en-US',{weekday:'long'}).toUpperCase();

// ── Theater ticket stub badge ────────────────────────────────────────────────
// A film watched at a theater (a ticket is on file) gets a torn-ticket badge: the
// weekday you went + a freshness class from how long after theatrical release you
// caught it — HOT ≤7 days, FRESH 7–14, CASUAL after. Only films with BOTH a ticket
// and a real release date qualify (others keep the plain filmDayTag).
const TB_DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const TB_MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const TB_DOWI={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
// Turn a ticket's printed date ("TUE, AUG 04", "Aug 6 2026") into a real screening
// timestamp. Tickets rarely print a year, so infer it: an explicit 4-digit year wins;
// else if the weekday is printed (AMC does), pick the year near the upload where that
// month/day actually falls on that weekday (deterministic); else the nearest year.
function parseTicketDate(dateStr, fallbackMs){
  if(!dateStr) return fallbackMs?Number(fallbackMs):null;
  const s=String(dateStr).toLowerCase();
  const mo=s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/);
  const dy=s.match(/\b(\d{1,2})\b/);
  if(!mo||!dy) return fallbackMs?Number(fallbackMs):null;
  const month=TB_MON[mo[1]], day=parseInt(dy[1],10);
  const yr4=s.match(/\b(20\d{2})\b/), dow=s.match(/\b(sun|mon|tue|wed|thu|fri|sat)/);
  const anchor=fallbackMs?new Date(Number(fallbackMs)):new Date(), base=anchor.getFullYear();
  const nearest=()=>{ let b=base,g=Infinity; for(let y=base-2;y<=base+1;y++){ const c=new Date(y,month,day,12).getTime(), gg=Math.abs(c-anchor.getTime()); if(gg<g){g=gg;b=y;} } return b; };
  let year;
  if(yr4) year=parseInt(yr4[1],10);
  else if(dow){
    const want=TB_DOWI[dow[1]]; let b=null,g=Infinity;
    for(let y=base-3;y<=base+1;y++){ const c=new Date(y,month,day,12); if(c.getDay()===want){ const gg=Math.abs(c-anchor); if(gg<g){g=gg;b=y;} } }
    year = b!=null ? b : nearest();
  } else year=nearest();
  const ts=new Date(year,month,day,12).getTime();
  return isNaN(ts) ? (fallbackMs?Number(fallbackMs):null) : ts;
}
function ticketClass(releaseDate, whenMs){
  if(!releaseDate || !whenMs) return null;
  const rel=new Date(releaseDate+'T12:00').getTime(); if(isNaN(rel)) return null;
  const days=Math.floor((whenMs-rel)/86400000);
  if(days < -1) return null;                       // "watched" before release → not a theater catch
  if(days <= 7)  return {cls:'hot',    label:'HOT'};
  if(days <= 14) return {cls:'fresh',  label:'FRESH'};
  return           {cls:'casual', label:'CASUAL'};
}
// Deterministic RNG so a film's tear is stable across re-renders (no flicker).
function tbSeed(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function tbRand(seed){ let x=(seed||1)>>>0; return ()=>{ x=(Math.imul(x,1664525)+1013904223)>>>0; return x/4294967296; }; }
// Stub outline: straight top & bottom, a semicircle notch on the RIGHT, an irregular
// RIPPED left edge (seeded jitter). Same shape approved in the localhost preview.
function tbPath(w,h,n,rng){
  const m=h/2, jMax=6;
  let p='M 0 0 H '+w+' V '+(m-n)+' A '+n+' '+n+' 0 0 0 '+w+' '+(m+n)+' V '+h+' H 0 ';
  let y=h;
  while(y>0){ y=Math.max(0, y-(1.6+rng()*2.6)); const x=(Math.pow(rng(),0.7)*jMax); p+='L '+x.toFixed(1)+' '+y.toFixed(1)+' '; }
  return p+'L 0 0 Z';
}
// The film's real start = printed showtime + 25 min of previews. Drives the auto-flip
// from "upcoming" to watched once that moment has passed.
function screeningStart(s){
  if(!s || s.kind!=='movie' || !s.ticketAt) return null;
  const dayMs=parseTicketDate(s.ticketDate, s.ticketAt); if(!dayMs) return null;   // midday of screening day
  const d=new Date(dayMs);
  const tm=String(s.ticketTime||'').toLowerCase().match(/(\d{1,2}):(\d{2})\s*(am|pm)?/);
  if(tm){ let hh=+tm[1]; const mm=+tm[2], ap=tm[3];
    if(ap==='pm'&&hh<12)hh+=12; if(ap==='am'&&hh===12)hh=0; d.setHours(hh,mm,0,0); }
  return d.getTime() + 25*60000;
}
function ticketWatched(s){ const f=screeningStart(s); return f!=null && f<=Date.now(); }
function ticketBadge(s){
  if(!s || s.kind!=='movie' || !s.ticketAt) return '';
  // Real screening date from the ticket (weekday-confirmed year); fall back to upload time.
  const when=parseTicketDate(s.ticketDate, s.ticketAt) || Number(s.ticketAt);
  const info=ticketClass(s.releaseDate, when); if(!info) return '';
  const day=TB_DOW[new Date(when).getDay()];
  const W=54,H=34, d=tbPath(W,H,3.4, tbRand(tbSeed(s.titleId||s.name||'x')));
  return '<div class="tikbadge '+info.cls+'">'
    + '<svg viewBox="0 0 '+W+' '+H+'"><path d="'+d+'" fill="rgba(26,18,6,.92)" stroke="currentColor" stroke-width="1.5"/></svg>'
    + '<span class="tb-txt"><span class="tb-day">'+day+'</span><span class="tb-cls">'+info.label+'</span></span></div>';
}
function tileFor(s,asStopped){
  const b=bucketOf(s);
  const cls="tile"+(b==="completed"?" completed":"")+(s.failed?" failed":"")+(asStopped?" stopped":"");
  let bars='<div class="bars">'+episodeBar(s);
  if(s.returnDate&&b!=="completed")bars+=countdownBar(s);
  bars+="</div>";
  let footer;
  if(asStopped) footer='<button class="tryagain" data-act="resume" data-id="'+s.id+'">&#8635; try again</button>';
  else if(s.returnDate&&b!=="completed") footer=returnLine(s);
  else footer='<div class="meta">'+metaFor(s)+"</div>";
  const tb = ticketBadge(s);                         // theater films: torn-ticket stub
  const tg = tb ? '' : (wowTag(s) || filmDayTag(s)); // others: plain day / airdate tag
  return '<div class="'+cls+'" data-id="'+s.id+'">'+posterDiv(s)+'<div class="scrim"></div>'+
    (s.isNew?'<div class="newflag">NEW</div>':'')+
    (tb || (tg?'<div class="wowtag">'+tg+'</div>':''))+
    wowStampHTML(s)+
    '<div class="body"><div class="title">'+titleHTML(s.name)+"</div>"+bars+footer+"</div></div>";
}

// Selected-show expanded card (CURRENT + COMPLETED). Snaps to the top of the grid
// and expands in place — poster left, info right, two two-line action buttons.
function expandedCard(s, mode){
  const syn = s.summary ? esc(s.summary) : 'No synopsis yet.';
  const isMovie = s.kind==='movie';
  const pos = isMovie ? 'Film' : (s.lastWatched ? ('S'+s.lastWatched.season+' E'+s.lastWatched.number) : '');
  let metaTxt;
  const dayTg = isMovie ? filmDayTag(s) : '';
  const dayPill = dayTg ? '<span class="exc-tag">'+dayTg+'</span>' : '';
  if(mode==='completed'){ metaTxt = isMovie ? ('&#10003; watched &middot; film'+dayPill) : ('&#10003; done &middot; '+(s.total||0)+' episodes'); }
  else if(isMovie){ const rt=s.runtime||0, mins=Math.max(0,s.lastMinute||0), left=Math.max(0,rt-mins);
    metaTxt = '&#127909; film &middot; '+((mins>0&&rt>0)?(left+' min left'):(rt>0?(rt+' min'):(mins>0?'in progress':'not started')))+dayPill; }
  else { const left=s.released-s.watched; metaTxt=(pos?pos+' &middot; ':'')+(left>0?left+' left':'caught up');
    const tg=wowTag(s); if(tg) metaTxt+='<span class="exc-tag">'+tg+'</span>'; }
  const poster = s.poster ? 'style="background-image:url('+s.poster+')"'
                          : 'style="background:linear-gradient(150deg,#2a201a,#16100c)"';
  const btn=(cls,act,ic,l1,l2)=>'<button class="exc-btn '+cls+'" data-act="'+act+'" data-id="'+s.id+'">'+
    '<span class="ic">'+ic+'</span><span class="lbl">'+l1+(l2?'<br>'+l2:'')+'</span></button>';
  // COMPLETED: one corner pill, "WATCH AGAIN" → pops to the LOG side (the
  // episodes face) where the streamer wheel lets you change the viewing method,
  // e.g. theater → a streamer once it's available. No second button.
  if(mode==='completed'){
    return '<div class="exp-card completed" data-id="'+s.id+'">'+
        '<button class="exc-again" data-act="watch" data-id="'+s.id+'"><span class="ic">&#127909;</span>WATCH AGAIN</button>'+
        '<div class="exc-top"><div class="exc-poster" '+poster+'></div>'+
          '<div class="exc-info"><div class="exc-title">'+titleHTML(s.name)+'</div>'+
            '<div class="exc-meta done">'+metaTxt+'</div>'+
            '<div class="exc-syn">'+syn+'</div>'+
            '<button class="exc-remove" data-act="remove" data-id="'+s.id+'"><span class="ic">&#128465;</span>'+
              (s.stopped?'REMOVE FROM LOG':'DELETE')+'</button></div></div>'+
        '<div class="ep-arch" id="arch-'+s.id+'"><div class="vw-empty">loading episodes…</div></div>'+
        '</div>';
  }
  const btns = btn('watch','watch','&#9654;&#65039;','WATCH','')+btn('share','share','&#127873;','SHARE','')+btn('stop','stop','&#128721;','STOP','WATCHING');
  // Seasons column (chips filled async after render via fillSeasons; films have none).
  // The watch-pattern stamp lives at the bottom of this column, under the season
  // selector, as a sibling of the chips host so fillSeasons' innerHTML swap leaves it be.
  const seasonsCol = isMovie ? '' :
    '<div class="exc-seas-col"><div class="exc-seasons" id="seas-'+s.id+'"></div>'+wowStampHTML(s,true)+'</div>';
  return '<div class="exp-card" data-id="'+s.id+'">'+
      '<div class="exc-top"><div class="exc-poster" '+poster+'></div>'+
        '<div class="exc-info"><div class="exc-title">'+titleHTML(s.name)+'</div>'+
          '<div class="exc-meta">'+metaTxt+'</div><div class="exc-syn">'+syn+'</div></div>'+
        seasonsCol+'</div>'+
      '<div class="exc-btns">'+btns+'</div>'+
      '<div class="ep-arch" id="arch-'+s.id+'"><div class="vw-empty">loading episodes…</div></div>'+
      '</div>';
}
// Grid for a selectable tab: the selected show becomes a full-width expanded card
// at the top, the rest follow as tiles.
function gridWithSelection(list, mode){
  const sel = selectedId ? list.find(s=>s.id===selectedId) : null;
  if(!sel){ if(selectedId) selectedId=null; return list.map(s=>tileFor(s,false)).join(""); }
  let html = expandedCard(sel, mode);
  list.forEach(s=>{ if(s.id!==sel.id) html+=tileFor(s,false); });
  return html;
}

function barcode(s,sel){
  if(!s.episodes.length)return '<div class="barcode"></div>';
  const ticks=s.episodes.map(e=>'<i class="tk'+(sel.has(e.season+"-"+e.number)?" on":"")+'"></i>').join("");
  return '<div class="barcode">'+ticks+"</div>";
}
function crowFor(s){
  const sel=planSet(s),total=s.episodes.length;
  const meta=(s.plan&&s.plan.kind==="all")?("all "+total+" episodes"):(sel.size+" of "+total+" episodes");
  return '<div class="crow" data-id="'+s.id+'">'+
    '<div class="pcell">'+posterDiv(s)+'<div class="scrim"></div><div class="ctitle">'+titleHTML(s.name)+'</div></div>'+
    '<div class="pinfo"><div class="planlabel">'+esc(s.plan?s.plan.label:"Rewatch")+'</div>'+
      barcode(s,sel)+
      '<div class="pmeta"><span>'+meta+'</span><span class="edit">&#9998; Pierre</span></div></div></div>';
}

function counts(){

// Load the member's archived rewatch passes once (sets PASSES to an array, even []).

  try{ const r=await fetch(API+"/profile/"+encodeURIComponent(email)+"/passes"); PASSES=r.ok?((await r.json()).passes||[]):[]; }

// A pass tile: poster + "S{n} · view {ordinal}", stamped with the locked pattern
// (complete) or the highlighter marker (a partial pass restarted from the beginning).
function passTile(p){
  const poster=p.poster?"background-image:url('"+esc(p.poster)+"')":"";
  const isHi=p.pass_kind==='highlights';
  const badge=isHi
    ? '<span class="passbadge highlights">'+HILITE_SVG+'highlights</span>'
    : '<span class="passbadge">'+esc(p.pattern||'✓ complete')+'</span>';
  const where=(p.title_kind==='movie')?'film':('S'+p.season);
  const count=isHi?(p.watched_ct+' of '+p.season_ct):(p.season_ct+' eps');
  return '<div class="tile passtile" data-passid="'+esc(p.pass_id)+'">'+
    '<div class="poster" style="'+poster+'"></div><div class="scrim"></div>'+badge+

    '<span>'+esc(count)+'</span></div></div></div>';

function render(){
  counts();
  wowPrefetch();       // one-shot per account load: pull airstamps, then re-render
  wowModePrefetch();   // one-shot: derive the watch-pattern stamps, then re-render
  publishLog();
  // The "Last: …" line is noise on the COMPLETED tab, and slides away whenever a
  // show is expanded (the open card carries its own context).
  const pierreEl=document.querySelector('.pierre');
  if(pierreEl) pierreEl.style.display = (activeTab==='completed' || selectedId) ? 'none' : '';
  const grid=document.getElementById("grid");
  if(activeTab==="comfort"){ renderComfort(grid); return; }   // curated marathons (pre-beta)
  grid.classList.remove("list");
  if(activeTab==="completed"){
    const list=LOG.filter(s=>bucketOf(s)==="completed"&&!isTheaterMovie(s));
    let html = list.length ? gridWithSelection(list,"completed") : '';
    if(PASSES===null) loadPasses().then(()=>{ if(activeTab==='completed') render(); });   // one-shot
    else if(PASSES.length) html += '<div class="passhead">Rewatch passes</div>' + PASSES.map(passTile).join('');
    grid.innerHTML = html || '<div class="state">nothing finished yet</div>';
  }else{
    const list=LOG.filter(s=>bucketOf(s)===activeTab&&!isTheaterMovie(s));
    list.sort((a,b)=>{
      const an=a.isNew?0:1, bn=b.isNew?0:1;
      if(an!==bn) return an-bn;                                 // NEW shows first
      if(an===0) return (a.addedSeq||0)-(b.addedSeq||0);        // NEW: order requested
      // Timely: in-season shows sort by soonest upcoming drop; those with nothing
      // upcoming (sortKey Infinity) fall through to recently-active order.
      const ak=wowSortKey(a), bk=wowSortKey(b);
      if(ak!==bk) return ak-bk;
      return new Date(b.lastDate)-new Date(a.lastDate);         // rest: recently active
    });
    grid.innerHTML=list.length?gridWithSelection(list,"current"):'<div class="state">nothing here yet</div>';
  }
  // Tiles: CURRENT + COMPLETED tap to expand in place (other tabs handled above).
  grid.querySelectorAll(".tile").forEach(t=>t.addEventListener("click",()=>{
    const s=LOG.find(x=>x.id===t.dataset.id); if(!s||s.failed)return;
    selectCurrent(s.id);
  }));
  // Tap the expanded card (outside its buttons / archive) to collapse it. The
  // per-episode archive handles its own taps (expand blocks, play, tickets, share).
  grid.querySelectorAll(".exp-card").forEach(c=>c.addEventListener("click",ev=>{
    if(ev.target.closest("[data-act]")||ev.target.closest(".ep-arch"))return;
    selectCurrent(c.dataset.id);
  }));
  // Expanded-card actions: Watch next / Stop watching (CURRENT) · Try again / Remove (COMPLETED).
  grid.querySelectorAll(".exp-card [data-act]").forEach(el=>el.addEventListener("click",ev=>{
    ev.stopPropagation();
    const act=el.dataset.act, id=el.dataset.id, s=LOG.find(x=>x.id===id); if(!s)return;
    if(act==="watch"){ if(s.isNew){s.isNew=false;s.lastDate=new Date().toISOString().slice(0,10);} cube.rotateTo("episodes",episodesPayload(s)); render(); renderPierre(); }
    else if(act==="share"){ openShareDialog(s); }
    else if(act==="stop"){ selectedId=null; setTimeout(()=>stopShow(id),60); }
    else if(act==="tryagain"){ tryAgain(id); }
    else if(act==="remove"){ removePermanently(id); }
  }));
  // Tap the watch-pattern stamp on the expanded card to toggle it ON or OFF for this
  // show only -- never to cycle through the types (the type comes from the classifier
  // or the Profile default). OFF stores DECLINED (Pierre goes silent for the show);
  // ON clears it back to the derived/default pattern.
  grid.querySelectorAll(".wowstamp[data-stamp]").forEach(el=>el.addEventListener("click",ev=>{
    ev.stopPropagation();
    const showId=el.dataset.stamp, email=acct(); if(!email||!window.WoW) return;
    const st=WoW.store.stateNow()||{}; const off=(st.modes&&st.modes[showId])==='DECLINED';
    WoW.store.setMode(email, showId, off ? null : 'DECLINED').then(()=>render());
  }));
  // Completed card expanded → per-episode archive INCLUDING force-advanced (BP) eps.
  if(activeTab==="completed" && selectedId){ const s=LOG.find(x=>x.id===selectedId); if(s){ loadEpisodeArchive(s,true); ensureSyn(s); } }
  // Current card expanded → SEASONS chips + per-episode archive EXCLUDING BP eps,
  // and the action buttons shrink-stick to the top as the archive scrolls.
  else if(selectedId){ const s=LOG.find(x=>x.id===selectedId); if(s){ fillSeasons(s); loadEpisodeArchive(s,false); ensureSyn(s); } }
}

// Backfill a missing synopsis on the expanded card. /titles only carries summary
// once the column is populated; titles tracked before it existed fill lazily on the
// detail read, so we fetch detail here and drop the text into the open card.
async function ensureSyn(s){
  if(!s || s.summary || !s.titleId) return;
  const email=acct(); if(!email) return;
  try{
    const r=await fetch(API+"/profile/"+encodeURIComponent(email)+"/titles/"+encodeURIComponent(s.titleId));
    if(!r.ok) return;
    const d=await r.json();
    const syn=d && d.title && d.title.summary;
    if(!syn) return;
    s.summary=syn;
    if(selectedId!==s.id) return;   // card collapsed/changed mid-fetch
    document.querySelectorAll('.exp-card[data-id="'+s.id+'"] .exc-syn').forEach(el=>{ el.textContent=syn; });
  }catch(_){}
}

// sms:/mailto: from inside a cube face must drive the top window (the embedded
// face's own location swallows the scheme). navigator.share is preferred.
function openExternal(url){ try{ (window.top||window).location.href=url; }catch(_){ window.location.href=url; } }
function shToast(msg){
  document.querySelectorAll('.sh-toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='sh-toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);

function closeShareDialog(){ const o=document.getElementById('shOv'); if(o) o.remove(); }

async function openShareDialog(s){
  closeShareDialog();
  const email=acct();
  const ov=document.createElement('div'); ov.className='sh-ov'; ov.id='shOv';
  ov.innerHTML=
    '<div class="sh-card">'+
      '<div class="sh-head"><div class="t">Share “'+esc(s.name||'this')+'”</div>'+
        '<button class="sh-x" id="shX">✕</button></div>'+
      '<div class="sh-all" id="shAll"><span class="sh-ck">✓</span><span>ALL FRIENDS</span></div>'+
      '<div class="sh-list" id="shList"><div class="sh-empty">Loading friends…</div></div>'+
      '<input class="sh-note" id="shNote" type="text" maxlength="280" placeholder="add a note (optional)">'+
      '<div class="sh-actions">'+
        '<button class="sh-btn sh-text" id="shText">✉️ Invite by text</button>'+
        '<button class="sh-btn sh-send" id="shSend" disabled>Share</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov) closeShareDialog(); });
  document.getElementById('shX').onclick=closeShareDialog;

  // Invite by text shares the title outward to a non-member (or any contact).
  const inviteMsg=()=>{ const me=(localStorage.getItem('pg_username')||'').trim();
    return (me?me+' is watching “':'Watch “')+(s.name||'this show')+'” on pangolinRC: '+location.origin+'/'; };
  document.getElementById('shText').onclick=()=>{
    const msg=inviteMsg();
    if(navigator.share){ navigator.share({text:msg}).catch(()=>{}); return; }
    openExternal('sms:?&body='+encodeURIComponent(msg));
  };

  const sendBtn=document.getElementById('shSend'), listEl=document.getElementById('shList'),
        allEl=document.getElementById('shAll');
  if(!email){ listEl.innerHTML='<div class="sh-empty">Sign in to share with friends. You can still invite by text above.</div>';
    allEl.style.display='none'; return; }

  let friends=[];
  try{
    const r=await fetch(API+'/profile/'+encodeURIComponent(email)+'/follows');
    if(r.ok){ friends=((await r.json()).friends)||[]; }
  }catch(_){}
  if(!friends.length){
    listEl.innerHTML='<div class="sh-empty">No friends yet — add friends on your Profile, then share with them. For now, invite by text above.</div>';
    allEl.style.display='none'; return;
  }
  const sel=new Set(friends.map(f=>f.email));   // all selected by default
  const sync=()=>{
    sendBtn.disabled=!sel.size;
    sendBtn.textContent=sel.size?('Share with '+sel.size):'Share';
    allEl.querySelector('.sh-ck').textContent=(sel.size===friends.length)?'✓':'';
  };
  listEl.innerHTML=friends.map(f=>{
    const nm=esc(f.username||f.email);
    return '<div class="sh-row on" data-em="'+esc(f.email)+'"><span class="nm">'+nm+'</span>'+
           '<span class="sh-ck">✓</span></div>';
  }).join('');
  listEl.querySelectorAll('.sh-row').forEach(row=>{
    row.onclick=()=>{ const em=row.dataset.em;
      if(sel.has(em)){ sel.delete(em); row.classList.remove('on'); row.querySelector('.sh-ck').textContent=''; }
      else { sel.add(em); row.classList.add('on'); row.querySelector('.sh-ck').textContent='✓'; }
      sync(); };
  });
  allEl.onclick=()=>{
    const all=sel.size===friends.length;
    sel.clear(); if(!all) friends.forEach(f=>sel.add(f.email));
    listEl.querySelectorAll('.sh-row').forEach(row=>{
      const on=sel.has(row.dataset.em); row.classList.toggle('on',on); row.querySelector('.sh-ck').textContent=on?'✓':''; });
    sync();
  };
  sync();

  sendBtn.onclick=async()=>{
    if(!sel.size) return;
    sendBtn.disabled=true; sendBtn.textContent='Sharing…';
    const note=(document.getElementById('shNote').value||'').trim();
    try{
      const r=await fetch(API+'/profile/'+encodeURIComponent(email)+'/share',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ title_id:s.titleId, to:[...sel], note, show_name:s.name, poster:s.poster })});
      const d=await r.json().catch(()=>({}));
      closeShareDialog();
      const n=d.shared||0;
      shToast(n? ('Shared with '+n+' friend'+(n>1?'s':'')) : 'Already shared with them');
    }catch(_){ sendBtn.disabled=false; sync(); shToast('Could not share — try again'); }
  };
}

/* CURRENT-tab selection: tap a show to open its action panel in place, tap its
   poster (or the show again) to collapse. Re-render swaps tile ⇄ expanded card. */
function selectCurrent(id){
  selectedId = (selectedId===id) ? null : id;
  render();
  if(selectedId){ const sc=document.querySelector(".scroll"); if(sc) sc.scrollTop=0; }   // snap the expanded card to the top
